<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><title>JARVIS Chat · Deepsyq</title><meta name="robots" content="noindex"><link rel="stylesheet" href="generate-studio.css"><link rel="stylesheet" href="studio-classic-theme.css"><link rel="stylesheet" href="deepsyq-mobile-shell.css"><link rel="stylesheet" href="jarvis-core.css">
<link rel="stylesheet" href="jarvix-chat.css"><script defer src="deepsyq-site-shell.js"></script><script type="module" blocking="render" src="deepsyq-mobile-shell.js"></script><script type="module" src="jarvix-chat.js"></script></head><body><header class="topbar"><button type="button" id="dsSiteNavToggle" class="ds-site-nav-toggle-btn" aria-label="Toggle navigation" title="Меню">☰</button><a href="deepsyq.html" class="brand"><span class="brand-mark"><img src="deepsyq-logo.png" alt="" width="31" height="31"></span>Deepsyq</a></header><main class="jarvix-chat"><div class="j-chat-toolbar">
  <button type="button" id="jChatTitleBtn" class="j-title-menu-btn" aria-haspopup="true" aria-expanded="false" aria-controls="jChatDropdown" title="Диалоги и новый чат">
    <span class="j-title-brand-text">JARVIX</span>
    <span class="j-title-dot">·</span>
    <span class="j-title-mode-badge"><span id="jActiveModeLabel" data-mode="chat">ЧАТ</span> <span class="j-title-chevron">∨</span></span>
  </button>
  <select id="jHistory" class="j-history" aria-label="Conversation history" hidden></select>
  <button id="jNew" type="button" hidden>New chat</button>
  <button id="jStop" type="button" hidden>Stop waiting</button>

</div>

  <!-- Existing JARVIX conversation history; no separate chat or page. -->
  <div id="jChatDropdown" class="j-sliding-drawer" hidden>
    <div id="jDropdownBackdrop" class="j-drawer-backdrop"></div>
    <aside class="j-drawer-panel" aria-label="Диалоги JARVIX">
      <div class="j-drawer-header">
        <div class="j-drawer-title-group">
          <span class="j-drawer-heading" id="jDrawerHeading">JARVIX Чат</span>
        </div>
        <button type="button" id="jDrawerClose" class="j-drawer-close" aria-label="Закрыть меню">✕</button>
      </div>
      <div class="j-drawer-action-row">
        <button type="button" id="jMenuNewChat" class="j-drawer-new-item"><span class="j-drawer-plus" aria-hidden="true">＋</span><span>Новый чат</span></button>
      </div>
      <nav class="j-drawer-quick-nav" aria-label="JARVIX быстрый доступ">
        <button type="button" class="j-drawer-nav-item" id="jDrawerRecent"><span class="j-drawer-nav-icon" aria-hidden="true">◷</span><span>Последние чаты</span><span class="j-drawer-nav-arrow" aria-hidden="true">›</span></button>
        <button type="button" class="j-drawer-nav-item" data-j-drawer-mode="image"><span class="j-drawer-nav-icon" aria-hidden="true">▧</span><span>Изображения</span><span class="j-drawer-nav-arrow" aria-hidden="true">›</span></button>
        <button type="button" class="j-drawer-nav-item" data-j-drawer-mode="video"><span class="j-drawer-nav-icon" aria-hidden="true">▷</span><span>Видео</span><span class="j-drawer-nav-arrow" aria-hidden="true">›</span></button>
        <button type="button" class="j-drawer-nav-item" data-j-drawer-mode="audio"><span class="j-drawer-nav-icon" aria-hidden="true">♫</span><span>Аудио</span><span class="j-drawer-nav-arrow" aria-hidden="true">›</span></button>
      </nav>
      <div class="j-drawer-conversations-head">
        <span class="j-drawer-subhead">Чаты</span>
        <div class="j-drawer-conversation-actions">
          <button type="button" id="jDrawerSearchToggle" aria-label="Поиск по чатам" title="Поиск по чатам">⌕</button>
          <button type="button" id="jDrawerSortToggle" aria-label="Сначала старые чаты" title="Сортировать чаты">☷</button>
        </div>
      </div>
      <input id="jDrawerSearch" class="j-drawer-search" type="search" placeholder="Найти разговор…" aria-label="Поиск разговора" hidden>
      <div id="jMenuHistoryList" class="j-drawer-history-list"></div>
      <div class="j-drawer-footer">
        <button type="button" id="jDrawerSettings" class="j-drawer-footer-item"><span aria-hidden="true">⚙</span> Настройки</button>
        <a href="contact.html" class="j-drawer-footer-item"><span aria-hidden="true">ⓘ</span> Помощь и поддержка</a>
        <a class="j-drawer-account" id="jDrawerAccountLink" href="video-uniquifier.html#profile"><span class="j-drawer-avatar" aria-hidden="true">◉</span><span class="j-drawer-account-copy"><strong>Аккаунт DEEPSYQ</strong><small>Профиль и подписка</small></span><span aria-hidden="true">•••</span></a>
      </div>
    </aside>
  </div>

<!-- Workspace Tool Pane docked at the TOP of the Chat -->
<div id="jWorkspacePane" class="j-workspace-pane" hidden>
  <div class="j-workspace-header">
    <div class="j-workspace-title-box">
      <span class="j-workspace-badge">TOOL</span>
      <h3 id="jWorkspaceTitle">Video Uniquifier</h3>
    </div>
    <div class="j-workspace-actions">
      <button type="button" id="jWorkspaceMinimize" class="j-workspace-btn" title="Свернуть наверх" aria-label="Свернуть">▴</button>
      <button type="button" id="jWorkspaceExpand" class="j-workspace-btn" title="Развернуть" aria-label="Развернуть">⛶</button>
      <a id="jWorkspacePopout" class="j-workspace-btn" href="#" target="_blank" title="Открыть на весь экран" aria-label="Open full screen">↗</a>
      <button type="button" id="jWorkspaceClose" class="j-workspace-btn j-workspace-close" title="Закрыть инструмент" aria-label="Close tool">✕</button>
    </div>
  </div>
  <div id="jWorkspaceMinibar" class="j-workspace-minibar" hidden>
    <span class="j-minibar-pulse">⚡</span>
    <span id="jMinibarText" class="j-minibar-text">Video Uniquifier: обработка видео запущена...</span>
    <div class="j-minibar-actions">
      <button type="button" id="jMinibarExpandBtn" class="j-minibar-btn">Развернуть ▾</button>
      <button type="button" id="jMinibarCloseBtn" class="j-minibar-btn">✕</button>
    </div>
  </div>
  <div class="j-workspace-body">
    <iframe id="jWorkspaceFrame" class="j-workspace-frame" title="DeepSyQ Tool Workspace" src="about:blank"></iframe>
  </div>
</div>

<section id="jMessages" class="j-messages" aria-label="Conversation messages" aria-live="polite">
  <div id="jEmptyHero" class="j-empty-hero">
    <h2 id="jEmptyHeroTitle">Чем я могу помочь вам сегодня?</h2>
  </div>
</section>

<div class="j-chat-bottom">
  <form id="jChatForm" class="jarvix-compose">
    <div id="jAttachments" class="j-attachments" hidden></div>
    <div class="j-composer-input-row">
        <label for="jInput" class="sr-only">Сообщение для JARVIX</label>
        <textarea id="jInput" rows="1" maxlength="2000" required placeholder="Опишите, что хотите создать…"></textarea>
      </div>
      <div class="j-composer-actions-row">
        <div class="j-composer-actions-left">
          <button type="button" id="jPlus" aria-label="Add files or choose mode" aria-expanded="false" aria-controls="jPlusMenu">+</button>
          <div id="jPlusMenu" class="j-plus-menu j-hub-menu" aria-label="DEEPSYQ quick access" hidden>
            <button class="j-hub-tile" type="button" data-j-mode="image" aria-pressed="false"><span class="j-hub-glyph" data-j-icon="image" aria-hidden="true"></span><strong>Image</strong></button>
            <button class="j-hub-tile" type="button" data-j-mode="video" aria-pressed="false"><span class="j-hub-glyph" data-j-icon="video" aria-hidden="true"></span><strong>Video</strong></button>
            <button class="j-hub-tile" type="button" data-j-mode="audio" aria-pressed="false"><span class="j-hub-glyph" data-j-icon="audio" aria-hidden="true"></span><strong>Audio</strong></button>
            <a class="j-hub-tile" href="free-tools.html"><span class="j-hub-glyph" data-j-icon="tools" aria-hidden="true"></span><strong>Tools</strong></a>
            <a class="j-hub-tile" href="ai-apps.html"><span class="j-hub-glyph" data-j-icon="apps" aria-hidden="true"></span><strong>AI Apps</strong></a>
            <a class="j-hub-tile" href="deepsyq.html#inspirationPreview"><span class="j-hub-glyph" data-j-icon="inspiration" aria-hidden="true"></span><strong>Inspiration</strong></a>
            <button class="j-hub-tile" type="button" id="jAttach"><span class="j-hub-glyph j-hub-upload" aria-hidden="true"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V3m-5 5 5-5 5 5"/><path d="M4 15v5h16v-5"/></svg></span><strong>Upload</strong></button>
            <a class="j-hub-tile" href="my-creations.html"><span class="j-hub-glyph" data-j-icon="history" aria-hidden="true"></span><strong>Assets</strong></a>
          </div>
          <input id="jFiles" type="file" multiple accept="image/*,video/*,audio/*,text/plain,application/pdf,.heic,.heif,.mov,.mp4,.webm,.mkv,.avi,.mp3,.wav,.m4a,.aac,.ogg,.flac,.png,.jpg,.jpeg,.webp,.gif,.txt,.pdf" hidden>
        </div>
        <div class="j-composer-actions-right">
          <button id="jMic" type="button" aria-label="Голосовой ввод"><svg width="20" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v4M8 23h8"/></svg></button>
          <button class="j-send" id="jSend" type="submit" aria-label="Отправить сообщение"><svg class="j-send-plane" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button>
        </div>
      </div>
    </form>
  <p id="jStatus" role="status" class="j-status"></p>
</div>
</main></body></html>

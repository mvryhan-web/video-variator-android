<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video Uniquifier test version</title>
<p>Loading Video Uniquifier test version…</p>
<script>
Promise.resolve().then(async()=>{
  if('serviceWorker' in navigator){const registrations=await navigator.serviceWorker.getRegistrations();await Promise.all(registrations.map(r=>r.unregister()));}
  if('caches' in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('video-uniquifier-')).map(k=>caches.delete(k)));}
  location.replace('/index.html');
}).catch(error=>{document.querySelector('p').textContent='Could not open the test version: '+error.message;});
</script>

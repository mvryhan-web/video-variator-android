plugins {
    id 'com.android.application'
}

def defaultProductionUrl = 'https://video-variator-android.onrender.com'
def webAppUrl = (System.getenv('VV_WEB_APP_URL') ?: defaultProductionUrl).replace('\\','\\\\').replace('"','\\"')
def apiBaseUrl = (System.getenv('VV_API_BASE_URL') ?: defaultProductionUrl).replace('\\','\\\\').replace('"','\\"')
def updateApiUrl = (System.getenv('VV_UPDATE_API_URL') ?: defaultProductionUrl + '/api/version').replace('\\','\\\\').replace('"','\\"')
def signingPath = project.findProperty('VV_KEYSTORE_PATH')
def signingStorePassword = project.findProperty('VV_KEYSTORE_PASSWORD')
def signingKeyAlias = project.findProperty('VV_KEY_ALIAS')
def signingKeyPassword = project.findProperty('VV_KEY_PASSWORD')
def hasReleaseSigning = signingPath && signingStorePassword && signingKeyAlias && signingKeyPassword

android {
    namespace = 'com.videovariator.app'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.videovariator.app'
        minSdk = 26
        targetSdk = 36
        versionCode = 7
        versionName = '5.2.0'
        buildConfigField 'String', 'WEB_APP_URL', '"' + webAppUrl + '"'
        buildConfigField 'String', 'API_BASE_URL', '"' + apiBaseUrl + '"'
        buildConfigField 'String', 'UPDATE_API_URL', '"' + updateApiUrl + '"'
    }

    buildFeatures { buildConfig = true }

    signingConfigs {
        if (hasReleaseSigning) {
            create('release') {
                storeFile = file(signingPath)
                storePassword = signingStorePassword
                keyAlias = signingKeyAlias
                keyPassword = signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) signingConfig = signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-video:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.google.android.play:app-update:2.1.0'
}

plugins {
    id 'com.android.application'
}

def webAppUrl = (System.getenv('VV_WEB_APP_URL') ?: '').replace('\\','\\\\').replace('"','\\"')
def updateApiUrl = (System.getenv('VV_UPDATE_API_URL') ?: '').replace('\\','\\\\').replace('"','\\"')
def signingPath = project.findProperty('VV_KEYSTORE_PATH')
def signingStorePassword = project.findProperty('VV_KEYSTORE_PASSWORD')
def signingKeyAlias = project.findProperty('VV_KEY_ALIAS')
def signingKeyPassword = project.findProperty('VV_KEY_PASSWORD')
def hasReleaseSigning = signingPath && signingStorePassword && signingKeyAlias && signingKeyPassword

android {
    namespace = 'com.videovariator.app'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.videovariator.app'
        minSdk = 26
        targetSdk = 36
        versionCode = 3
        versionName = '3.0.0'
        buildConfigField 'String', 'WEB_APP_URL', '"' + webAppUrl + '"'
        buildConfigField 'String', 'UPDATE_API_URL', '"' + updateApiUrl + '"'
    }

    buildFeatures { buildConfig = true }

    signingConfigs {
        if (hasReleaseSigning) {
            create('release') {
                storeFile = file(signingPath)
                storePassword = signingStorePassword
                keyAlias = signingKeyAlias
                keyPassword = signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) signingConfig = signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'com.google.android.play:app-update:2.1.0'
}

name: Owner Pricing LIVE mobile carousel acceptance (read-only)
on:
  push:
    branches: [deepsyq-platform]
    paths:
      - '.github/workflows/owner-pricing-mobile-live-acceptance-20261109.yml'
permissions:
  contents: read
jobs:
  live-mobile-pricing:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install browser test environment without paid providers
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: TEST actual deepsyq.app live pricing carousel mobile and desktop
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright';
          const b=await chromium.launch({headless:true,args:['--no-sandbox']});
          try{
            for(const [name,w,h] of [['mobile-390',390,844],['mobile-650',650,850],['desktop-1360',1360,900]]){
              const mobile=name.startsWith('mobile');
              const ctx=await b.newContext({viewport:{width:w,height:h},hasTouch:mobile,isMobile:mobile});
              const page=await ctx.newPage();
              try{
                const res=await page.goto('https://deepsyq.app/pricing.html?owner_live_carousel='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});
                assert.equal(res?.status(),200,'Pricing HTTP 200');
                await page.locator('#planCards .price-plan').first().waitFor({state:'visible',timeout:25000});
                assert.equal(await page.locator('#planCards .price-plan').count(),5,'five plans');
                const track=page.locator('#planCards');
                const layout=await track.evaluate(el=>({display:getComputedStyle(el).display,snap:getComputedStyle(el).scrollSnapType,client:el.clientWidth,scroll:el.scrollWidth}));
                const credits=await page.locator('#creditCards').evaluate(el=>getComputedStyle(el).display);
                assert.equal(credits,'grid','AI credits grid preserved');
                if(mobile){
                  assert.equal(layout.display,'flex','mobile flex track');
                  assert.match(layout.snap,/x mandatory/,'snap enabled');
                  assert(layout.scroll>layout.client+100,'horizontal scroll enabled');
                  assert.equal(await page.locator('#pricePlanNext').isVisible(),true);
                  await page.waitForFunction(()=>document.querySelector('#pricePlanPosition')?.textContent?.trim()==='1 / 5',null,{timeout:12000});
                  await page.locator('#pricePlanNext').click();
                  await page.waitForFunction(()=>document.querySelector('#pricePlanPosition')?.textContent?.trim()==='2 / 5',null,{timeout:12000});
                  await page.locator('#pricePlanPrev').click();
                  await page.waitForFunction(()=>document.querySelector('#pricePlanPosition')?.textContent?.trim()==='1 / 5',null,{timeout:12000});
                  await track.evaluate(el=>el.scrollTo({left:el.scrollWidth-el.clientWidth,behavior:'instant'}));
                  await page.waitForFunction(()=>document.querySelector('#pricePlanPosition')?.textContent?.trim()==='5 / 5',null,{timeout:12000});
                  await page.locator('#priceBillingYearly').click();
                  await page.waitForFunction(()=>document.querySelector('#pricePlanPosition')?.textContent?.trim()==='5 / 5',null,{timeout:12000});
                  assert.equal(await page.locator('#planCards .price-plan').count(),5,'all cards after pricing switch');
                  await page.locator('#priceBillingMonthly').click();
                }else{
                  assert.equal(layout.display,'grid','desktop unchanged');
                  assert.equal(await page.locator('#pricePlanNext').isVisible(),false,'mobile controls hidden on desktop');
                }
                console.log('LIVE_CAROUSEL_PASS',name,JSON.stringify(layout));
              }finally{await ctx.close()}
            }
          }finally{await b.close()}
          JS

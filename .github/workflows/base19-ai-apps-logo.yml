name: BASE 19 AI Apps official website logo

on:
  pull_request:
    paths:
      - 'app/src/main/assets/ai-apps.html'
      - 'app/src/main/assets/ai-apps.css'
      - 'tests/base19-ai-apps-logo.spec.mjs'
      - '.github/workflows/base19-ai-apps-logo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-logo:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --check tests/base19-ai-apps-logo.spec.mjs
      - run: npx playwright install --with-deps chromium webkit
      - name: Check actual logo load and UI on desktop, iPhone and Android browser
        run: npx playwright test tests/base19-ai-apps-logo.spec.mjs --project=chromium --project=webkit --project=mobile-chromium --project=mobile-webkit

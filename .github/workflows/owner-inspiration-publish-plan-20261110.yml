name: Owner Inspiration 20-video protected production preflight
on:
  push:
    branches: [deepsyq-platform]
    paths:
      - '.github/workflows/owner-inspiration-publish-plan-20261110.yml'
permissions:
  contents: read
concurrency:
  group: deepsyq-surgical-pages-release
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate gallery JavaScript syntax
        run: |
          node --check app/src/main/assets/home-inspiration.js
          node --check app/src/main/assets/deepsyq.js
          node --check app/src/main/assets/ai-apps.js
      - name: Install existing guarded publisher prerequisites
        run: python -m pip install --disable-pip-version-check 'requests==2.32.3' 'blake3==1.0.8'
      - name: Read-only exact LIVE Worker/asset preflight — never publish
        run: python scripts/deepsyq_surgical_publish.py --mode plan --files 'home-inspiration.js,deepsyq.js,ai-apps.js' --commit "$GITHUB_SHA"

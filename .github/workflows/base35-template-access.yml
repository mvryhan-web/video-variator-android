name: BASE 35 template authorization integration

on:
  pull_request:
    paths:
      - 'tests/base35-template-owner-access-postgres.mjs'
      - '.github/workflows/base35-template-access.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  template-access-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vv_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vv_ai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      AI_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vv_ai_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify public template isolation and owner authorization
        run: node --test tests/base35-template-owner-access-postgres.mjs

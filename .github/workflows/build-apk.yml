name: Build Video Uniquifier APK

on:
  push:
    branches: [ main, free-tools, studio-stage-two ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: video-uniquifier-latest-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      SDKMANAGER: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
      VV_WEB_APP_URL: ${{ vars.VV_WEB_APP_URL }}
      VV_API_BASE_URL: ${{ vars.VV_API_BASE_URL }}
      VV_UPDATE_API_URL: ${{ vars.VV_UPDATE_API_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 16 SDK
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test camera recording and Gallery save on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-front emulated -camera-back emulated
          script: gradle :app:connectedDebugAndroidTest --stacktrace

      - name: Upload Android test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-camera-tests
          path: app/build/reports/androidTests/

      - name: Decode stable release keystore
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > app/release-key.jks

      - name: Build signed release APK
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --stacktrace \
            -PVV_KEYSTORE_PATH=release-key.jks \
            -PVV_KEYSTORE_PASSWORD="$KS_PASSWORD" \
            -PVV_KEY_ALIAS="$KEY_ALIAS" \
            -PVV_KEY_PASSWORD="$KEY_PASSWORD"

      - name: Select distributable APK
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk VideoUniquifier.apk
            echo "Using stable signed release APK"
          else
            cp app/build/outputs/apk/debug/app-debug.apk VideoUniquifier.apk
            echo "Using debug APK; configure signing secrets before public distribution"
          fi
          cp VideoUniquifier.apk VideoVariator.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoUniquifier-APK
          path: |
            VideoUniquifier.apk
            VideoVariator.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest APK release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          release_tag="v5.2.0-build-${GITHUB_RUN_NUMBER}"
          gh release create "$release_tag" VideoUniquifier.apk VideoVariator.apk \
            --target "$GITHUB_SHA" --title "Video Uniquifier 5.2 — Creator studio" \
            --notes "Premium interface, local portrait cutouts, experimental local captions and short video backgrounds. Processing stays on your device. Existing tools and releases are preserved."
          gh release view "$release_tag" --json isDraft,tagName,url

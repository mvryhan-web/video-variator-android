name: Build Video Variator APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Decode stable release keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > app/release-key.jks

      - name: Build signed release APK
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --stacktrace \
            -PVV_KEYSTORE_PATH=release-key.jks \
            -PVV_KEYSTORE_PASSWORD="$KS_PASSWORD" \
            -PVV_KEY_ALIAS="$KEY_ALIAS" \
            -PVV_KEY_PASSWORD="$KEY_PASSWORD"

      - name: Select distributable APK
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk VideoVariator.apk
            echo "Using stable signed release APK"
          else
            cp app/build/outputs/apk/debug/app-debug.apk VideoVariator.apk
            echo "Using debug APK; configure signing secrets before public distribution"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoVariator-APK
          path: VideoVariator.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push origin refs/tags/latest --force
          gh release create latest VideoVariator.apk \
            --title "Video Variator Android v3" \
            --notes "Latest Android build. Paid plans use time-based credits and the app supports 9:16 and 16:9 output."

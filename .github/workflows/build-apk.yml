name: Build Video Uniquifier APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      SDKMANAGER: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
      VV_WEB_APP_URL: ${{ vars.VV_WEB_APP_URL }}
      VV_API_BASE_URL: ${{ vars.VV_API_BASE_URL }}
      VV_UPDATE_API_URL: ${{ vars.VV_UPDATE_API_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 16 SDK
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Decode stable release keystore
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > app/release-key.jks

      - name: Build signed release APK
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --stacktrace \
            -PVV_KEYSTORE_PATH=release-key.jks \
            -PVV_KEYSTORE_PASSWORD="$KS_PASSWORD" \
            -PVV_KEY_ALIAS="$KEY_ALIAS" \
            -PVV_KEY_PASSWORD="$KEY_PASSWORD"

      - name: Select distributable APK
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk VideoUniquifier.apk
            echo "Using stable signed release APK"
          else
            cp app/build/outputs/apk/debug/app-debug.apk VideoUniquifier.apk
            echo "Using debug APK; configure signing secrets before public distribution"
          fi
          cp VideoUniquifier.apk VideoVariator.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoUniquifier-APK
          path: |
            VideoUniquifier.apk
            VideoVariator.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push origin refs/tags/latest --force
          gh release create latest VideoUniquifier.apk VideoVariator.apk \
            --title "Video Uniquifier Android v5" \
            --notes "Video Uniquifier v5: new branding and launcher icon, faster local processing, automatic Gallery saving, working on-device Download actions, Back navigation, Basic/Pro/Business variation limits, production API wiring, analytics, FAQ, privacy controls, and update support."

name: BASE 38 owner-admin latest data and session safety
on:
  pull_request:
    paths:
      - 'app/src/main/assets/deepsyq-admin.js'
      - 'tests/base38-admin-latest-session.spec.mjs'
      - '.github/workflows/base38-admin-latest-session.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admin-session:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --check app/src/main/assets/deepsyq-admin.js && node --check tests/base38-admin-latest-session.spec.mjs
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test tests/base38-admin-latest-session.spec.mjs --project=chromium --project=webkit --project=mobile-chromium --project=mobile-webkit

name: Agent B BASE5 uncertain video real PG16 no-spend
on:
  pull_request:
    branches: [deepsyq-platform]
    paths:
      - 'server/generation-video-submit-uncertainty.js'
      - 'tests/agent-b-base5-uncertain-video-postgres.mjs'
      - '.github/workflows/agent-b-base5-uncertain-video-postgres.yml'
permissions:
  contents: read
jobs:
  uncertain-video-pg:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deepsyq_purchased_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d deepsyq_purchased_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      P0_PURCHASED_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/deepsyq_purchased_test
      STRIPE_SECRET_KEY: ''
      GEMINI_API_KEY: ''
      BYTEPLUS_API_KEY: ''
      AI_BILLING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Parse original source and real-PG test
        run: |
          node --check server/generation-video-submit-uncertainty.js
          node --check tests/agent-b-base5-uncertain-video-postgres.mjs
      - name: Actual disposable PG16 ledger-safety and row-lock checks
        run: node --test tests/agent-b-base5-uncertain-video-postgres.mjs

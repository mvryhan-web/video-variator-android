name: Deepsyq AI template rights gate

concurrency:
  group: ci-deepsyq-template-rights-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - 'server/generation-templates.js'
      - 'server/ai-migrations.js'
      - 'server/migrations/20261016-ai-template-rights.sql'
      - 'app/src/main/assets/deepsyq-admin.html'
      - 'app/src/main/assets/deepsyq-admin.js'
      - 'tests/generation-templates-unit.mjs'
      - 'tests/generation-template-rights-postgres.mjs'
      - '.github/workflows/deepsyq-template-rights.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rights-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify template rights validation and owner form parsing
        run: |
          node --check server/generation-templates.js
          node --check app/src/main/assets/deepsyq-admin.js
          node --test tests/generation-templates-unit.mjs

  rights-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vv_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vv_ai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      AI_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vv_ai_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify additive rights migration without affecting production
        run: node --test tests/generation-template-rights-postgres.mjs

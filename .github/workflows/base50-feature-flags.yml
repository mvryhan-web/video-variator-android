name: BASE #50 feature switches
on:
  push:
    branches: [base50-feature-switches-20261016]
  pull_request:
    paths:
      - 'server/generation-feature-flags.js'
      - 'server/platform-feature-flags.js'
      - 'server/server.js'
      - 'tests/base50-platform-feature-flags-unit.mjs'
      - 'server/generation-studio.js'
      - 'tests/base50-feature-flags-unit.mjs'
permissions:
  contents: read
jobs:
  generation-feature-flags:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Syntax and functional switch tests
        run: |
          node --check server/generation-feature-flags.js
          node --check server/generation-studio.js
          node --check tests/base50-feature-flags-unit.mjs
          node --check server/platform-feature-flags.js
          node --check server/server.js
          node --test tests/base50-feature-flags-unit.mjs tests/base50-platform-feature-flags-unit.mjs

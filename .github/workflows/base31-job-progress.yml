name: BASE 31 accepted job and wallet UX

on:
  push:
    branches: [deepsyq-platform]
    paths:
      - 'app/src/main/assets/studio-job-progress.js'
      - 'app/src/main/assets/generate-studio.js'
      - 'app/src/main/assets/generate-studio.html'
      - 'app/src/main/assets/generate-studio.css'
      - 'tests/agent-a-base31-progress-unit.mjs'
      - 'tests/agent-a-base31-job-progress.spec.mjs'
      - '.github/workflows/base31-job-progress.yml'
  pull_request:
    paths:
      - 'app/src/main/assets/studio-job-progress.js'
      - 'app/src/main/assets/generate-studio.js'
      - 'app/src/main/assets/generate-studio.html'
      - 'app/src/main/assets/generate-studio.css'
      - 'tests/agent-a-base31-progress-unit.mjs'
      - 'tests/agent-a-base31-job-progress.spec.mjs'
      - '.github/workflows/base31-job-progress.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: base31-job-progress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  progress-native:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: |
          node --check app/src/main/assets/studio-job-progress.js
          node --check app/src/main/assets/generate-studio.js
          node --check tests/agent-a-base31-progress-unit.mjs
          node --test tests/agent-a-base31-progress-unit.mjs

  progress-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test tests/agent-a-base31-job-progress.spec.mjs --project=chromium --project=webkit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: base31-job-progress-browser-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

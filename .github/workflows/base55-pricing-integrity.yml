name: BASE 43 pricing integrity
on:
  push:
    branches: [base43-clean-merge-20261016]
    paths:
      - 'app/src/main/assets/ai-pricing.js'
      - 'app/src/main/assets/ai-pricing-display.js'
      - 'tests/ai-pricing-display-unit.mjs'
      - '.github/workflows/base55-pricing-integrity.yml'
  pull_request:
    branches: [deepsyq-platform]
    paths:
      - 'app/src/main/assets/ai-pricing.js'
      - 'app/src/main/assets/ai-pricing-display.js'
      - 'tests/ai-pricing-display-unit.mjs'
      - '.github/workflows/base55-pricing-integrity.yml'
permissions:
  contents: read
jobs:
  pricing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check pricing module syntax
        run: |
          node --check app/src/main/assets/ai-pricing-display.js
          node --check app/src/main/assets/ai-pricing.js
      - name: Verify no fabricated prices, credits or checkout mode
        run: node --test tests/ai-pricing-display-unit.mjs

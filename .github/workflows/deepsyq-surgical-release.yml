name: DEEPSYQ surgical-only Cloudflare release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Plan (read only) or publish only exact requested assets"
        required: true
        type: choice
        options:
          - plan
          - publish
        default: plan
      files:
        description: "EXACT relative asset filenames separated by commas; no wildcards"
        required: true
        type: string
  push:
    branches: [deepsyq-platform]
    paths:
      - 'tests/jarvix-remove-background-viewer.test.mjs'
      - 'app/src/main/assets/jarvix-guided-tour.js'
      - 'app/src/main/assets/jarvix-tour-choreography.js'
      - 'app/src/main/assets/jarvix-chat.js'
      - 'app/src/main/assets/jarvix-chat.html'
      - 'app/src/main/assets/generate-studio.js'
      - 'app/src/main/assets/home-inspiration.js'
      - 'app/src/main/assets/account-settings.html'
      - 'app/src/main/assets/deepsyq-theme-loader.js'
      - 'app/src/main/assets/canvas.html'
      - 'app/src/main/assets/canvas-workspace.js'
      - 'app/src/main/assets/jarvix-new-voice.js'
      - 'app/src/main/assets/jarvis-core.js'
      - 'app/src/main/assets/jarvix-composer-design.js'
      - 'app/src/main/assets/jarvix-composer.js'
      - 'app/src/main/assets/jarvix-voice-input.js'
      - 'app/src/main/assets/jarvix-new-recorded-dialog.js'
      - 'app/src/main/assets/admin-access.js'
      - 'app/src/main/assets/trial-quality.js'
      - 'app/src/main/assets/video-uniquifier.html'
      - 'tests/video-uniquifier-quality-lock.test.mjs'
      - 'app/src/main/assets/auth-email.js'
      - 'app/src/main/assets/auth-email.css'
      - 'app/src/main/assets/deepsyq-mobile-shell.js'
      - 'app/src/main/assets/deepsyq-mobile-shell.css'
      - 'app/src/main/assets/deepsyq-unified-platform-header.css'
      - 'app/src/main/assets/deepsyq-unified-platform-header.js'
      - 'app/src/main/assets/deepsyq-action-auth-gate.js'
      - 'app/src/main/assets/everyday-tools-visual.js'
      - 'app/src/main/assets/mobile-utility-links.js'
      - 'app/src/main/assets/pricing-page.js'
      - 'app/src/main/assets/pricing-page.css'
      - 'app/src/main/assets/canvas-workspace.css'
      - 'app/src/main/assets/deepsyq-i18n.js'
      - 'app/src/main/assets/free-tools.html'
      - 'app/src/main/assets/everyday-tools-visual.css'
      - 'app/src/main/assets/contact.html'
      - 'scripts/deepsyq_surgical_publish.py'
      - 'tests/test_deepsyq_surgical_publish.py'
      - '.github/workflows/deepsyq-surgical-release.yml'

permissions:
  contents: read

concurrency:
  group: deepsyq-surgical-pages-release
  cancel-in-progress: false

jobs:
  emergency-tour-rollback:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/deepsyq-platform' &&
      github.event.head_commit.message == 'rollback(JARVIX Tour) restore previous production deployment'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Roll back to the untouched production deployment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, time, urllib.request
          base = ("https://api.cloudflare.com/client/v4/accounts/"
                  + os.environ["CLOUDFLARE_ACCOUNT_ID"]
                  + "/pages/projects/deepsyq")
          target = "97f3610c-4a79-430a-a2ca-8c09ffc6788a"
          def api(path="", method="GET"):
              req = urllib.request.Request(base + path, method=method,
                  headers={"Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"]})
              with urllib.request.urlopen(req, timeout=30) as res:
                  payload = json.load(res)
              if payload.get("success") is not True or payload.get("result") is None:
                  raise RuntimeError("Cloudflare rollback API did not confirm success")
              return payload["result"]
          old = api("/deployments/" + target)
          baseline_manifest = old.get("files")
          if not isinstance(baseline_manifest, dict) or len(baseline_manifest) < 100:
              raise RuntimeError("Verified previous deployment manifest not available")
          project = api()
          current = project.get("canonical_deployment", {}).get("id")
          if current != target:
              api("/deployments/" + target + "/rollback", "POST")
          for attempt in range(24):
              project = api()
              current = project.get("canonical_deployment", {}).get("id")
              actual = api("/deployments/" + current) if current else {}
              if actual.get("files") == baseline_manifest:
                  print("RESTORED_BASELINE_ASSETS", current)
                  break
              time.sleep(3)
          else:
              raise RuntimeError("Production rollback did not restore verified baseline manifest")
          health_req = urllib.request.Request("https://deepsyq.app/api/config",
                                               headers={"Cache-Control": "no-cache"})
          with urllib.request.urlopen(health_req, timeout=20) as health:
              if health.status != 200:
                  raise RuntimeError("Production API health not restored")
          print("PRODUCTION_ROLLBACK_VERIFIED")
          PY

  restore-original-sign-in:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/deepsyq-platform' &&
      github.event.head_commit.message == 'rollback(Auth): restore original sign-in on production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Roll back to the untouched production deployment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, time, urllib.request
          base = ("https://api.cloudflare.com/client/v4/accounts/"
                  + os.environ["CLOUDFLARE_ACCOUNT_ID"]
                  + "/pages/projects/deepsyq")
          target = "4f5d98f6-bf78-4a28-ac98-1130292cba98"
          def api(path="", method="GET"):
              req = urllib.request.Request(base + path, method=method,
                  headers={"Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"]})
              with urllib.request.urlopen(req, timeout=30) as res:
                  payload = json.load(res)
              if payload.get("success") is not True or payload.get("result") is None:
                  raise RuntimeError("Cloudflare rollback API did not confirm success")
              return payload["result"]
          old = api("/deployments/" + target)
          baseline_manifest = old.get("files")
          if not isinstance(baseline_manifest, dict) or len(baseline_manifest) < 100:
              raise RuntimeError("Verified previous deployment manifest not available")
          project = api()
          current = project.get("canonical_deployment", {}).get("id")
          if current != target:
              live = api("/deployments/" + current)
              files = live.get("files") or {}
              diff = {k for k in files.keys() | baseline_manifest.keys() if files.get(k) != baseline_manifest.get(k)}
              if current != "5545b5aa-bee0-4f0c-bf8d-d3cb14b29ea5" or diff != {"/auth-email.js", "/auth-email.css"} or live.get("uses_functions") is not True or old.get("uses_functions") is not True:
                  raise RuntimeError("Current deployment is not the verified two-file sign-in release")
              api("/deployments/" + target + "/rollback", "POST")
          for attempt in range(24):
              project = api()
              current = project.get("canonical_deployment", {}).get("id")
              actual = api("/deployments/" + current) if current else {}
              if actual.get("files") == baseline_manifest:
                  print("RESTORED_BASELINE_ASSETS", current)
                  break
              time.sleep(3)
          else:
              raise RuntimeError("Production rollback did not restore verified baseline manifest")
          health_req = urllib.request.Request("https://deepsyq.app/api/config",
                                               headers={"Cache-Control": "no-cache"})
          with urllib.request.urlopen(health_req, timeout=20) as health:
              if health.status != 200:
                  raise RuntimeError("Production API health not restored")
          print("PRODUCTION_ROLLBACK_VERIFIED")
          PY

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and strict allowlist regression tests (no Cloudflare access)
        run: |
          python -m py_compile scripts/deepsyq_surgical_publish.py
          PYTHONPATH=scripts python -m unittest discover -s tests -p 'test_deepsyq_surgical_publish.py' -v
          node --check app/src/main/assets/jarvix-chat.js
          node --check app/src/main/assets/generate-studio.js
          node --test tests/jarvix-remove-background-viewer.test.mjs tests/video-uniquifier-quality-lock.test.mjs tests/jarvix-activation.test.mjs tests/jarvix-chat-no-confirm.test.mjs

  surgical:
    # Push publishes ONLY the exact owner-approved Tour or Chat asset with its guarded release commit.
    # Other pushes run tests only. Manual dispatch remains available and unchanged.
    # One-file owner release: JARVIX image viewer Remove background -> same chat.
    if: >-
      github.ref == 'refs/heads/deepsyq-platform' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        (github.event.head_commit.message == 'release(JARVIX): fix new voice and microphone on web, Chrome, and app' ||
         github.event.head_commit.message == 'release(Pricing): publish brand, pre-hydration, and responsive layout fixes' ||
         github.event.head_commit.message == 'release(Design): publish UI, copy, i18n, and responsive layout fixes' ||
         github.event.head_commit.message == 'release(JARVIX Tour): publish tour-only fix' ||
         github.event.head_commit.message == 'release(Canvas): open Home photos and simplify controls' ||
         github.event.head_commit.message == 'release(Security): protect JARVIX workspace messages and framing' ||
         github.event.head_commit.message == 'release(Video Uniquifier): preserve output quality selection' ||
         github.event.head_commit.message == 'release(JARVIX): activate scenario recordings on production' ||
         github.event.head_commit.message == 'release(JARVIX): connect voice to active media conversation' ||
         github.event.head_commit.message == 'release(JARVIX): connect voice generation tools and tour controls' ||
         github.event.head_commit.message == 'release(JARVIX): retire legacy voice activation' ||
         github.event.head_commit.message == 'release(Studio): connect composer sphere to JARVIX NEW' ||
         github.event.head_commit.message == 'release(Studio): restore YouTube cover and fit Director sphere' ||
         github.event.head_commit.message == 'release(Studio): use 16 by 9 covers and new composer voice' ||
         github.event.head_commit.message == 'release(AI Credits): enable Checkout on production aliases' ||
         github.event.head_commit.message == 'release(Account): publish Account and Settings design' ||
         github.event.head_commit.message == 'release(Account): restore original profile on its own page' ||
         github.event.head_commit.message == 'release(Theme): restore original Dark default' ||
         github.event.head_commit.message == 'release(Account): separate profile and align Director sphere' ||
         github.event.head_commit.message == 'release(Studio): publish redesigned Quick Start artwork' ||
         github.event.head_commit.message == 'release(Studio): publish original Quick Start artwork' ||
         github.event.head_commit.message == 'release(Studio): restore compact Quick Start cards' ||
         github.event.head_commit.message == 'release(Studio): publish confirmed Director chain' ||
         github.event.head_commit.message == 'release(Studio): publish characters and video ideas' ||
         github.event.head_commit.message == 'release(Studio): publish content planning and brand profile' ||
         github.event.head_commit.message == 'release(Studio): publish quick starts and Inspiration Remix' ||
         github.event.head_commit.message == 'release(Stories): publish resume card' ||
         github.event.head_commit.message == 'release(Stories): publish local video drafts' ||
         github.event.head_commit.message == 'release(JARVIX Chat): publish built-in tools' ||
         github.event.head_commit.message == 'release(JARVIX Chat): publish image dialogue' ||
         github.event.head_commit.message == 'release(JARVIX Chat): publish remove-background command' ||
         github.event.head_commit.message == 'release(Auth): restore original sign-in' ||
         github.event.head_commit.message == 'release(Chat): publish Trial offer only' ||
         github.event.head_commit.message == 'release(Auth and Chat): publish latest approved assets' ||
         github.event.head_commit.message == 'release(Chat): publish Gemini latency fix' ||
         github.event.head_commit.message == 'release(Voice): publish JARVIX NEW' ||
         github.event.head_commit.message == 'release(Auth): publish neon sign-in styling' ||
         github.event.head_commit.message == 'release(Auth Gate): publish guest action login' ||
          github.event.head_commit.message == 'release(Everyday Tools): remove duplicate and realign artwork' ||
          github.event.head_commit.message == 'release(Contact): publish help@deepsyq.app support form' ||
          github.event.head_commit.message == 'release(Generation): remove credit confirmation dialog' ||
          github.event.head_commit.message == 'release(SEO and PWA): restore PWA install, remove index noindex, expand sitemap and AI search' ||
          github.event.head_commit.message == 'release(Studio): connect fal.ai gateway for Seedance, Veo 3 and Seedream' ||
          github.event.head_commit.message == 'release(Studio): hide outdated and unverified models from picker')))
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      SCOPE_FILES: "${{ github.event_name == 'push' && github.event.head_commit.message == 'release(JARVIX): fix new voice and microphone on web, Chrome, and app' && 'jarvix-new-voice.js,jarvis-core.js,jarvix-composer-design.js,jarvix-composer.js,jarvix-voice-input.js,sw.js' || github.event_name == 'push' && github.event.head_commit.message == 'release(Design): publish UI, copy, i18n, and responsive layout fixes' && 'deepsyq-mobile-shell.css,deepsyq-mobile-shell.js,deepsyq-unified-platform-header.css,deepsyq-unified-platform-header.js,deepsyq-action-auth-gate.js,free-tools.html,everyday-tools-visual.css,everyday-tools-visual.js,mobile-utility-links.js,ai-apps.html,account-settings.html,video-uniquifier.html,video-uniquifier-reference.js,jarvix-chat.js,deepsyq-i18n.js,canvas-workspace.css' || github.event_name == 'push' && github.event.head_commit.message == 'release(Layout): fix Canvas, Pricing, and Account responsive layouts' && 'canvas-workspace.css,pricing-page.css,account-settings.html' || github.event_name == 'push' && github.event.head_commit.message == 'release(Copy): unify Deepsyq brand, remove admin footer, add i18n' && 'ai-apps.html,account-settings.html,video-uniquifier.html,video-uniquifier-reference.js,jarvix-chat.js,pricing-page.js,deepsyq-i18n.js' || github.event_name == 'push' && github.event.head_commit.message == 'release(Everyday Tools): fix artwork crop, duplicates, and i18n' && 'free-tools.html,everyday-tools-visual.css,everyday-tools-visual.js,mobile-utility-links.js' || github.event_name == 'push' && github.event.head_commit.message == 'release(Header): fix mobile header wrap, lang arrow, auth gate 404' && 'deepsyq-mobile-shell.css,deepsyq-mobile-shell.js,deepsyq-unified-platform-header.css,deepsyq-unified-platform-header.js,deepsyq-action-auth-gate.js' || github.event_name == 'push' && github.event.head_commit.message == 'release(Theme): restore original Dark default' && 'deepsyq-theme-loader.js,account-settings.html' || github.event_name == 'push' && github.event.head_commit.message == 'release(Contact): publish help@deepsyq.app support form' && 'contact.html' || github.event_name == 'push' && github.event.head_commit.message == 'release(Everyday Tools): remove duplicate and realign artwork' && 'free-tools.html,everyday-tools-visual.css' || github.event_name == 'push' && github.event.head_commit.message == 'release(Studio): restore YouTube cover and fit Director sphere' && 'home-inspiration.js,media/home/quick-start-v3/youtube-thumbnail.webp,media/home/quick-start-v3/vertical-video.webp,media/home/quick-start-v3/product-photo.webp,media/home/quick-start-v3/content-plan.webp,media/home/quick-start-v3/brand-style.webp,media/home/quick-start-v3/my-characters.webp,media/home/quick-start-v3/ideas-radar.webp,media/home/quick-start-v3/jarvix-director.webp' || github.event_name == 'push' && github.event.head_commit.message == 'release(Studio): use 16 by 9 covers and new composer voice' && 'home-inspiration.js,jarvix-new-voice.js,media/home/quick-start-v3/youtube-thumbnail.webp,media/home/quick-start-v3/vertical-video.webp,media/home/quick-start-v3/product-photo.webp,media/home/quick-start-v3/content-plan.webp,media/home/quick-start-v3/brand-style.webp,media/home/quick-start-v3/my-characters.webp,media/home/quick-start-v3/ideas-radar.webp,media/home/quick-start-v3/jarvix-director.webp' || github.event_name == 'push' && github.event.head_commit.message == 'release(Account): restore original profile on its own page' && 'account-settings.html' || github.event_name == 'push' && github.event.head_commit.message == 'release(Account): separate profile and align Director sphere' && 'deepsyq.js,deepsyq-mobile-shell.js,deepsyq-unified-platform-header.js,video-uniquifier-reference.js,home-inspiration.js,account-settings.html' || github.event_name == 'push' && github.event.head_commit.message == 'release(Studio): publish redesigned Quick Start artwork' && 'home-inspiration.js,media/home/quick-start-v2/youtube-thumbnail.webp,media/home/quick-start-v2/vertical-video.webp,media/home/quick-start-v2/product-photo.webp,media/home/quick-start-v2/content-plan.webp,media/home/quick-start-v2/brand-style.webp,media/home/quick-start-v2/my-characters.webp,media/home/quick-start-v2/ideas-radar.webp,media/home/quick-start-v2/jarvix-director.webp' || github.event_name == 'push' && github.event.head_commit.message == 'release(Studio): publish original Quick Start artwork' && 'home-inspiration.js,media/home/quick-start-v1/youtube-thumbnail.webp,media/home/quick-start-v1/vertical-video.webp,media/home/quick-start-v1/product-photo.webp,media/home/quick-start-v1/content-plan.webp,media/home/quick-start-v1/brand-style.webp,media/home/quick-start-v1/my-characters.webp,media/home/quick-start-v1/ideas-radar.webp,media/home/quick-start-v1/jarvix-director.webp' || github.event_name == 'push' && github.event.head_commit.message == 'release(Studio): restore compact Quick Start cards' && 'home-inspiration.js' || github.event_name == 'push' && github.event.head_commit.message == 'release(Studio): publish confirmed Director chain' && 'home-inspiration.js' || github.event_name == 'push' && github.event.head_commit.message == 'release(Studio): publish characters and video ideas' && 'home-inspiration.js' || github.event_name == 'push' && github.event.head_commit.message == 'release(Studio): publish content planning and brand profile' && 'home-inspiration.js' || github.event_name == 'push' && github.event.head_commit.message == 'release(Studio): publish quick starts and Inspiration Remix' && 'home-inspiration.js' || github.event_name == 'push' && github.event.head_commit.message == 'release(Stories): publish resume card' && 'my-creations-gallery.js' || github.event_name == 'push' && github.event.head_commit.message == 'release(Stories): publish local video drafts' && 'mobile-utility.js,my-creations-gallery.js' || github.event_name == 'push' && github.event.head_commit.message == 'release(JARVIX Chat): publish built-in tools' && 'jarvix-chat.js,jarvix-new-voice.js' || github.event_name == 'push' && github.event.head_commit.message == 'release(JARVIX Chat): publish image dialogue' && 'jarvix-chat.js' || github.event_name == 'push' && github.event.head_commit.message == 'release(Auth Gate): publish guest action login' && 'deepsyq-mobile-shell.js' || github.event_name == 'push' && github.event.head_commit.message == 'release(Auth): publish neon sign-in styling' && 'auth-email.css' || github.event_name == 'push' && github.event.head_commit.message == 'release(Auth and Chat): publish latest approved assets' && 'auth-email.js,auth-email.css,jarvix-chat.js' || github.event_name == 'push' && github.event.head_commit.message == 'release(Chat): publish Trial offer only' && 'jarvix-chat.js' || github.event_name == 'push' && github.event.head_commit.message == 'release(Auth): restore original sign-in' && 'auth-email.js,auth-email.css' || github.event_name == 'push' && github.event.head_commit.message == 'release(JARVIX Chat): publish remove-background command' && 'jarvix-chat.js' || github.event_name == 'push' && 'jarvix-guided-tour.js,jarvix-tour-choreography.js' || inputs.files }}"
      RELEASE_MODE: ${{ github.event_name == 'push' && 'publish' || inputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0 # LIVE baseline commit must exist for fail-closed Worker/hash checks.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only the uploader dependencies
        run: python -m pip install --disable-pip-version-check "requests==2.32.3" "blake3==1.0.8"
      - name: Enforce exact requested files and preserve current LIVE Worker
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name == 'push' && github.event.head_commit.message == 'release(Pricing): publish brand, pre-hydration, and responsive layout fixes' }}" == "true" ]]; then
            python scripts/deepsyq_surgical_publish.py --mode publish --files "pricing-page.js,pricing-page.css" --commit "$GITHUB_SHA" --pricing-design
            exit
          fi
          if [[ "${{ github.event_name == 'push' && github.event.head_commit.message == 'release(Security): protect JARVIX workspace messages and framing' }}" == "true" ]]; then
            python scripts/deepsyq_surgical_publish.py --mode publish --files "jarvix-chat.js,jarvix-chat.html" --commit "$GITHUB_SHA" --workspace-security
            exit
          fi
          if [[ "${{ github.event_name == 'push' && github.event.head_commit.message == 'release(Generation): remove credit confirmation dialog' }}" == "true" ]]; then
            SCOPE_FILES="jarvix-chat.js,jarvix-chat.html,generate-studio.js"
          fi
          if [[ "${{ github.event_name == 'push' && github.event.head_commit.message == 'release(Studio): hide outdated and unverified models from picker' }}" == "true" ]]; then
            SCOPE_FILES="generate-models.js,generate-studio.js,deepsyq.js"
          fi
          if [[ "${{ github.event_name == 'push' && github.event.head_commit.message == 'release(SEO and PWA): restore PWA install, remove index noindex, expand sitemap and AI search' }}" == "true" ]]; then
            SCOPE_FILES="account-settings.html,ai-apps.html,deepsyq-vs-deepseek.html,deepsyq.html,deepsyq.js,deepsyq.webmanifest,index.html,llms.txt,robots.txt,sitemap.xml,sw.js"
          fi
          if [[ "${{ github.event_name == 'push' && github.event.head_commit.message == 'release(Video Uniquifier): preserve output quality selection' }}" == "true" ]]; then
            SCOPE_FILES="admin-access.js,trial-quality.js,video-uniquifier.html"
          fi
          if [[ "${{ github.event_name == 'push' && github.event.head_commit.message == 'release(JARVIX): activate scenario recordings on production' }}" == "true" ]]; then
            SCOPE_FILES="jarvix-new-voice.js,jarvix-new-recorded-dialog.js"
          fi
          if [[ "${{ github.event_name == 'push' && github.event.head_commit.message == 'release(JARVIX): connect voice to active media conversation' }}" == "true" ]]; then
            SCOPE_FILES="jarvix-chat.js,jarvix-chat.html,jarvix-new-voice.js"
          fi
          if [[ "${{ github.event_name == 'push' && github.event.head_commit.message == 'release(Canvas): open Home photos and simplify controls' }}" == "true" ]]; then
            SCOPE_FILES="canvas.html,canvas-workspace.js"
          fi
          if [[ "${{ github.event_name == 'push' && github.event.head_commit.message == 'release(JARVIX): connect voice generation tools and tour controls' }}" == "true" ]]; then

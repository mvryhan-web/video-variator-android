name: Owner Google sign-in origin mismatch diagnostic (read only)
on:
  push:
    branches: [deepsyq-platform]
    paths:
      - '.github/workflows/owner-google-oauth-origin-audit-20261110.yml'
permissions:
  contents: read
jobs:
  oauth-origin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ANDROID_WEB_APP_URL: ${{ vars.VV_WEB_APP_URL }}
      ANDROID_API_BASE_URL: ${{ vars.VV_API_BASE_URL }}
    steps:
      - name: Check live Google OAuth origin/client consistency; never log credential values
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {createHash} from 'node:crypto';
          function fingerprint(v){return typeof v==='string'&&v?createHash('sha256').update(v).digest('hex').slice(0,16):null}
          async function get(url,headers={}){
            try {
              const r=await fetch(url,{headers,redirect:'follow',signal:AbortSignal.timeout(15000)});
              const text=await r.text();
              let body={};try{body=JSON.parse(text)}catch{}
              return {status:r.status,url:r.url,body,ct:r.headers.get('content-type')};
            } catch(err){return {status:0,error:String(err).slice(0,110)}}
          }
          for(const host of ['deepsyq.app','www.deepsyq.app','deepsyq.pages.dev','test.deepsyq.pages.dev','video-variator-android.onrender.com']){
            const response=await get('https://'+host+'/api/config');
            const id=response.body?.googleClientId;
            console.log('OAUTH_LIVE_CONFIG',JSON.stringify({host,http:response.status,redirectOrigin:response.url?new URL(response.url).origin:null,googleConfigured:typeof id==='string'&&id.length>0,googleClientFingerprint:fingerprint(id),clientLooksGoogle:typeof id==='string'&&id.endsWith('.apps.googleusercontent.com'),contentType:response.ct?.split(';')[0],error:response.error}));
          }
          const account=process.env.CF_ACCOUNT_ID,token=process.env.CF_API_TOKEN;
          if(!account||!token){console.log('OAUTH_CLOUDFLARE_AUDIT',{error:'missing configured credentials'});process.exit(0)}
          const api='https://api.cloudflare.com/client/v4/accounts/'+account+'/pages/projects/deepsyq';
          const p=await get(api,{Authorization:'Bearer '+token});
          const x=p.body?.result||{},c=x.deployment_configs||{},dep=x.canonical_deployment||{};
          const tidy=(env)=>{
            const v=env?.GOOGLE_CLIENT_ID;
            const raw=typeof v==='object'&&v!==null?v.value:typeof v==='string'?v:null;
            return {present:!!v,type:typeof v==='object'?v.type:typeof v,clientLooksGoogle:typeof raw==='string'&&raw.endsWith('.apps.googleusercontent.com'),fingerprint:fingerprint(raw)}
          };
          console.log('OAUTH_CF_PROJECT',JSON.stringify({http:p.status,project:x.name,prodBranch:x.production_branch,prodEnv:tidy(c.production?.env_vars),previewEnv:tidy(c.preview?.env_vars),prodDeployment:dep.id,createdAt:dep.created_on,usesFunctions:dep.uses_functions,gitSha:dep.deployment_trigger?.metadata?.commit_hash}));
          const androidVars=['ANDROID_WEB_APP_URL','ANDROID_API_BASE_URL'];
          console.log('OAUTH_ANDROID_BUILD_ORIGINS',JSON.stringify(Object.fromEntries(androidVars.map(n=>{
            const raw=process.env[n]||'';
            let origin=null;try{origin=raw?new URL(raw).origin:null}catch{}
            return [n,{configured:!!raw,origin}];
          }))));
          const headers={Authorization:'Bearer '+token};
          let deployments=[];
          for(const page of [1,2,3]){
            const chunk=await get(api+'/deployments?page='+page+'&per_page=20',headers);
            console.log('OAUTH_HISTORY_PAGE',JSON.stringify({page,status:chunk.status,errors:(chunk.body?.errors||[]).map(e=>e.code)}));
            if(chunk.status!==200||!Array.isArray(chunk.body?.result))break;
            deployments.push(...chunk.body.result);
            if(chunk.body.result.length<20)break;
          }
          if(deployments.length){
            const choices=[...deployments.filter(d=>String(d.created_on||'').slice(0,10)==='2026-11-09').slice(0,3),
              ...deployments.filter(d=>String(d.created_on||'').slice(0,10)==='2026-11-10').slice(0,5)];
            const seen=new Set();
            for(const dep of choices){
              if(!dep.url||seen.has(dep.id))continue;
              seen.add(dep.id);
              const site=await get(dep.url.replace(/\/$/,'')+'/api/config');
              const key=site.body?.googleClientId;
              console.log('OAUTH_HISTORIC_DEPLOYMENT',JSON.stringify({
                id:dep.id,date:dep.created_on,environment:dep.environment,host:new URL(dep.url).hostname,http:site.status,
                oauthFingerprint:fingerprint(key),oauthConfigured:typeof key==='string'&&key.length>0
              }));
            }
          }else{
            console.log('OAUTH_HISTORIC_DEPLOYMENT_LOOKUP',JSON.stringify({status:'no-deployments'}));
          }
          console.log('READ_ONLY_NO_AUTH_CHANGES',true);
          JS

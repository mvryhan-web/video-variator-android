name: DEEPSYQ Christmas live Chromium visual QA (no deploy)
# QA V4 natural photographed snowbank, rounded cushions, hover interaction — browser only.
on:
  push:
    branches: [test]
    paths: ['.github/workflows/deepsyq-christmas-browser-qa.yml']
permissions:
  contents: read
jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify live Christmas DOM, theme switching, and screenshots (desktop + mobile)
        shell: bash
        run: |
          mkdir -p artifacts/christmas-test
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          const errors=[];
          for(const [name,viewport,isMobile] of [
            ['desktop',{width:1440,height:900},false],
            ['mobile',{width:390,height:844},true]
          ]){
            const ctx=await browser.newContext({viewport,isMobile,hasTouch:isMobile});
            const page=await ctx.newPage();
            page.on('pageerror',e=>errors.push(name+': '+e.message));
            const base='https://christmas-preview-20261114.deepsyq.pages.dev/?christmas=1';
            const r=await page.goto(base,{waitUntil:'domcontentloaded',timeout:30000});
            assert.equal(r?.status(),200,name+' Home status');
            await page.waitForTimeout(2000);
            const state=async()=>page.evaluate(()=>{
              const theme=document.documentElement.getAttribute('data-site-theme');
              const body=getComputedStyle(document.body);
              return {
                host:location.hostname,
                theme,
                snowCanvas:!!document.querySelector('#xmas-weather-layer'),
                snowcaps:document.querySelectorAll('.xmas-snowcap').length,
                sprites:document.querySelectorAll('.xmas-person').length,
                carousel:!!document.getElementById('homeHeroCarousel'),
                previous:!!document.getElementById('homeHeroPrevious'),
                next:!!document.getElementById('homeHeroNext'),
                composer:!!document.getElementById('homeQuickBar'),
                prompt:!!document.getElementById('homeQuickPrompt'),
                bg:body.backgroundImage.slice(0,240),
                toggle:!!document.querySelector('.xmas-theme-toggle')
              };
            });
            const before=await state();
            console.log('LIVE_XMAS_CHRISTMAS_INITIAL',name,JSON.stringify(before));
            await page.screenshot({path:'artifacts/christmas-test/'+name+'-initial.png',fullPage:false});
            assert(before.carousel && before.previous && before.next && before.composer && before.prompt,name+' original controls missing');
            assert.equal(before.theme,'christmas',name+' theme not active on ?christmas=1');
            assert(before.snowCanvas && before.snowcaps>=3 && before.sprites>=5,name+' snow layers not initialized');
            assert(before.bg==='none',name+' legacy body background still covering global image');
            const globalBg=await page.evaluate(()=>{
              const root=getComputedStyle(document.documentElement);
              const body=getComputedStyle(document.body);
              const main=document.querySelector('main');
              return {
                rootImage:root.backgroundImage,
                rootAttachment:root.backgroundAttachment,
                bodyImage:body.backgroundImage,
                mainImage:main?getComputedStyle(main).backgroundImage:null,
                height:document.documentElement.scrollHeight
              };
            });
            console.log('LIVE_XMAS_V3_GLOBAL_BACKGROUND',name,JSON.stringify(globalBg));
            assert(globalBg.rootImage.includes('christmas-portrait.webp'),name+' exact full-length owner photo missing');
            assert(globalBg.rootAttachment.includes('fixed'),name+' winter background scrolls away');
            assert(globalBg.bodyImage==='none',name+' body still covers long winter scene');
            const portrait=await page.request.get('https://christmas-preview-20261114.deepsyq.pages.dev/media/christmas/christmas-portrait.webp');
            assert.equal(portrait.status(),200,name+' long portrait HTTP 200');
            assert((portrait.headers()['content-type']||'').includes('image/'),name+' long portrait not an image');
            assert((await portrait.body()).byteLength>100_000,name+' exact photo image too small');
            const capGeometry=await page.evaluate(()=>{
              const bar=document.querySelector('#homeQuickBar');
              const cap=bar?.querySelector(':scope > .xmas-snowcap');
              if(!bar||!cap)return null;
              return {barTop:bar.getBoundingClientRect().top,capTop:cap.getBoundingClientRect().top,
                capBottom:cap.getBoundingClientRect().bottom,height:cap.getBoundingClientRect().height};
            });
            console.log('LIVE_XMAS_INPUT_SNOWCAP_GEOMETRY',name,JSON.stringify(capGeometry));
            assert(capGeometry&&capGeometry.capTop<capGeometry.barTop-4&&capGeometry.capBottom<=capGeometry.barTop,name+' fluffy snow must sit ABOVE input, not cover it');

            const pileProof=await page.evaluate(()=>{
              const overlay=document.getElementById('xmas-pile-overlay');
              const bar=document.getElementById('homeQuickBar');
              if(!overlay||!bar)return null;
              const rect=bar.getBoundingClientRect(), dpr=overlay.width/innerWidth;
              const sx=Math.max(0,Math.round((rect.left+rect.width*.18)*dpr));
              const sy=Math.max(0,Math.round((rect.top-27)*dpr));
              const sw=Math.min(overlay.width-sx,Math.round(rect.width*.64*dpr));
              const sh=Math.min(overlay.height-sy,Math.round(29*dpr));
              let pixels=0;
              if(sw>0&&sh>0){
                const data=overlay.getContext('2d').getImageData(sx,sy,sw,sh).data;
                for(let i=3;i<data.length;i+=4)if(data[i]>35)pixels++;
              }
              return {present:!!overlay,visiblePiles:Number(overlay.dataset.xmasPiles||0),
                paintedPixels:pixels,opaqueOld:parseFloat(getComputedStyle(bar.querySelector(':scope > .xmas-snowcap')).opacity)};
            });
            console.log('LIVE_XMAS_V4_FLUFFY_SNOW',name,JSON.stringify(pileProof));

            const snowProfile=await page.evaluate(()=>{
              const canvas=document.getElementById('xmas-pile-overlay'),bar=document.getElementById('homeQuickBar');
              const box=bar.getBoundingClientRect(),scale=canvas.width/innerWidth;
              const x=Math.max(0,Math.round((box.left+8)*scale));
              const y=Math.max(0,Math.round((box.top-12)*scale));
              const width=Math.min(canvas.width-x,Math.round((box.width-16)*scale));
              const data=canvas.getContext('2d').getImageData(x,y,width,1).data;
              let covered=0,total=0;
              for(let i=3;i<data.length;i+=Math.max(4,Math.round(scale*6)*4)){
                total++;if(data[i]>65)covered++;
              }
              return {covered,total,ratio:Number((covered/Math.max(total,1)).toFixed(3))};
            });
            console.log('LIVE_XMAS_V4_PATCHY_PROFILE',name,JSON.stringify(snowProfile));
            const textureResponse=await page.request.get('https://christmas-preview-20261114.deepsyq.pages.dev/media/christmas/snowbank-texture.webp');
            assert.equal(textureResponse.status(),200,name+' user-photo snowbank texture missing');
            assert((textureResponse.headers()['content-type']||'').includes('image/'),name+' snowbank texture wrong content type');
            console.log('LIVE_XMAS_V4_NATURAL_SNOW_TEXTURE',name,(await textureResponse.body()).byteLength);
            assert(snowProfile.ratio>.06&&snowProfile.ratio<.82,
              name+' snow must form separated natural cushions, not a continuous painted ribbon');

            assert(pileProof&&pileProof.visiblePiles>=3&&pileProof.paintedPixels>=50&&pileProof.opaqueOld===0,
              name+' fluffy canvas snow must replace old gradient strips and draw above input');
            const snowPoint=await page.evaluate(()=>{
              const box=document.getElementById('homeQuickBar').getBoundingClientRect();
              return {x:box.left+box.width/2,y:box.top-13};
            });
            if(isMobile){
              await page.evaluate(p=>document.dispatchEvent(new PointerEvent('pointermove',
                {bubbles:true,clientX:p.x-25,clientY:p.y,pointerType:'touch',isPrimary:true})),snowPoint);
              await page.evaluate(p=>document.dispatchEvent(new PointerEvent('pointermove',
                {bubbles:true,clientX:p.x+25,clientY:p.y,pointerType:'touch',isPrimary:true})),snowPoint);
            }else{
              await page.mouse.move(snowPoint.x-35,snowPoint.y);
              await page.mouse.move(snowPoint.x+35,snowPoint.y,{steps:5});
            }
            await page.waitForFunction(()=>Number(document.getElementById('xmas-pile-overlay')?.dataset.xmasRippleCount||0)>=1,null,{timeout:5000});
            console.log('LIVE_XMAS_V4_POINTER_BRUSH',name,await page.evaluate(()=>Number(document.getElementById('xmas-pile-overlay').dataset.xmasRippleCount)));

            await page.evaluate(()=>window.scrollTo({top:Math.min(1400,Math.max(0,document.documentElement.scrollHeight-innerHeight)),behavior:'instant'}));
            await page.waitForFunction(()=>parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--xmas-photo-position'))>=25,null,{timeout:12000});
            const pan=await page.evaluate(()=>({position:getComputedStyle(document.documentElement).getPropertyValue('--xmas-photo-position').trim(),
              dataset:document.documentElement.dataset.xmasPhotoPan}));
            console.log('LIVE_XMAS_OWNER_PHOTO_SCROLL',name,JSON.stringify(pan));
            assert(parseFloat(pan.position)>=25,name+' background not moving with scroll');
            await page.screenshot({path:'artifacts/christmas-test/'+name+'-scrolled.png',fullPage:false});
            await page.evaluate(()=>scrollTo(0,0));
            await page.waitForFunction(()=>Number(document.querySelector('#homeQuickBar .xmas-mini-stage')?.dataset.xmasHitCount||0)>=1,null,{timeout:9000});
            const combat=await page.evaluate(()=>{
              const a=document.querySelector('#homeQuickBar .xmas-mini-stage');
              return {hits:Number(a?.dataset.xmasHitCount),shots:Number(a?.dataset.xmasShots),last:a?.dataset.xmasLastHit,
                actors:a?.querySelectorAll('.xmas-person').length,
                realSnow:!!document.getElementById('xmas-real-snow')};
            });
            console.log('LIVE_XMAS_V2_REAL_IMPACT',name,JSON.stringify(combat));
            assert(combat.actors===5&&combat.hits>=1&&combat.shots>=1&&combat.last.includes('-')&&combat.realSnow,name+' actual impact or crystal snow missing');
            await page.locator('.xmas-theme-toggle').click({timeout:10000});
            await page.locator('[data-xmas-theme="soft-dark"]').click({timeout:10000});
            await page.waitForTimeout(180);
            const soft=await state();
            console.log('LIVE_XMAS_SOFT_DARK',name,JSON.stringify(soft));
            assert.equal(soft.theme,'soft-dark',name+' soft dark switch failed');
            assert(!soft.snowCanvas,name+' Christmas snow not removed in Soft Dark');
            await page.locator('.xmas-theme-toggle').click({timeout:10000});
            await page.locator('[data-xmas-theme="christmas"]').click({timeout:10000});
            await page.waitForTimeout(600);
            const back=await state();
            console.log('LIVE_XMAS_RETURN_TO_CHRISTMAS',name,JSON.stringify(back));
            await page.screenshot({path:'artifacts/christmas-test/'+name+'-back.png',fullPage:false});
            assert.equal(back.theme,'christmas',name+' cannot return to Christmas');
            assert(back.snowCanvas && back.snowcaps>=3 && back.sprites>=5,name+' snow layers not restored');
            assert(await page.locator('#xmas-real-snow').count()===1,name+' crystalline snow not restored');
            for(const route of ['free-tools.html','pricing.html','jarvix-chat.html','generate-studio.html','audio-studio.html']){
              const resp=await page.goto('https://christmas-preview-20261114.deepsyq.pages.dev/'+route,{waitUntil:'domcontentloaded',timeout:30000});
              assert.equal(resp?.status(),200,name+' '+route+' HTTP status');
              await page.waitForFunction(()=>document.documentElement.dataset.siteTheme==='christmas' &&
                !!document.getElementById('xmas-real-snow'),null,{timeout:12000});
              await page.waitForTimeout(300);
              const other=await page.evaluate(()=>({
                theme:document.documentElement.dataset.siteTheme,
                flakes:!!document.querySelector('#xmas-real-snow'),
                snowcaps:document.querySelectorAll('.xmas-snowcap').length,
                mini:document.querySelectorAll('.xmas-mini-stage').length,
                toggle:!!document.querySelector('.xmas-theme-toggle')
              }));
              console.log('LIVE_XMAS_V2_SECONDARY_PAGE',name,route,JSON.stringify(other));
              assert(other.snowcaps>=1&&other.mini>=1&&other.toggle,name+' '+route+' decorations not distributed');
              const getPiles=()=>page.evaluate(()=>Number(document.getElementById('xmas-pile-overlay')?.dataset.xmasPiles||0));
              let pileCount=await getPiles();
              const minimum=isMobile?1:2;
              if(pileCount<minimum){
                // A narrow screen may start above the first card; validate AFTER
                // scrolling cards into the viewport instead of counting offscreen panels.
                for(const offset of [420,850,1350,2050]){
                  await page.evaluate(y=>window.scrollTo({top:y,behavior:'instant'}),offset);
                  await page.waitForTimeout(240);
                  pileCount=Math.max(pileCount,await getPiles());
                  if(pileCount>=minimum)break;
                }
              }
              console.log('LIVE_XMAS_V4_CARD_SNOW',name,route,pileCount);
              assert(pileCount>=minimum,name+' '+route+' missing fluffy snow on visible cards');
              await page.evaluate(()=>window.scrollTo({top:0,behavior:'instant'}));
              const pageBg=await page.evaluate(()=>({
                image:getComputedStyle(document.documentElement).backgroundImage,
                attachment:getComputedStyle(document.documentElement).backgroundAttachment
              }));
              assert(pageBg.image.includes('christmas-portrait.webp')&&pageBg.attachment.includes('fixed'),name+' '+route+' long portrait absent');
              if(route==='free-tools.html'){
                const pageTravel=await page.evaluate(()=>Math.max(0,document.documentElement.scrollHeight-innerHeight));
                if(pageTravel>400){
                  await page.evaluate(()=>window.scrollTo({top:Math.min(900,document.documentElement.scrollHeight-innerHeight),behavior:'instant'}));
                  await page.waitForFunction(()=>parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--xmas-photo-position'))>=20,null,{timeout:8000});
                  const value=await page.evaluate(()=>getComputedStyle(document.documentElement).getPropertyValue('--xmas-photo-position').trim());
                  console.log('LIVE_XMAS_TOOLS_PHOTO_SCROLL',name,value);
                  await page.evaluate(()=>window.scrollTo({top:0,behavior:'instant'}));
                }
              }
              if(route==='jarvix-chat.html'){
                const selector='#jChatForm .xmas-mini-universal';
                await page.waitForFunction(sel=>document.querySelector(sel)?.querySelectorAll('.xmas-person').length===5,selector,{timeout:10000});
                console.log('LIVE_XMAS_V3_UNIVERSAL_CHAT',name,route,'five actors mounted');
                const chimney=await page.evaluate(()=>({
                  shift:getComputedStyle(document.documentElement).getPropertyValue('--xmas-chimney-shift').trim(),
                  position:getComputedStyle(document.documentElement).backgroundPosition
                }));
                console.log('LIVE_XMAS_V4_CHIMNEY',name,JSON.stringify(chimney));
                assert(chimney.shift.includes('px')||chimney.shift.includes('clamp'),name+' chat chimney offset absent');
              }
            }
            // Image, Video and Audio all use the SAME JARVIX chat composer.
            for(const mode of ['image','video','audio']){
              const response=await page.goto('https://christmas-preview-20261114.deepsyq.pages.dev/jarvix-chat.html?mode='+mode,{waitUntil:'domcontentloaded',timeout:30000});
              assert.equal(response?.status(),200);
              await page.waitForFunction(()=>document.querySelector('#jChatForm .xmas-mini-universal')?.querySelectorAll('.xmas-person').length===5,null,{timeout:10000});
              const proof=await page.evaluate(()=>({
                composerForms:document.querySelectorAll('#jChatForm').length,
                people:document.querySelectorAll('#jChatForm .xmas-mini-universal .xmas-person').length,
                games:document.querySelectorAll('#jChatForm .xmas-mini-universal').length
              }));
              console.log('LIVE_XMAS_V3_CHAT_MODE',name,mode,JSON.stringify(proof));
              assert(proof.composerForms===1&&proof.people===5&&proof.games===1,name+' '+mode+' unified composer/game duplicated');
            }
            await ctx.close();
          }
          await browser.close();
          console.log('CHRISTMAS_BROWSER_ERRORS',JSON.stringify(errors.slice(0,15)));
          assert(!errors.some(x=>/deepsyq-christmas|xmas/i.test(x)),'Christmas runtime JS errors');
          console.log('ALL_CHRISTMAS_REAL_BROWSER_CHECKS_PASSED');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepsyq-christmas-desktop-mobile-qa
          path: artifacts/christmas-test/*.png
          if-no-files-found: ignore
          retention-days: 7

name: BASE 13 Studio wallet Playwright regression
on:
  push:
    branches: [base13-wallet-browser-fixtures-20261016]
    paths:
      - 'tests/generation-studio.spec.mjs'
      - '.github/workflows/base13-studio-wallet-browser.yml'
  pull_request:
    branches: [deepsyq-platform]
    paths:
      - 'tests/generation-studio.spec.mjs'
      - '.github/workflows/base13-studio-wallet-browser.yml'
permissions:
  contents: read
jobs:
  wallet-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Wallet+Stripe UI, Chromium desktop and mobile
        run: |
          npx playwright test tests/generation-studio.spec.mjs --grep 'AI wallet shows configured packs|wallet activity and Stripe return|BASE #13: existing credits' --project=chromium --project=mobile-chromium

name: Validate Video Variator Web

on:
  push:
    branches: [ main, free-tools, studio-stage-two, stage-two-avatar-download-fix ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check server syntax
        run: |
          node --check server/server.js
          node --check server/db.js
          node --check server/email-auth.js
      - name: Check PWA syntax
        run: |
          node --check app/src/main/assets/app-v4.js
          node --check app/src/main/assets/video-core.js
          node --check app/src/main/assets/bootstrap.js
          node --check app/src/main/assets/admin-access.js
          node --check app/src/main/assets/auth-email.js
          node --check app/src/main/assets/sw.js
          node --check app/src/main/assets/free-tools.js
          node --check app/src/main/assets/file-share.js
          node --check app/src/main/assets/tool-icons.js
          node --check app/src/main/assets/ai-tools.js
          node --check app/src/main/assets/avatar-studio.js
          node --check app/src/main/assets/app-v5.js
          node --check app/src/main/assets/product-polish.js
          node --check app/src/main/assets/theme.js
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Install local speech and video test fixtures
        run: sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg
      - name: Cross-browser tests
        run: npm run test:browsers

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: test-results/

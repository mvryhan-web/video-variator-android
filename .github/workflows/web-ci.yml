name: Validate Video Variator Web

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check server syntax
        run: |
          node --check server/server.js
          node --check server/db.js
      - name: Check PWA syntax
        run: |
          node --check app/src/main/assets/app-v3.js
          node --check app/src/main/assets/video-core.js
          node --check app/src/main/assets/folder.js
          node --check app/src/main/assets/billing-v3.js
          node --check app/src/main/assets/sw.js
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Cross-browser tests
        run: npm run test:browsers

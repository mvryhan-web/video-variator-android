name: Validate Video Variator Web

on:
  push:
    branches: [ main, free-tools, studio-stage-two, stage-two-avatar-download-fix ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check server syntax
        run: |
          node --check server/server.js
          node --check server/db.js
          node --check server/email-auth.js
      - name: Check PWA syntax
        run: |
          node --check app/src/main/assets/app-v4.js
          node --check app/src/main/assets/video-core.js
          node --check app/src/main/assets/bootstrap.js
          node --check app/src/main/assets/admin-access.js
          node --check app/src/main/assets/auth-email.js
          node --check app/src/main/assets/sw.js
          node --check app/src/main/assets/free-tools.js
          node --check app/src/main/assets/file-share.js
          node --check app/src/main/assets/tool-icons.js
          node --check app/src/main/assets/ai-tools.js
          node --check app/src/main/assets/avatar-studio.js
          node --check app/src/main/assets/app-v5.js
          node --check app/src/main/assets/product-polish.js
          node --check app/src/main/assets/theme.js
      - name: Production security and API smoke
        continue-on-error: true
        run: |
          node --input-type=module <<'NODE'
          const base='https://video-variator-android.onrender.com';
          const health=await fetch(base+'/api/health',{redirect:'error'});
          if(!health.ok)throw new Error('health '+health.status);
          const h=await health.json();
          if(!h.ok||h.videoProcessing!=='local-only')throw new Error('health payload');
          const configRes=await fetch(base+'/api/config',{redirect:'error'});
          if(!configRes.ok)throw new Error('config '+configRes.status);
          const cfg=await configRes.json();
          if(!cfg.privacy?.localVideoProcessing||!cfg.privacy?.rawVideoUploadDisabled)throw new Error('privacy config');
          if(cfg.plans?.basic?.price!==9||cfg.plans?.pro?.price!==24||cfg.plans?.business?.price!==99)throw new Error('plan prices changed');
          const googleProbe=await fetch(base+'/api/auth/google',{method:'POST',headers:{'content-type':'application/json'},body:'{}'});
          const appleProbe=await fetch(base+'/api/auth/apple',{method:'POST',headers:{'content-type':'application/json'},body:'{}'});
          const productionState={billingConfigured:!!cfg.billingConfigured,googleStatus:googleProbe.status,appleStatus:appleProbe.status,googleConfigured:!!cfg.googleClientId,appleConfigured:!!cfg.appleClientId};
          console.log('PRODUCTION_STATE '+JSON.stringify(productionState));
          const problems=[];
          if(!cfg.billingConfigured)problems.push('billing');
          if(googleProbe.status!==400)problems.push('google='+googleProbe.status);
          if(appleProbe.status!==400)problems.push('apple='+appleProbe.status);
          if(problems.length)throw new Error('Production configuration incomplete: '+problems.join(', '));
          const home=await fetch(base+'/',{redirect:'error'});
          const hsts=home.headers.get('strict-transport-security')||'',csp=home.headers.get('content-security-policy')||'';
          if(!hsts.includes('max-age=31536000')||!csp.includes("default-src 'self'"))throw new Error('security headers');
          const blocked=await fetch(base+'/api/raw-video-probe',{method:'POST',headers:{'content-type':'video/mp4'},body:'probe'});
          if(blocked.status!==415)throw new Error('raw video upload guard '+blocked.status);
          console.log(JSON.stringify({health:true,https:h.https,localOnly:h.videoProcessing,billingConfigured:!!cfg.billingConfigured,googleConfigured:!!cfg.googleClientId,appleConfigured:!!cfg.appleClientId,securityHeaders:true,rawUploadBlocked:true}));
          NODE

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Install local speech and video test fixtures
        run: sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg
      - name: Cross-browser tests
        run: npm run test:browsers

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: test-results/

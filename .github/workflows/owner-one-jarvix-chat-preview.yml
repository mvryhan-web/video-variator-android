name: Owner ONE JARVIX Chat Mode Routing TEST
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'app/src/main/assets/deepsyq.html'
      - 'app/src/main/assets/deepsyq-site-shell.js'
      - 'app/src/main/assets/jarvix-chat.html'
      - 'app/src/main/assets/jarvix-chat.js'
      - 'app/src/main/assets/jarvix-chat.css'
      - 'app/src/main/assets/jarvix-composer.js'
      - 'app/src/main/assets/jarvix-composer-design.js'
      - 'tests/deepsyq-navigation-contract-unit.mjs'
      - 'tests/owner-one-jarvix-chat.browser.test.mjs'
      - '.github/workflows/owner-one-jarvix-chat-preview.yml'
permissions:
  contents: read
concurrency:
  group: one-jarvix-chat-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify-and-publish-test:
    if: github.head_ref == 'owner-one-jarvix-chat-mode-routing-20261109' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_BRANCH: owner-one-jarvix-chat-mode-routing-20261109
      NODE_ENV: test
      AI_BILLING_MODE: test
      PRODUCT_WATCHER_ENABLED: 'false'
      OPENAI_API_KEY: ''
      GEMINI_API_KEY: ''
      DATABASE_URL: ''
      STRIPE_SECRET_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Ensure candidate includes current accepted DEV
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/deepsyq-platform:refs/remotes/origin/deepsyq-platform
          git merge-base --is-ancestor refs/remotes/origin/deepsyq-platform HEAD
      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile and test canonical chat routing
        run: |
          set -euo pipefail
          for file in app/src/main/assets/jarvix-chat.js app/src/main/assets/jarvix-composer.js app/src/main/assets/jarvix-composer-design.js app/src/main/assets/deepsyq-site-shell.js; do node --check "$file"; done
          node --test tests/deepsyq-navigation-contract-unit.mjs tests/jarvix-bottom-dock.test.mjs tests/jarvix-unified-chat.test.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify no duplicated chat, desktop/mobile, no paid calls
        run: |
          node --test tests/owner-one-jarvix-chat.browser.test.mjs
          node --test tests/jarvix-universal-hub.browser.test.mjs
      - name: Check Cloudflare production branch guard
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/deepsyq" > /tmp/pages-before.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const data=JSON.parse(fs.readFileSync('/tmp/pages-before.json','utf8'));
          const p=data.result;
          if(!data.success||p?.name!=='deepsyq'||p?.production_branch!=='deepsyq-platform'||!p?.canonical_deployment?.id||p?.production_branch===process.env.PREVIEW_BRANCH)throw Error('Refuse publish: production ambiguity');
          fs.appendFileSync(process.env.GITHUB_ENV,'MAIN_BEFORE='+p.canonical_deployment.id+'\n');
          console.log('PRODUCTION_GUARD_PASS',JSON.stringify({branch:p.production_branch,id:p.canonical_deployment.id}));
          JS
      - name: Publish isolated Cloudflare Pages preview only
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy app/src/main/assets --project-name=deepsyq --branch="$PREVIEW_BRANCH" --commit-hash="${{ github.event.pull_request.head.sha }}" | tee /tmp/one-chat-deploy.log
          PREVIEW_URL=$(grep -Eo 'https://[a-z0-9-]+\.deepsyq\.pages\.dev' /tmp/one-chat-deploy.log | head -n1)
          if [[ ! "$PREVIEW_URL" =~ ^https://[a-z0-9-]+\.deepsyq\.pages\.dev$ ]]; then exit 1; fi
          echo "ONE_CHAT_PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
          echo "OWNER_ONE_CHAT_PREVIEW_URL=$PREVIEW_URL"
      - name: Live TEST checks in desktop and mobile
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright';
          const origin=process.env.ONE_CHAT_PREVIEW_URL;
          assert.match(origin,/^https:\/\/[a-z0-9-]+\.deepsyq\.pages\.dev$/);
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          try{
            for(const [device,viewport] of [['desktop',{width:1365,height:900}],['mobile',{width:390,height:844}]]){
              const context=await browser.newContext({viewport,isMobile:device==='mobile',hasTouch:device==='mobile'});
              try{
                const page=await context.newPage();
                for(const mode of ['image','video','audio']){
                  const response=await page.goto(origin+'/jarvix-chat.html?mode='+mode,{waitUntil:'domcontentloaded',timeout:30000});
                  assert.equal(response?.status(),200);
                  await page.locator('body[data-jarvix-mode="'+mode+'"]').waitFor({timeout:20000});
                  assert.match(new URL(page.url()).pathname,/^\/jarvix-chat(?:\.html)?$/,'same canonical JARVIX path (Cloudflare clean URL accepted)');
                  assert.match(await page.locator('#jWorkspaceFrame').getAttribute('src'),new RegExp('studio='+mode));
                  assert.equal(await page.locator('#jChatForm').count(),1);
                  console.log('ONE_JARVIX_CHAT_MODE_PASS',JSON.stringify({device,mode,pathname:new URL(page.url()).pathname}));
                }
              }finally{await context.close();}
            }
            assert.equal((await fetch(origin+'/index.html')).status,200,'Standalone Video Uniquifier preserved');
          }finally{await browser.close();}
          JS
      - name: Verify Cloudflare MAIN deployment unchanged
        if: success()
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/deepsyq" > /tmp/pages-after.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const d=JSON.parse(fs.readFileSync('/tmp/pages-after.json','utf8'));
          if(!d.success||d.result?.production_branch!=='deepsyq-platform'||d.result?.canonical_deployment?.id!==process.env.MAIN_BEFORE)throw Error('MAIN changed concurrently');
          console.log('MAIN_UNCHANGED',d.result.canonical_deployment.id);
          JS
      - name: Store desktop/mobile local acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-jarvix-chat-desktop-mobile
          path: artifacts/one-jarvix-chat/*.png
          if-no-files-found: ignore
          retention-days: 7

name: JARVIX NEW deployed preview acceptance

on:
  push:
    branches: [jarvis-new]
    paths:
      - 'scripts/verify_jarvix_new_preview_activation.py'
      - '.github/workflows/jarvis-new-preview-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  new-agent-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real browser for deployed test-site checks
        run: |
          python -m pip install --disable-pip-version-check playwright==1.58.0
          python -m playwright install chromium --with-deps
      - name: Check actual Cloudflare deployment, user click and old chat redirection
        run: python scripts/verify_jarvix_new_preview_activation.py

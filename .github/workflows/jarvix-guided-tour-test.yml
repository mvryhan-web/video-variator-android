name: Jarvis dependency and regression gate
on:
  pull_request:
    branches: [deepsyq-platform]
    paths:
      - 'app/src/main/assets/**'
      - 'server/**'
      - 'tests/jarvi*.mjs'
      - 'tests/free-ai-studio-preview-isolation.test.mjs'
      - 'tests/pricing-owner-art-lock.mjs'
      - 'docs/JARVIS_*.json'
      - 'scripts/jarvis-stability.mjs'
      - 'package*.json'
      - '.github/workflows/jarvix-guided-tour-test.yml'
  push:
    branches: [deepsyq-platform, p/navigation-compact-20261104]
    paths:
      - 'app/src/main/assets/**'
      - 'server/**'
      - 'tests/jarvi*.mjs'
      - 'tests/free-ai-studio-preview-isolation.test.mjs'
      - 'tests/pricing-owner-art-lock.mjs'
      - 'docs/JARVIS_*.json'
      - 'scripts/jarvis-stability.mjs'
      - 'package*.json'
      - '.github/workflows/jarvix-guided-tour-test.yml'
permissions:
  contents: read
jobs:
  guided-tour-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install production dependencies and run the shared stability gate
        run: npm ci --omit=dev --no-audit --no-fund

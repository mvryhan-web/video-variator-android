name: BASE #17 customer credits only
on:
  push:
    branches: [base17-private-unit-economics-20261016]
  pull_request:
    paths:
      - 'server/generation-studio.js'
      - 'tests/base17-private-unit-economics.mjs'
permissions:
  contents: read
jobs:
  owner-economics-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Server API privacy and customer credits
        run: |
          node --check server/generation-studio.js
          node --check tests/base17-private-unit-economics.mjs
          node --test tests/base17-private-unit-economics.mjs

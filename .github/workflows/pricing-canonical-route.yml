name: Canonical Pricing and Private AI Wallet
on:
  pull_request:
    branches: [deepsyq-platform]
    paths:
      - 'app/src/main/assets/pricing.html'
      - 'app/src/main/assets/pricing-page.js'
      - 'app/src/main/assets/pricing-wallet.js'
      - 'app/src/main/assets/pricing-wallet.css'
      - 'app/src/main/assets/ai-pricing.html'
      - 'tests/pricing-canonical*.mjs'
      - 'tests/pricing-cinematic.spec.mjs'
      - 'tests/pricing-account-privacy*.mjs'
      - '.github/workflows/pricing-canonical-route.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  pricing-unified:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --check app/src/main/assets/pricing-wallet.js
      - run: node --check app/src/main/assets/pricing-page.js
      - run: node --test tests/pricing-canonical-unit.mjs
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --config tests/pricing-canonical.config.mjs
      - run: npx playwright test --config tests/pricing-account-privacy.config.mjs
      - run: npx playwright test --config tests/pricing-cinematic.config.mjs

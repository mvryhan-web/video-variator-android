name: Agent C C13 Inspiration hover owner violet (zero spend)
on:
  pull_request:
    branches: [deepsyq-platform]
    paths:
      - 'app/src/main/assets/inspiration.css'
      - 'tests/agent-c-base1-inspiration-hover.spec.mjs'
      - '.github/workflows/agent-c-c13-inspiration-hover.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspiration-hover-five-engines:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ''
      STRIPE_SECRET_KEY: ''
      GOOGLE_API_KEY: ''
      BYTEPLUS_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --check tests/agent-c-base1-inspiration-hover.spec.mjs
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Real owner color hover, five widths, pagination and no paid calls
        run: npx playwright test tests/agent-c-base1-inspiration-hover.spec.mjs --project=chromium --project=firefox --project=webkit --project=mobile-chromium --project=mobile-webkit --workers=2
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agent-c-c13-hover-failure
          path: test-results/
          if-no-files-found: ignore

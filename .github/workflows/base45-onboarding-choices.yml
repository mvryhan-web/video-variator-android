name: BASE 45 authorized first-run choices

on:
  pull_request:
    paths:
      - 'app/src/main/assets/onboarding-options.js'
      - 'app/src/main/assets/deepsyq.js'
      - 'tests/agent-a-base45-options-unit.mjs'
      - 'tests/agent-a-base45-onboarding.spec.mjs'
      - '.github/workflows/base45-onboarding-choices.yml'
  push:
    branches: [deepsyq-platform]
    paths:
      - 'app/src/main/assets/onboarding-options.js'
      - 'app/src/main/assets/deepsyq.js'
      - 'tests/agent-a-base45-options-unit.mjs'
      - 'tests/agent-a-base45-onboarding.spec.mjs'
      - '.github/workflows/base45-onboarding-choices.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: base45-onboarding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  onboarding-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: |
          node --check app/src/main/assets/onboarding-options.js
          node --check app/src/main/assets/deepsyq.js
          node --test tests/agent-a-base45-options-unit.mjs

  onboarding-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test tests/agent-a-base45-onboarding.spec.mjs --project=chromium --project=webkit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: base45-browser-onboarding-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

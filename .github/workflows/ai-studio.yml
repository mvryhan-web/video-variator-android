name: AI Studio preview checks
on:
  push:
    branches: [ai-generation-studio]
  pull_request:
    paths: ['server/generation-*.js', 'app/src/main/assets/generate-studio.*', 'app/src/main/assets/generate-models.js', 'tests/generation-*', '.github/workflows/ai-studio.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: vv_ai_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/generation-studio-unit.mjs tests/generation-byteplus-unit.mjs tests/generation-billing-unit.mjs tests/generation-wallet-postgres.mjs
        env:
          NODE_ENV: test
          AI_TEST_DATABASE_URL: postgres://fixture:fixture@127.0.0.1:5432/vv_ai_test
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test tests/generation-studio.spec.mjs

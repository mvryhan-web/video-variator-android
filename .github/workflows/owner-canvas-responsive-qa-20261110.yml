name: Canvas responsive window — browser resize QA
on:
  push:
    branches: [owner-canvas-responsive-window-20261110]
    paths: ['.github/workflows/owner-canvas-responsive-qa-20261110.yml']
permissions: {contents: read}
jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - name: Install Playwright
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Test Canvas auto-resize at 13 window widths
        run: npx playwright test tests/owner-canvas-responsive-window.spec.mjs --project=chromium --reporter=list --retries=0

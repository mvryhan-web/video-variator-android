name: Coordinator VU Visible Mode Regression
on:
  pull_request:
    branches: [deepsyq-platform]
    paths:
      - 'tests/browser.spec.mjs'
      - '.github/workflows/coord5-vu-visible-mode-regression.yml'
permissions: {contents: read}
jobs:
  real-visible-mode-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      DATABASE_URL: ''
      STRIPE_SECRET_KEY: ''
      GOOGLE_API_KEY: ''
      GEMINI_API_KEY: ''
      BYTEPLUS_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check tests/browser.spec.mjs
      - name: Test real visible mode and resolution controls across five engines
        run: >-
          npx playwright test tests/browser.spec.mjs
          --grep 'trial unlocks all modes plus 720p 1080p and 4K'
          --project=chromium --project=firefox --project=webkit
          --project=mobile-chromium --project=mobile-webkit
          --workers=2 --retries=0

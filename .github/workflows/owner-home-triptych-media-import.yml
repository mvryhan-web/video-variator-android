name: Owner one-time Home MP4 import (PR branch only)
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/owner-home-triptych-media-import.yml'
permissions:
  contents: write
jobs:
  import-owner-uploaded-videos:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'owner-home-triptych-videos-20261021' }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: owner-home-triptych-videos-20261021
          persist-credentials: true
      - name: Download exactly three owner-uploaded MP4 assets with SHA256 verification
        shell: bash
        run: |
          set -euo pipefail
          base="app/src/main/assets/media/home/neon-20261018"
          mkdir -p "$base"
          root="https://d2ol7oe51mr4n9.cloudfront.net/user_3DohHzQ92OwE6TBQr5M2fYm2CwS"
          curl --fail --location --retry 3 --silent --show-error "$root/9d600e7b-c4df-4243-8fd4-4aa7481727de.mp4" -o "$base/canvas-card.mp4"
          curl --fail --location --retry 3 --silent --show-error "$root/e664fa80-1392-4c01-8a12-b4362ab97c2a.mp4" -o "$base/agent-card.mp4"
          curl --fail --location --retry 3 --silent --show-error "$root/036cbcc3-b677-4182-8e7a-e2ad50baec52.mp4" -o "$base/apps-card.mp4"
          (
            cd "$base"
            printf '%s\n' \
              'e6a4659e52ec7fe3569d7113f8601f32b44cc5f60f32396ea0dd2921ee7d438b  canvas-card.mp4' \
              '9e25f6958ec201a632835701f76c182639db134abc78266f8a4029b72cf4ed08  agent-card.mp4' \
              'e94f31b4864da28e3bd355532bf5b0ac53db3150ae281cff881bcf8d8810048c  apps-card.mp4' | sha256sum -c -
          )
          test "$(stat -c %s "$base/canvas-card.mp4")" -eq 5476640
          test "$(stat -c %s "$base/agent-card.mp4")" -eq 4688470
          test "$(stat -c %s "$base/apps-card.mp4")" -eq 3114875
      - name: Commit only these three approved MP4s on the existing PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'deepsyq-owner-media[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app/src/main/assets/media/home/neon-20261018/{canvas,agent,apps}-card.mp4
          if git diff --cached --quiet; then
            echo 'Already imported; no-op'
            exit 0
          fi
          git commit -m "assets(home): import owner-approved original 1080p triptych videos"
          git push origin HEAD:owner-home-triptych-videos-20261021

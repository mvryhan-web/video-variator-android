name: Publish tested Smart Studio APK download

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/wow-phone-download.yml']

permissions:
  contents: write
  actions: read

concurrency:
  group: smart-studio-test-download
  cancel-in-progress: false

jobs:
  publish-tested-preview:
    if: github.head_ref == 'wow-tested-apk-download' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_SHA: 9750954551c4b99f6aab7b53ddcb1e42ba324a18
      SOURCE_RUN: '38083395655'
      WEB_RUN: '38083395652'
      TEST_TAG: smart-studio-test-2026-10-10
    steps:
      - name: Verify frozen tested source
        run: |
          set -euo pipefail
          for run_id in "$SOURCE_RUN" "$WEB_RUN"; do
            test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .conclusion)" = success
            test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .head_sha)" = "$SOURCE_SHA"
          done

      - name: Download the already signed and tested APK
        run: |
          set -euo pipefail
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name VideoUniquifier-APK --dir apk
          echo '29eb22e2bde2cd0eadd626c227626254e7b522dcdb3a3afdae09709e807bca37  apk/VideoUniquifier.apk' | sha256sum --check

      - name: Publish test download without changing latest release
        run: |
          set -euo pipefail
          if gh release view "$TEST_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view "$TEST_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,url
            exit 0
          fi
          cat > notes.md <<'NOTES'
          Android owner acceptance build for local Smart Studio.
          Open the app menu, then Smart Studio - prototype.
          Tracks a clearly visible face into an optional 9:16 crop, with framing preview. Best with a wide source and one face; already vertical footage may have no room for horizontal crop movement. Multiple people or occlusion can break association. It does not identify people or track an invisible body.
          Recognizes speech locally into editable words and timestamps. Exports active-word captions and a saved brand name, accent color and caption size using the existing FFmpeg WASM runtime.
          Preview, Download, Share and Delete preview are available. Android automatically saves to Movies/VideoUniquifier. Deleting a preview does not delete files already saved in Gallery.
          Prototype limits: 60 seconds / 150 MB, up to 250 caption entries; up to 720x1280 vertical or 1280px longest side otherwise. Original audio packets and duration are preserved for supported MP4/AAC input. Review every caption and the crop before export. Keep the page visible for frame analysis.
          Free local model downloads on first use; no raw video or audio uploads and no paid API. Face runtime/model are packaged in the APK. Local word recognition requires a first-use model download.
          Real browser model/export/transcription checks and Android 15 model/export/Gallery plus Android 11 service checks passed for the frozen source.
          Existing processing modes, authorization, billing and pricing remain unchanged. Package com.videovariator.app and the existing signing key are retained.
          This is a test prerelease, not a production website or latest stable app update. Test on your physical phone before production approval.
          Visible app banner: Smart Studio prototype - v1. Android APK cannot be installed on iPhone.
          NOTES
          gh release create "$TEST_TAG" apk/VideoUniquifier.apk --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" --prerelease --latest=false \
            --title 'Video Uniquifier — Smart Studio Android prototype' --notes-file notes.md
          gh release view "$TEST_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,url,assets

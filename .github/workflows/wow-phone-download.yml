name: Publish tested WOW APK download

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/wow-phone-download.yml']

permissions:
  contents: write
  actions: read

concurrency:
  group: wow-phone-test-download
  cancel-in-progress: false

jobs:
  publish-tested-preview:
    if: github.head_ref == 'wow-tested-apk-download' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_SHA: d6793e44b4acd5d83e9875fa0622f7a5b33b1615
      SOURCE_RUN: '38066863339'
      WEB_RUN: '38066863413'
      TEST_TAG: wow-dashboard-test-2026-10-10
    steps:
      - name: Verify frozen tested source
        run: |
          set -euo pipefail
          for run_id in "$SOURCE_RUN" "$WEB_RUN"; do
            test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .conclusion)" = success
            test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .head_sha)" = "$SOURCE_SHA"
          done

      - name: Download the already signed and tested APK
        run: |
          set -euo pipefail
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name VideoUniquifier-APK --dir apk
          echo 'cad1189c44627c5300f559c888617dffe2913e1b5122a9706ea728ce4663ec91  apk/VideoUniquifier.apk' | sha256sum --check

      - name: Publish test download without changing latest release
        run: |
          set -euo pipefail
          if gh release view "$TEST_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view "$TEST_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,url
            exit 0
          fi
          cat > notes.md <<'NOTES'
          Android owner acceptance build for the compact dashboard and optional WOW Montage v2.
          Visible Gentle / Balance / Dynamic, 720p / 1080p / 4K and 9:16 / 16:9 buttons replace dashboard dropdowns.
          Smaller mobile spacing and statistics. Fast export is always enabled; the redundant Trial/mode hint and long WOW description are hidden.
          Optimization and the default-off WOW switch remain. Existing server plan restrictions, processing recipes, Gallery, Download and Share are preserved.
          WOW v2 adds measured camera accents within the first 12 seconds, without speech/beat/semantic recognition or a duplicate-detection guarantee.
          Uses packaged test screens and the existing production API. Original videos remain on the device.
          Package com.videovariator.app and the existing signing key are retained.
          This is a test prerelease, not the production app update. Production website and latest stable release remain unchanged.
          Visible app banner: WOW + compact dashboard · v3. This APK cannot be installed on iPhone.
          NOTES
          gh release create "$TEST_TAG" apk/VideoUniquifier.apk --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" --prerelease --latest=false \
            --title 'Video Uniquifier — Compact dashboard Android test' --notes-file notes.md
          gh release view "$TEST_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,url,assets

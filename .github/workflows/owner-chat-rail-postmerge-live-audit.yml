name: Owner read-only live Video Uniquifier chat rail audit 20261109
on:
  push:
    branches:
      - owner-chat-remove-video-uniquifier-live-20261109
    paths:
      - .github/workflows/owner-chat-rail-postmerge-live-audit.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Read-only verify production deployment and public chat source, no deployment
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const token=process.env.CLOUDFLARE_API_TOKEN,account=process.env.CLOUDFLARE_ACCOUNT_ID;
          assert(token&&account,'Cloudflare credentials must be held by GitHub Actions only');
          const headers={Authorization:'Bearer '+token};
          const endpoint='https://api.cloudflare.com/client/v4/accounts/'+account+'/pages/projects/deepsyq';
          const projectResponse=await fetch(endpoint,{headers,signal:AbortSignal.timeout(12000)});
          const project=await projectResponse.json();
          assert(projectResponse.ok&&project.success===true,'Cloudflare project cannot be verified');
          assert.equal(project.result.production_branch,'deepsyq-platform');
          const canonical=project.result.canonical_deployment;
          assert(canonical?.id&&canonical?.url,'No canonical production deployment');
          const deploymentResponse=await fetch(endpoint+'/deployments/'+canonical.id,{headers,signal:AbortSignal.timeout(12000)});
          const deployment=await deploymentResponse.json();
          assert(deploymentResponse.ok&&deployment.success===true,'Cannot read canonical deployment');
          const functions=deployment.result.uses_functions;
          const urls=['https://deepsyq.app/jarvix-composer-design.js',canonical.url+'/jarvix-composer-design.js'];
          const checks=[];
          for(const url of urls){
            const res=await fetch(url+'?check_chat_rail=20261109',{signal:AbortSignal.timeout(12000),headers:{'Cache-Control':'no-cache'}});
            const mime=res.headers.get('content-type')||'';
            const body=await res.text();
            const exact=(body.match(/\['Video Uniquifier','index\.html','legacy'\]/g)||[]).length;
            checks.push({url,status:res.status,mime,bytes:body.length,oldLinks:exact,jarvixPreserved:body.includes("['JARVIX','jarvix-chat.html',null]")});
          }
          const tool=await fetch('https://deepsyq.app/index.html',{signal:AbortSignal.timeout(12000)});
          console.log('WORKING_DOMAIN_AUDIT',JSON.stringify({productionBranch:project.result.production_branch,canonicalId:canonical.id,canonicalCommit:deployment.result.deployment_trigger?.metadata?.commit_hash||null,uses_functions:functions,checks,standaloneVideoUniquifierStatus:tool.status,onlyReadOperations:true}));
          if(functions!==true)throw Error('PRODUCTION_WORKER_NOT_CONFIRMED');
          if(!checks.every(x=>x.status===200&&x.mime.includes('javascript')&&x.oldLinks===0&&x.jarvixPreserved))throw Error('PRODUCTION_CHAT_RAIL_REMOVAL_NOT_LIVE');
          if(tool.status!==200)throw Error('STANDALONE_UNIQUIFIER_UNAVAILABLE');
          console.log('WORKING_SITE_CHAT_RAIL_RELEASE_VISIBLE_WITH_WORKER');
          JS

name: Agent D BASE 50 rollout security (no paid calls)
on:
  pull_request:
    branches: [deepsyq-platform]
    paths:
      - 'tests/agent-d-base50-rollout-security-unit.mjs'
      - '.github/workflows/agent-d-base50-rollout-security.yml'
  push:
    branches: [agent-d-base50-rollout-security-audit-20261029]
permissions:
  contents: read
jobs:
  offline-feature-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      STRIPE_SECRET_KEY: ''
      STRIPE_WEBHOOK_SECRET: ''
      DATABASE_URL: ''
      OPENAI_API_KEY: ''
      GEMINI_API_KEY: ''
      BYTEPLUS_API_KEY: ''
      AI_BILLING_ENABLED: 'false'
      AI_PUBLIC_GENERATION_ENABLED: 'false'
      AI_PURCHASED_ONLY_DISPATCH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax and exhaustive offline security checks
        run: |
          node --check tests/agent-d-base50-rollout-security-unit.mjs
          node --test tests/agent-d-base50-rollout-security-unit.mjs tests/base50-feature-flags-unit.mjs tests/base50-platform-feature-flags-unit.mjs tests/user-agent-stage1-local-draft-unit.mjs

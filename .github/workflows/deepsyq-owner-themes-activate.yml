name: DEEPSYQ owner appearance carousel — production activation only
# Owner request 2026-11-15: new visitors default to Christmas; saved choices unchanged.
# verification rerun: canonical Worker may transform account HTML; UI-content verification only.
on:
  push:
    branches: [deepsyq-platform]
    paths: ['.github/workflows/deepsyq-owner-themes-activate.yml']
permissions:
  contents: read
concurrency:
  group: deepsyq-owner-appearance-activate
  cancel-in-progress: false
jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact seasonal cutoff and six untouched theme options
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = deepsyq-platform
          node --check app/src/main/assets/deepsyq-mobile-shell.js
          node --check app/src/main/assets/deepsyq-theme-loader.js
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const page=fs.readFileSync('app/src/main/assets/account-settings.html','utf8');
          const shell=fs.readFileSync('app/src/main/assets/deepsyq-mobile-shell.js','utf8');
          const buttons=[...page.matchAll(/data-account-theme="([^"]+)"/g)].map(x=>x[1]);
          assert.deepEqual(buttons,['light','dark','system','brown','soft-dark','christmas']);
          assert(page.includes("theme.value=classicThemes.has(value)?value:'dark'"));
          const loader=fs.readFileSync('app/src/main/assets/deepsyq-theme-loader.js','utf8');
          assert(loader.includes("const classic=new Set(['light','dark','system'])"));
          const cutoff="2027-01-11T00:00:00+01:00";
          assert(loader.includes("Date.parse('"+cutoff+"')"));
          assert(page.includes("Date.parse('"+cutoff+"')"));
          assert(loader.includes("else if(!saved&&previousClassic===null)apply(seasonalDefault(),false);"));
          assert(loader.includes("if(variants.has(saved))apply(saved,false);"));
          assert(loader.includes("else if(classic.has(previousClassic))apply(previousClassic,false);"));
          assert(loader.includes("setInterval(checkSeasonBoundary,60_000)"));
          assert(page.includes("return Date.now()<Date.parse('"+cutoff+"')?'christmas':'dark'"));
          const snow=fs.readFileSync('app/src/main/assets/deepsyq-christmas-v4.css','utf8');
          assert(snow.includes('main.jarvix-chat .j-chat-bottom form#jChatForm.jarvix-compose'));
          for(const id of ['accountLanguage','accountAppearance','themeChoice','accountTabs','accountHeroSignIn','manageBillingBtn','cancelSubscriptionBtn']){
            if(id==='accountTabs')continue;
            assert(page.includes('id="'+id+'"'),'Original account action missing: '+id);
          }
          assert(page.includes('id="accountThemesCarousel"'));
          assert(page.includes('data-theme-arrow="-1"')&&page.includes('data-theme-arrow="1"'));
          assert(shell.includes("import './deepsyq-theme-loader.js';"));
          const diff=await import('node:child_process');
          const changed=diff.execFileSync('git',['diff','--name-only','HEAD^','HEAD'],{encoding:'utf8'}).trim().split('\n').filter(Boolean).sort();
          assert.deepEqual(changed,[
            '.github/workflows/deepsyq-owner-themes-activate.yml',
            'app/src/main/assets/account-settings.html',
            'app/src/main/assets/deepsyq-theme-loader.js',
            'scripts/deepsyq_surgical_publish.py'
          ],'Unexpected changes outside seasonal theme-only release');
          console.log('EXACT_OWNER_APPEARANCE_SCOPE_PASS',buttons);
          NODE
      - name: Simulate the seasonal deadline and preserved user selections (read-only)
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          import assert from 'node:assert/strict';
          const code=fs.readFileSync('app/src/main/assets/deepsyq-theme-loader.js','utf8');
          const cutoff=Date.parse('2027-01-11T00:00:00+01:00');
          function boot(when,initial={},light=false){
            let now=when;
            const values=new Map(Object.entries(initial)),writes=[];
            const elements=new Map(),timers=[],events={};
            const root={dataset:{theme:'dark'},removeAttribute(name){if(name==='data-site-theme')delete this.dataset.siteTheme}};
            const date=class extends Date{static now(){return now}};
            const storage={
              getItem(key){return values.has(key)?values.get(key):null},
              setItem(key,value){writes.push(['set',key,value]);values.set(key,value)},
              removeItem(key){writes.push(['remove',key]);values.delete(key)}
            };
            const doc={
              documentElement:root,hidden:false,
              head:{append(el){elements.set(el.id,el)}},
              getElementById(id){return elements.get(id)||null},
              createElement(tag){return {tagName:tag,addEventListener(){}}},
              addEventListener(name,handler){events['document:'+name]=handler}
            };
            const window={
              addEventListener(name,handler){events[name]=handler},
              dispatchEvent(){},
            };
            const sandbox={
              Date:date,localStorage:storage,document:doc,window,
              MutationObserver:class{observe(){}},
              CustomEvent:class{constructor(name,init){this.name=name;this.detail=init?.detail}},
              matchMedia:()=>({matches:light,addEventListener(){}}),
              setInterval(fn,ms){assert.equal(ms,60000);timers.push(fn)},
              console:{warn(){}}
            };
            vm.runInNewContext(code,sandbox,{timeout:1500});
            return {root,values,writes,window,tick(time){now=time;for(const fn of timers)fn()}};
          }
          const before=boot(cutoff-1);
          assert.equal(before.root.dataset.siteTheme,'christmas');
          assert.equal(before.writes.length,0,'Auto-default MUST NOT overwrite user preferences');
          before.tick(cutoff);
          assert.equal(before.root.dataset.siteTheme,undefined);
          assert.equal(before.root.dataset.theme,'dark');
          assert.equal(before.writes.length,0);
          for(const date of [cutoff,cutoff+86400000]){
            const fresh=boot(date);
            assert.equal(fresh.root.dataset.siteTheme,undefined,'Christmas must end after Jan 10');
            assert.equal(fresh.root.dataset.theme,'dark','Restore previous dark default');
            assert.equal(fresh.writes.length,0);
          }
          for(const theme of ['light','dark','system']){
            for(const date of [cutoff-86400000,cutoff+86400000]){
              const saved=boot(date,{vu_theme:theme},true);
              assert.equal(saved.root.dataset.siteTheme,undefined);
              assert.equal(saved.root.dataset.theme,theme==='system'?'light':theme);
              assert.equal(saved.values.get('vu_theme'),theme);
              assert.equal(saved.writes.length,0);
            }
          }
          for(const theme of ['brown','soft-dark','christmas']){
            for(const date of [cutoff-86400000,cutoff+86400000]){
              const saved=boot(date,{deepsyq_site_theme:theme});
              assert.equal(saved.root.dataset.siteTheme,theme);
              assert.equal(saved.writes.length,0);
            }
          }
          const chosen=boot(cutoff+86400000);
          chosen.window.deepsyqSetAppearance('christmas');
          assert.equal(chosen.values.get('deepsyq_site_theme'),'christmas');
          chosen.tick(cutoff+86400000*3);
          assert.equal(chosen.root.dataset.siteTheme,'christmas');
          console.log('SEASONAL_DEFAULT_PASS',JSON.stringify({
            winterEnds:'2027-01-11T00:00:00+01:00',
            firstVisitBefore:'christmas',
            firstVisitAfter:'dark',
            savedVariants:6,
            explicitlySelectedChristmasPersists:true
          }));
          NODE
      - name: Verify all Christmas assets were already published BEFORE activating controls
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            deepsyq-theme-loader.js deepsyq-theme-styles.css \
            deepsyq-christmas.js deepsyq-christmas.css \
            deepsyq-christmas-v2.js deepsyq-christmas-v2.css \
            deepsyq-christmas-v3.css deepsyq-christmas-v4.js \
            deepsyq-christmas-v4.css \
            media/christmas/christmas-portrait.webp \
            media/christmas/snowbank-texture.webp; do
            curl --fail --silent --show-error --max-time 18 --retry 2 \
              "https://deepsyq.app/$file?owner-theme-preflight=$GITHUB_SHA" >/dev/null
          done
          curl --fail --silent --show-error --max-time 18 'https://deepsyq.app/api/config' >/dev/null
          echo 'PRODUCTION_THEME_ASSETS_READY'
      - name: Publish only the two seasonal-default files (Worker binding checks mandatory)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir requests==2.32.3 blake3==1.0.8
          python scripts/deepsyq_surgical_publish.py \
            --mode publish --files 'account-settings.html,deepsyq-theme-loader.js' \
            --commit "$GITHUB_SHA"
      - name: Verify 2027 expiry, existing six theme controls and unchanged chat CSS
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 4 --max-time 20 \
            "https://deepsyq.app/account-settings.html?owner-themes=$GITHUB_SHA" \
            --output /tmp/deepsyq-owner-account-appearance.html
          grep -Fq 'id="accountThemesCarousel"' /tmp/deepsyq-owner-account-appearance.html
          grep -Fq 'data-account-theme="christmas"' /tmp/deepsyq-owner-account-appearance.html
          grep -Fq 'data-account-theme="light"' /tmp/deepsyq-owner-account-appearance.html
          grep -Fq 'data-account-theme="dark"' /tmp/deepsyq-owner-account-appearance.html
          grep -Fq 'data-account-theme="system"' /tmp/deepsyq-owner-account-appearance.html
          curl --fail --silent --show-error --retry 4 --max-time 20 \
            "https://deepsyq.app/deepsyq-mobile-shell.js?owner-themes=$GITHUB_SHA" \
            --output /tmp/deepsyq-owner-appearance-shell.js
          curl --fail --silent --show-error --retry 4 --max-time 20 \
            "https://deepsyq.app/deepsyq-theme-loader.js?owner-themes=$GITHUB_SHA" \
            --output /tmp/deepsyq-owner-theme-loader.js
          grep -Fq "const classic=new Set(['light','dark','system'])" /tmp/deepsyq-owner-theme-loader.js
          grep -Fq "const seasonalCutoff=Date.parse('2027-01-11T00:00:00+01:00');" /tmp/deepsyq-owner-theme-loader.js
          grep -Fq "else if(!saved&&previousClassic===null)apply(seasonalDefault(),false);" /tmp/deepsyq-owner-theme-loader.js
          curl --fail --silent --show-error --retry 4 --max-time 20 \
            "https://deepsyq.app/deepsyq-christmas-v4.css?owner-themes=$GITHUB_SHA" \
            --output /tmp/deepsyq-owner-christmas-v4.css
          grep -Fq 'main.jarvix-chat .j-chat-bottom form#jChatForm.jarvix-compose' /tmp/deepsyq-owner-christmas-v4.css
          grep -Fq 'deepsyq-theme-loader.js' /tmp/deepsyq-owner-appearance-shell.js
          curl --fail --silent --show-error --max-time 20 'https://deepsyq.app/api/config' >/dev/null
          echo 'PRODUCTION_BROWN_BLACK_CHRISTMAS_CAROUSEL_VERIFIED'

name: Block 2 User Agent A2.1 offline plan acceptance
on:
  pull_request:
    paths:
      - 'server/user-agent-plan.js'
      - 'tests/user-agent-plan-unit.mjs'
      - '.github/workflows/block2-user-agent-a2-1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify native ESM syntax
        run: |
          node --check server/user-agent-plan.js
          node --check tests/user-agent-plan-unit.mjs
      - name: Native no-spend A2.1 tests
        run: node --test tests/user-agent-plan-unit.mjs

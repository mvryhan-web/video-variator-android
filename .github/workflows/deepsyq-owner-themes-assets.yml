name: DEEPSYQ three appearance themes — stage exact assets without activating
on:
  push:
    branches: [deepsyq-platform]
    paths: ['.github/workflows/deepsyq-owner-themes-assets.yml']
permissions:
  contents: read
concurrency:
  group: deepsyq-owner-appearance-assets-stage
  cancel-in-progress: false
jobs:
  stage-owner-approved-theme-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Guard exact production branch and Christmas visual syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = deepsyq-platform
          node --check app/src/main/assets/deepsyq-theme-loader.js
          node --check app/src/main/assets/deepsyq-christmas.js
          node --check app/src/main/assets/deepsyq-christmas-v2.js
          node --check app/src/main/assets/deepsyq-christmas-v4.js
      - name: Prepare exact owner-supplied Christmas artwork and verified white-snow texture
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir "Pillow==11.3.0" "requests==2.32.3" "blake3==1.0.8"
          mkdir -p app/src/main/assets/media/christmas
          curl --fail --location --silent --show-error --retry 3 --max-time 90 \
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3DohHzQ92OwE6TBQr5M2fYm2CwS/56119c17-2a7f-49f2-968c-67df039d2c36.png' \
            -o /tmp/christmas-owner-source.png
          python - <<'PY'
          from PIL import Image,ImageOps
          from pathlib import Path
          import hashlib
          source=Path('/tmp/christmas-owner-source.png')
          digest=hashlib.sha256(source.read_bytes()).hexdigest()
          assert digest=='ff491e142b96f056afc3e2ff3d56016b70a1928ea96035743dedaefb9672bc7a','Owner image SHA mismatch'
          with Image.open(source) as image:
              image.load()
              assert image.width>=900 and image.height>=1600
              original=image.convert('RGB')
          folder=Path('app/src/main/assets/media/christmas')
          original.resize((1412,2508),Image.Resampling.LANCZOS).save(folder/'christmas-portrait.webp','WEBP',quality=92,method=6)
          w,h=original.size
          snow=original.crop((0,round(h*.925),w,h))
          snow=ImageOps.autocontrast(snow,cutoff=1)
          snow=Image.blend(snow,Image.new('RGB',snow.size,(250,253,255)),.32)
          snow.resize((1536,220),Image.Resampling.LANCZOS).save(folder/'snowbank-texture.webp','WEBP',quality=91,method=6)
          for name,size in [('christmas-portrait.webp',(1412,2508)),('snowbank-texture.webp',(1536,220))]:
              with Image.open(folder/name) as test:
                  test.verify()
              with Image.open(folder/name) as test:
                  assert test.size==size
              assert (folder/name).stat().st_size>20_000
              print('PRODUCTION_THEME_ART_VERIFIED',name,size,(folder/name).stat().st_size)
          print('OWNER_PHOTO_SHA256',digest)
          PY
      - name: Inspect official read-only Worker content export, no changes
        shell: bash
        run: |
          python - <<'PY'
          import os,requests
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN']}
          api='https://api.cloudflare.com/client/v4/accounts/'+account
          p=requests.get(api+'/pages/projects/deepsyq',headers=headers,timeout=18)
          p.raise_for_status()
          worker=p.json()['result']['production_script_name']
          assert worker.startswith('pages-worker--')
          for suffix in ['', '/content/v2']:
              url=api+'/workers/scripts/'+worker+suffix
              try:
                  r=requests.get(url,headers=headers,timeout=18)
                  mime=r.headers.get('content-type','')
                  print('THEME_WORKER_CONTENT_READ_ONLY',suffix or '/raw',r.status_code,mime[:90],len(r.content))
              except requests.RequestException as e:
                  print('THEME_WORKER_CONTENT_READ_ONLY',suffix or '/raw',type(e).__name__)
          PY
      - name: Publish only the eleven inactive theme assets, preserving LIVE Worker and other files
        shell: bash
        run: |
          set -euo pipefail
          python scripts/deepsyq_surgical_publish.py \
            --mode publish \
            --files 'deepsyq-theme-loader.js,deepsyq-theme-styles.css,deepsyq-christmas.css,deepsyq-christmas.js,deepsyq-christmas-v2.css,deepsyq-christmas-v2.js,deepsyq-christmas-v3.css,deepsyq-christmas-v4.css,deepsyq-christmas-v4.js,media/christmas/christmas-portrait.webp,media/christmas/snowbank-texture.webp' \
            --commit "$GITHUB_SHA"
      - name: Verify inactive theme files are served
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --max-time 20 "https://deepsyq.app/deepsyq-theme-loader.js?release=$GITHUB_SHA" >/dev/null
          curl -fsS --retry 3 --max-time 20 "https://deepsyq.app/deepsyq-theme-styles.css?release=$GITHUB_SHA" >/dev/null
          curl -fsS --retry 3 --max-time 20 "https://deepsyq.app/media/christmas/christmas-portrait.webp?release=$GITHUB_SHA" >/dev/null
          curl -fsS --retry 3 --max-time 20 "https://deepsyq.app/api/config" >/dev/null
          echo 'STAGED_THEME_ASSETS_READY_ACCOUNT_UI_STILL_UNCHANGED'

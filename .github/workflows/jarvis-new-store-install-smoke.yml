name: JARVIX NEW Store MSIX ephemeral Windows installation test

on:
  push:
    branches: [jarvis-new]
    paths:
      - '.github/workflows/jarvis-new-store-install-smoke.yml'

permissions:
  contents: read

jobs:
  windows-install-check:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      STORE_NAME: Deepsyq.JarixbyDeepsyq
      STORE_PUBLISHER: CN=7B5BC7EE-DA65-44E2-8CAC-D02C7C2CA333
      STORE_DISPLAY: Deepsyq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only offline Python dependencies
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 imageio-ffmpeg==0.6.0 pyinstaller==6.16.0
      - name: Offline MSIX tests
        run: python -m unittest discover -s tests -p "test_jarvis_new_store_package.py" -v
      - name: Create original owner sphere icon
        run: python scripts/build_jarvix_new_icons.py
      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name JARVIX_NEW --collect-all imageio_ffmpeg --icon build/jarvix-new-icon/jarvix-new.ico --version-file scripts/jarvix_new_version_info.txt --add-data "build/jarvix-new-icon/jarvix-new.png:." jarvis_new/desktop_entry.py
      - name: Create UNSIGNED test MSIX with exact Partner Center package identity
        shell: pwsh
        run: |
          python scripts/jarvix_new_store_package.py --name "$env:STORE_NAME" --publisher "$env:STORE_PUBLISHER" --publisher-display "$env:STORE_DISPLAY"
          if($LASTEXITCODE -ne 0){throw 'MSIX compilation failed'}
          python scripts/verify_jarvix_new_msix.py dist/JARVIX_NEW-STORE-UNSIGNED.msix --name "$env:STORE_NAME" --publisher "$env:STORE_PUBLISHER" --publisher-display "$env:STORE_DISPLAY"
          if($LASTEXITCODE -ne 0){throw 'MSIX verification failed'}
      - name: Temporarily sign and test package installation on this disposable GitHub runner ONLY
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $manifestPublisher=$env:STORE_PUBLISHER
          $certificate=$null
          $added=$null
          $trustedRoot=$null
          $trustedMachine=$null
          $package=$null
          try {
            # Development ONLY: not trusted by user PCs and never published.
            $certificate=New-SelfSignedCertificate -Type CodeSigningCert -Subject $manifestPublisher -CertStoreLocation 'Cert:\CurrentUser\My' -NotAfter (Get-Date).AddDays(1)
            if(-not $certificate) {throw 'Cannot create isolated CI development certificate'}
            $publicCert=Join-Path $env:RUNNER_TEMP 'jarvix-new-ci-only.cer'
            Export-Certificate -Cert $certificate -FilePath $publicCert | Out-Null
            # Temporary trust ONLY inside disposable GitHub-hosted Windows VM.
            # MSIX package deployment validates a trusted ROOT chain, not
            # simply the CurrentUser TrustedPeople leaf certificate.
            # App Installer checks machine-level TrustedPeople, not CurrentUser. CI-only runner.
            $added=Import-Certificate -FilePath $publicCert -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople'
            if(-not $added -or -not $added.Thumbprint) {throw 'Temporary dev certificate not trusted on CI machine'}
            $trustedRoot=Import-Certificate -FilePath $publicCert -CertStoreLocation 'Cert:\LocalMachine\Root'
            $trustedMachine=Import-Certificate -FilePath $publicCert -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople'
            $sdkBase=Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
            $tools=Get-ChildItem -Path $sdkBase -Filter 'signtool.exe' -Recurse -File | Where-Object { $_.FullName -match '\\x64\\signtool.exe$' }
            $signtool=($tools | Sort-Object FullName -Descending | Select-Object -First 1).FullName
            if(-not $signtool) {throw 'SignTool.exe not available on hosted Windows runner'}
            $msix='dist\JARVIX_NEW-STORE-UNSIGNED.msix'
            & $signtool sign /fd SHA256 /sha1 $certificate.Thumbprint /s My $msix
            if($LASTEXITCODE -ne 0) {throw 'Temporary development-only signature failed'}
            # MSIX is installed only into this ephemeral CI user scope.
            Add-AppxPackage -Path $msix -ErrorAction Stop
            $package=Get-AppxPackage -Name $env:STORE_NAME
            if(-not $package) {throw 'MSIX installation succeeded but package identity is missing'}
            if($package.Publisher -ne $manifestPublisher) {throw 'Installed package Publisher mismatch'}
            Write-Host 'PASS: JARVIX NEW test MSIX installed with expected registered identity on disposable Windows runner.'
          } finally {
            if($package) {
              Remove-AppxPackage -Package $package.PackageFullName -ErrorAction SilentlyContinue
            }
            if($trustedMachine -and $trustedMachine.Thumbprint) {
              Remove-Item ("Cert:\LocalMachine\TrustedPeople\"+$trustedMachine.Thumbprint) -Force -ErrorAction SilentlyContinue
            }
            if($trustedRoot -and $trustedRoot.Thumbprint) {
              Remove-Item ("Cert:\LocalMachine\Root\"+$trustedRoot.Thumbprint) -Force -ErrorAction SilentlyContinue
            }
            if($added -and $added.Thumbprint) {
              Remove-Item ("Cert:\LocalMachine\TrustedPeople\"+$added.Thumbprint) -Force -ErrorAction SilentlyContinue
            }
            if($certificate) {
              Remove-Item ("Cert:\CurrentUser\My\"+$certificate.Thumbprint) -Force -ErrorAction SilentlyContinue
            }
          }
      - name: Explicitly no test-signed binary is uploaded anywhere
        run: echo "Ephemeral CI test only; no deploy, no artifact, no signed file distributed."

name: Owner JARVIX first-visit visibility - no-spend Cloudflare TEST
on:
  push:
    branches:
      - owner-jarvix-visible-default-20261109
      - fix/jarvix-mobile-settings-close-20261109
    paths:
      - app/src/main/assets/jarvix-activity-drawer.js
      - app/src/main/assets/home-studio-settings.js
      - app/src/main/assets/jarvix-chat.css
      - tests/jarvix-activity-drawer.browser.test.mjs
      - tests/jarvix-activity-preview-smoke.mjs
      - .github/workflows/owner-jarvix-first-visit.yml
permissions:
  contents: read
jobs:
  verify-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      AI_BILLING_MODE: test
      PRODUCT_WATCHER_ENABLED: 'false'
      PREVIEW_BRANCH: ${{ github.ref_name == 'fix/jarvix-mobile-settings-close-20261109' && 'owner-jarvix-settings-x-20261109' || 'owner-jarvix-visible-default-20261109' }}
      OPENAI_API_KEY: ''
      STRIPE_SECRET_KEY: ''
      DATABASE_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify local first visit, existing history and no paid calls
        run: node --test tests/jarvix-activity-drawer.browser.test.mjs
      - name: Guard Cloudflare credentials and production branch; deploy separate preview only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/deepsyq" \
            -o /tmp/cf-project.json
          node --input-type=module -e 'import fs from "node:fs";const x=JSON.parse(fs.readFileSync("/tmp/cf-project.json","utf8"));if(!x.success||x.result?.production_branch!=="deepsyq-platform")throw Error("Unsafe production branch mismatch");'
          npx --yes wrangler@4 pages deploy app/src/main/assets \
            --project-name=deepsyq \
            --branch="$PREVIEW_BRANCH" \
            --commit-hash="${{ github.sha }}" | tee /tmp/jarvix-test-deploy.log
          DEPLOY_URL="$(grep -Eo 'https://[a-z0-9-]+\.deepsyq\.pages\.dev' /tmp/jarvix-test-deploy.log | head -n1)"
          if [[ ! "$DEPLOY_URL" =~ ^https://[a-z0-9-]+\.deepsyq\.pages\.dev$ ]]; then exit 1; fi
          echo "JARVIX_TEST_PREVIEW_URL=$DEPLOY_URL" >> "$GITHUB_ENV"
      - name: Verify actual TEST UI visible without clicking at first visit
        run: node tests/jarvix-activity-preview-smoke.mjs
      - name: Verify real JARVIX mobile Settings X is above creation type and closes correctly
        if: github.ref_name == 'fix/jarvix-mobile-settings-close-20261109'
        run: |
          mkdir -p artifacts/jarvix-live-preview
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright';
          const origin=process.env.JARVIX_TEST_PREVIEW_URL;
          assert.match(origin,/^https:\/\/[a-z0-9-]+\.deepsyq\.pages\.dev$/);
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          try{
            const context=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const page=await context.newPage();
            const response=await page.goto(origin+'/jarvix-chat.html',{waitUntil:'domcontentloaded',timeout:30000});
            assert.equal(response.status(),200,'JARVIX Chat should load on TEST');
            const gear=page.locator('#jChatForm .j-settings-shortcut');
            await gear.waitFor({state:'visible',timeout:15000});
            await gear.click();
            const frame=page.frameLocator('#homeStudioSettingsFrame');
            const dialog=frame.locator('#studioSettingsHub');
            await dialog.waitFor({state:'visible',timeout:20000});
            const rect=await dialog.evaluate(el=>{
              const x=el.querySelector(':scope > button:nth-child(2)')?.getBoundingClientRect();
              const first=el.querySelector('#studioTypePicker')?.getBoundingClientRect();
              const heading=el.querySelector(':scope > h2')?.getBoundingClientRect();
              return {x:x&&{top:x.top,bottom:x.bottom,left:x.left,right:x.right},first:first&&{top:first.top,bottom:first.bottom},heading:heading&&{top:heading.top,bottom:heading.bottom}};
            });
            console.log('JARVIX_MOBILE_SETTINGS_RECT',JSON.stringify({url:page.url(),rect}));
            console.log('JARVIX_MOBILE_SETTINGS_DIAG',JSON.stringify(await page.evaluate(()=>{
              const host=document.getElementById('homeStudioSettingsHost');
              const documentInFrame=document.getElementById('homeStudioSettingsFrame')?.contentDocument;
              const button=documentInFrame?.querySelector('#studioSettingsHub > button:nth-child(2)');
              return {path:location.pathname,composerPresent:!!document.getElementById('jChatForm'),hostVisible:host?.style.visibility,hasSpecialCss:documentInFrame?.getElementById('homeNativeStudioSettingsPresentation')?.textContent.includes('grid-template-columns')||false,buttonStyle:button?.getAttribute('style'),computedTransform:button&&getComputedStyle(button).transform};
            })));
            await page.screenshot({path:'artifacts/jarvix-live-preview/mobile-jarvix-settings-x.png'});
            assert(rect.x&&rect.first&&rect.heading,'native Settings controls are present');
            assert(rect.x.bottom<=rect.first.top-3,'Mobile Settings X overlaps creation row');
            assert(rect.x.top>=0,'Mobile Settings X is offscreen');
            console.log('JARVIX_MOBILE_SETTINGS_X_PASS',JSON.stringify({url:page.url(),rect}));
            await frame.locator('#studioSettingsHub > button:nth-child(2)').click();
            await page.waitForFunction(()=>document.querySelector('#homeStudioSettingsHost')?.style.display==='none',null,{timeout:8000});
            console.log('JARVIX_MOBILE_SETTINGS_CLOSE_PASS');
            await context.close();
          }finally{await browser.close()}
          JS
      - name: Save real first-visit desktop/mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvix-first-visit-evidence
          path: artifacts/jarvix-live-preview/*.png
          retention-days: 7
          if-no-files-found: ignore

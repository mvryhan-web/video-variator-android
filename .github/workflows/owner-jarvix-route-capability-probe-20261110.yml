name: Owner JARVIX surgical overlay capability check (read only)
on:
  push:
    branches: [deepsyq-platform]
    paths: ['.github/workflows/owner-jarvix-route-capability-probe-20261110.yml']
permissions:
  contents: read
jobs:
  cloudflare-routes-read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check if a four-file route-only overlay is authorized; do not mutate anything
        run: |
          node --input-type=module <<'JS'
          const token=process.env.CF_API_TOKEN,account=process.env.CF_ACCOUNT_ID;
          if(!token||!account)throw Error('Cloudflare connection absent');
          const h={Authorization:'Bearer '+token},api='https://api.cloudflare.com/client/v4';
          async function probe(label,url){
            try {
              const response=await fetch(url,{headers:h,signal:AbortSignal.timeout(14000)});
              const result=await response.json().catch(()=>({}));
              const summary={label,status:response.status,ok:response.ok,cloudflareSuccess:result.success===true};
              if(label==='zones' && response.ok && result.success){
                const zones=Array.isArray(result.result)?result.result:[];
                summary.zoneCount=zones.length;
                const zone=zones.find(z=>z.name==='deepsyq.app');
                if(zone){
                  console.log('CLOUDFLARE_ROUTE_PROBE',JSON.stringify(summary));
                  await probe('routes',api+'/zones/'+encodeURIComponent(zone.id)+'/workers/routes');
                  return;
                }
              }
              if(label==='routes'&&response.ok&&result.success){
                summary.routeCount=Array.isArray(result.result)?result.result.length:null;
                summary.existingJarvixRoutes=(result.result||[]).filter(x=>/jarvix|deepsyq/i.test(x.pattern||'')).length;
              }
              summary.errorCodes=(result.errors||[]).map(x=>x.code);
              console.log('CLOUDFLARE_ROUTE_PROBE',JSON.stringify(summary));
            }catch(error){console.log('CLOUDFLARE_ROUTE_PROBE',JSON.stringify({label,error:String(error).slice(0,150)}));}
          }
          await probe('zones',api+'/zones?name=deepsyq.app');
          await probe('workers',api+'/accounts/'+account+'/workers/scripts');
          console.log('NO_CHANGES_MADE',true);
          JS

name: OWNER Canvas exact latest-live single-paragraph production release
on:
  push:
    branches: [owner-canvas-remove-description-20261110]
    paths: ['.github/workflows/owner-canvas-caption-release-20261110.yml']
permissions: {contents: read}
concurrency:
  group: owner-deepsyq-canvas-live-caption-20261110
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      NODE_ENV: test
      AI_BILLING_MODE: test
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify owner-approved one-file change and latest LIVE Worker
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/deepsyq-platform:refs/remotes/origin/deepsyq-platform
          node --check scripts/owner-canvas-live-caption-release-20261110.mjs
          node scripts/owner-canvas-live-caption-release-20261110.mjs prepare
          echo "TARGET_SHA=$(node -p "require('/tmp/deepsyq-owner-canvas-status.json').dev")" >> "$GITHUB_ENV"
      - name: Reconstruct latest LIVE assets and remove only Canvas description
        shell: bash
        run: |
          set -euo pipefail
          node scripts/owner-canvas-live-caption-release-20261110.mjs snapshot
      - name: Publish to reserve TEST only for safe validation
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy /tmp/deepsyq-owner-canvas-live/app/src/main/assets \
            --project-name=deepsyq --branch=test \
            --commit-hash="$TARGET_SHA" --commit-dirty=true \
            --commit-message="Canvas latest-live one paragraph deletion, all other assets and Worker unchanged"
      - name: Verify exact Canvas text removal, Worker, unaffected TEST pages
        shell: bash
        run: |
          set -euo pipefail
          node scripts/owner-canvas-live-caption-release-20261110.mjs preview
      - name: Fail if MAIN changed since live baseline was captured
        run: node scripts/owner-canvas-live-caption-release-20261110.mjs guard
      - name: Promote only exact Canvas caption removal to production
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          echo "MAIN_PROMOTION_ATTEMPTED=true" >> "$GITHUB_ENV"
          npx --yes wrangler@4 pages deploy /tmp/deepsyq-owner-canvas-live/app/src/main/assets \
            --project-name=deepsyq --branch=deepsyq-platform \
            --commit-hash="$TARGET_SHA" --commit-dirty=true \
            --commit-message="Owner-approved one paragraph removal from latest live Canvas, Worker preserved"
      - name: Verify live MAIN Canvas, protected pages and backend
        run: |
          set -euo pipefail
          node scripts/owner-canvas-live-caption-release-20261110.mjs main
          echo "MAIN_VERIFIED=true" >> "$GITHUB_ENV"
      - name: Roll back ONLY this just-attempted release on verification failure
        if: always() && env.MAIN_PROMOTION_ATTEMPTED == 'true' && env.MAIN_VERIFIED != 'true'
        run: node scripts/owner-canvas-live-caption-release-20261110.mjs rollback

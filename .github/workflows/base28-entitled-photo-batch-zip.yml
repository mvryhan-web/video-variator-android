name: BASE 28 entitled photo batch optional ZIP
on:
  pull_request:
    paths:
      - 'app/src/main/assets/free-tools.js'
      - 'app/src/main/assets/mobile-utility.js'
      - 'app/src/main/assets/audio-studio.js'
      - 'app/src/main/assets/photo-collage.js'
      - 'tests/base28-entitled-photo-batch-zip.spec.mjs'
      - 'tests/base28-utilities-original-requirement.spec.mjs'
      - '.github/workflows/base28-entitled-photo-batch-zip.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  batch-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --check app/src/main/assets/free-tools.js && node --check app/src/main/assets/mobile-utility.js && node --check app/src/main/assets/audio-studio.js && node --check app/src/main/assets/photo-collage.js && node --check tests/base28-entitled-photo-batch-zip.spec.mjs && node --check tests/base28-utilities-original-requirement.spec.mjs
      - run: npx playwright install --with-deps chromium webkit
      - name: Authorized photo batch local ZIP, denied access and free single photo
        run: npx playwright test tests/base28-entitled-photo-batch-zip.spec.mjs tests/base28-utilities-original-requirement.spec.mjs tests/photo-collage.spec.mjs --project=chromium --project=webkit --project=mobile-chromium --project=mobile-webkit
      - name: Existing entitled batch processing contract
        run: npx playwright test tests/free-tools.spec.mjs --grep 'batch photos are local' --project=chromium --project=webkit

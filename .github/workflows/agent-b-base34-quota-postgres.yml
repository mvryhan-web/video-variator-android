name: Agent B BASE34 real PostgreSQL quota concurrency (zero spend)
on:
  pull_request:
    branches: [deepsyq-platform]
    paths:
      - 'server/generation-policy.js'
      - 'tests/agent-b-base34-quota-postgres.mjs'
      - '.github/workflows/agent-b-base34-quota-postgres.yml'
permissions:
  contents: read
jobs:
  quota-pg:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deepsyq_purchased_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d deepsyq_purchased_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      P0_PURCHASED_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/deepsyq_purchased_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify source syntax
        run: |
          node --check server/generation-policy.js
          node --check tests/agent-b-base34-quota-postgres.mjs
      - name: Real PostgreSQL16 transaction and user-quota acceptance (no skips)
        run: node --test tests/agent-b-base34-quota-postgres.mjs

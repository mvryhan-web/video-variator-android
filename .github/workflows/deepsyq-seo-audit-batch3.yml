name: DEEPSYQ SEO audit batch 3 - Photo Collage only
on:
  push:
    branches: [deepsyq-platform]
    paths:
      - '.github/workflows/deepsyq-seo-audit-batch3.yml'
      - 'app/src/main/assets/photo-collage.html'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deepsyq-surgical-pages-release
  cancel-in-progress: false
jobs:
  photo-collage-meta:
    if: >-
      github.ref == 'refs/heads/deepsyq-platform' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.head_commit.message == 'release(DEEPSYQ SEO): publish Photo Collage only')
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify uploader and Photo Collage page metadata
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/deepsyq_surgical_publish.py
          python -m unittest discover -s tests -p 'test_deepsyq_surgical_publish.py' -v
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from importlib.util import spec_from_file_location,module_from_spec
          spec=spec_from_file_location('surgical','scripts/deepsyq_surgical_publish.py')
          mod=module_from_spec(spec);spec.loader.exec_module(mod)
          assert mod.allowed_hash_reuse(['photo-collage.html'])
          assert not mod.allowed_hash_reuse(['photo-collage.html','jarvix.html'])
          class Tags(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.meta={}
                  self.canonical=[]
                  self.headings=[]
              def handle_starttag(self,name,attrs):
                  d=dict(attrs)
                  if name=='meta':
                      key=d.get('property') or d.get('name')
                      if key:self.meta.setdefault(key,[]).append(d.get('content',''))
                  if name=='link' and d.get('rel')=='canonical': self.canonical.append(d.get('href'))
                  if name=='h1':self.headings.append('h1')
          source=Path('app/src/main/assets/photo-collage.html').read_text(encoding='utf8')
          c=Tags();c.feed(source)
          assert c.canonical==['https://deepsyq.app/photo-collage.html'],c.canonical
          assert len(c.headings)==1,c.headings
          for key in ('description','og:title','og:description','og:type','og:url','twitter:card'):
              assert len(c.meta.get(key,[]))==1,(key,c.meta.get(key))
          assert c.meta['og:url'][0]==c.canonical[0]
          assert c.meta['og:type'][0]=='website'
          assert c.meta['twitter:card'][0]=='summary'
          assert '<script type="application/ld+json">' in source
          print('SEO_AUDIT_BATCH_3_METADATA_PASS')
          PY
      - name: Install uploader dependencies
        run: python -m pip install --disable-pip-version-check "requests==2.32.3" "blake3==1.0.8"
      - name: Publish ONLY Photo Collage and verify unchanged production Worker
        run: |
          python scripts/deepsyq_surgical_publish.py \
            --mode publish \
            --files photo-collage.html \
            --commit "$GITHUB_SHA"

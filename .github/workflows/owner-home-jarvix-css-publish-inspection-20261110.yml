name: Owner mobile Home JARVIX CSS production status (read only)
on:
  push:
    branches: [deepsyq-platform]
    paths:
      - '.github/workflows/owner-home-jarvix-css-publish-inspection-20261110.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Inspect created deployment and live CSS, read only
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {createHash} from 'node:crypto';
          const project='https://api.cloudflare.com/client/v4/accounts/'+process.env.CF_ACCOUNT+'/pages/projects/deepsyq';
          const headers={Authorization:'Bearer '+process.env.CF_TOKEN};
          async function api(url){
            try{const r=await fetch(url,{headers,signal:AbortSignal.timeout(15000)});const j=await r.json().catch(()=>({}));return {http:r.status,data:j.result,errors:(j.errors||[]).map(e=>e.code)}}
            catch(e){return {error:String(e).slice(0,150)}}
          }
          const p=await api(project);
          const current=p.data?.canonical_deployment?.id;
          const currentInfo=await api(project+'/deployments/'+current);
          const id='69867c75-7476-4599-b0df-f88159c3d591';
          const created=await api(project+'/deployments/'+id);
          const existingHash=currentInfo.data?.files?.['/deepsyq.css']||currentInfo.data?.files?.['deepsyq.css'];
          const createdHash=created.data?.files?.['/deepsyq.css']||created.data?.files?.['deepsyq.css'];
          console.log('JARVIX_CSS_RELEASE_STATUS',JSON.stringify({
            canonicalId:current,canonicalIsCreated:current===id,canonicalCssHash:existingHash,
            canonicalWorker:currentInfo.data?.uses_functions,
            createdId:created.data?.id,createdState:created.data?.latest_stage?.status,
            createdSuccess:created.data?.latest_stage?.name,
            createdCssHash:createdHash,createdUsesFunctions:created.data?.uses_functions,
            createdEnvironment:created.data?.environment,createdAliases:created.data?.aliases?.length,
            createdErrors:created.errors,currentErrors:currentInfo.errors
          }));
          try{
            const r=await fetch('https://deepsyq.app/deepsyq.css?mobile_jarvix_20261110='+Date.now(),{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(15000)});
            const body=await r.text();
            const needle='.home-spotlight-agent>.home-spotlight-jarvix-mark';
            const pos=body.lastIndexOf(needle);
            console.log('JARVIX_CSS_PUBLIC_STATUS',JSON.stringify({http:r.status,containsLeftAlignment:body.includes('align-items:center;justify-content:flex-start!important;gap:10px;'),size:body.length,selectorCount:body.split(needle).length-1,selectorExcerpt:pos>=0?body.slice(pos,pos+310):null}))
          }catch(e){console.log('JARVIX_CSS_PUBLIC_STATUS',JSON.stringify({error:String(e).slice(0,120)}))}
          const log=await api(project+'/deployments/'+id+'/history/logs');
          const entries=log.data?.data||[];
          console.log('JARVIX_FAILED_DEPLOYMENT_LOG',JSON.stringify({http:log.http,lines:entries.length,errors:entries.filter(x=>/fail|error|worker|invalid|unknown|HTTP 4|HTTP 5|route|file/i.test(x.line||'')).slice(-12).map(x=>String(x.line||'').slice(0,260))}));
          console.log('READ_ONLY_NO_CHANGES',true);
          JS

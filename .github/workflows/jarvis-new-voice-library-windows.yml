name: JARVIX NEW portable Voice Library Windows TEST
on:
  push:
    branches: [jarvis-new]
    paths:
      - 'jarvis_new/voice_library_desktop.py'
      - 'tests/test_jarvix_voice_library_desktop.py'
      - '.github/workflows/jarvis-new-voice-library-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-voice-library:
    if: github.ref == 'refs/heads/jarvis-new'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm exactly 552 physically stored audio files
        shell: pwsh
        run: |
          $files=@(Get-ChildItem 'app/src/main/assets/media/jarvix' -Recurse -File -Filter '*.mp3')
          if ($files.Count -ne 552) { throw "Expected 552 MP3 but found $($files.Count)" }
          $manifest='app/src/main/assets/media/jarvix/tour-v3/manifest.json'
          if (-not (Test-Path $manifest)) { throw 'Missing existing Tour V3 text manifest' }
          Write-Host "Verified 552 owner-provided MP3, no synthesis"
      - name: Run read-only voice-library unit tests
        run: python -m unittest discover -s tests -p 'test_jarvix_voice_library_desktop.py' -v
      - name: Install Windows binary packaging tool
        run: python -m pip install --disable-pip-version-check pyinstaller==6.16.0
      - name: Build the standalone tkinter application containing all 552 MP3
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name JARVIX_Voice_Library --add-data "app/src/main/assets/media/jarvix;media/jarvix" jarvis_new/voice_library_desktop.py
      - name: Verify contents and create portable ZIP for manual TEST
        shell: pwsh
        run: |
          $exe='dist/JARVIX_Voice_Library/JARVIX_Voice_Library.exe'
          if (-not (Test-Path $exe)) { throw 'Windows EXE build missing' }
          $audio=@(Get-ChildItem 'dist/JARVIX_Voice_Library' -Recurse -File -Filter '*.mp3')
          if ($audio.Count -ne 552) { throw "Packaged MP3 mismatch: $($audio.Count)" }
          $s=Get-AuthenticodeSignature $exe
          Write-Host "Windows test binary signature status: $($s.Status)"
          if ($s.Status -eq 'Valid') { throw 'Unexpected signature: investigate build provenance' }
          New-Item -ItemType Directory -Force 'release' | Out-Null
          Compress-Archive -Path 'dist/JARVIX_Voice_Library' -DestinationPath 'release/JARVIX_Voice_Library_552_Windows_Portable_TEST.zip' -CompressionLevel Optimal
          if (-not (Test-Path 'release/JARVIX_Voice_Library_552_Windows_Portable_TEST.zip')) { throw 'ZIP missing' }
          Get-FileHash 'release/JARVIX_Voice_Library_552_Windows_Portable_TEST.zip' -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIX-Voice-Library-552-Windows-TEST-Unsigned
          path: release/JARVIX_Voice_Library_552_Windows_Portable_TEST.zip
          if-no-files-found: error
          retention-days: 14

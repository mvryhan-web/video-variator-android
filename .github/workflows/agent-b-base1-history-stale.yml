name: Agent B BASE1 History cross-account epoch (no spend)
on:
  pull_request:
    paths:
      - 'app/src/main/assets/generate-studio.js'
      - 'tests/agent-b-base1-history-stale-account.spec.mjs'
      - '.github/workflows/agent-b-base1-history-stale.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  history-epoch-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --check app/src/main/assets/generate-studio.js && node --check tests/agent-b-base1-history-stale-account.spec.mjs
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test tests/agent-b-base1-history-stale-account.spec.mjs --project=chromium --project=webkit --workers=2

name: Agent C BASE1-C7 Inspiration owner hover no spend
on:
  pull_request:
    branches: [deepsyq-platform]
    paths:
      - app/src/main/assets/inspiration.css
      - tests/agent-c-base1-inspiration-hover.spec.mjs
      - .github/workflows/agent-c-base1-inspiration-hover.yml
  workflow_dispatch:

jobs:
  inspiration-c7-browser-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Restore locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Responsive computed hover, screenshots, and no-paid-POST checks
        run: npx playwright test tests/agent-c-base1-inspiration-hover.spec.mjs --project=chromium --project=firefox --project=webkit --project=mobile-webkit --project=mobile-chromium
      - name: Preserve viewport screenshots and failed traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-c-c7-inspiration-hover-browser-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

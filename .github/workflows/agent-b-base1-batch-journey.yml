name: Agent B BASE1 real batch-entry no-spend verification
on:
  pull_request:
    paths:
      - 'app/src/main/assets/generate-studio.js'
      - 'tests/agent-b-base1-real-batch-dispatch-unit.mjs'
      - '.github/workflows/agent-b-base1-batch-journey.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-batch-path:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app/src/main/assets/generate-studio.js && node --check tests/agent-b-base1-real-batch-dispatch-unit.mjs
      - run: node --test tests/agent-b-base1-real-batch-dispatch-unit.mjs tests/agent-d-base1-price-confirmation-unit.mjs

name: BASE 49 concurrent AI migrations

concurrency:
  group: ci-base49-migration-concurrency-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [base49-serialize-ai-migrations-20261016]
    paths:
      - 'server/ai-migrations.js'
      - 'tests/base49-ai-migration-concurrency-postgres.mjs'
      - '.github/workflows/base49-migration-concurrency.yml'
  pull_request:
    branches: [deepsyq-platform]
    paths:
      - 'server/ai-migrations.js'
      - 'tests/base49-ai-migration-concurrency-postgres.mjs'
      - '.github/workflows/base49-migration-concurrency.yml'
permissions:
  contents: read
jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: vv_ai_migration_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Check migration JS syntax
        run: |
          node --check server/ai-migrations.js
          node --check tests/base49-ai-migration-concurrency-postgres.mjs
      - name: Concurrent two-runner migration integration on disposable PostgreSQL 16
        run: node --test tests/ai-migrations-unit.mjs tests/base49-ai-migration-concurrency-postgres.mjs
        env:
          NODE_ENV: test
          AI_TEST_DATABASE_URL: postgres://fixture:fixture@127.0.0.1:5432/vv_ai_migration_ci

name: Owner chat rail isolated Cloudflare TEST preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'app/src/main/assets/jarvix-composer-design.js'
      - 'tests/jarvix-bottom-dock.test.mjs'
      - 'tests/jarvix-universal-hub.test.mjs'
      - 'tests/jarvix-universal-hub.browser.test.mjs'
      - 'tests/studio-universal-dock.browser.test.mjs'
      - '.github/workflows/owner-chat-rail-test-preview.yml'

permissions:
  contents: read

concurrency:
  group: owner-chat-rail-test-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish-preview:
    if: github.event.pull_request.number == 644 && github.head_ref == 'owner-remove-uniquifier-chat-rail-20261108' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_BRANCH: owner-remove-uniquifier-chat-rail-20261108
      NODE_ENV: test
      AI_BILLING_MODE: test
      PRODUCT_WATCHER_ENABLED: 'false'
      OPENAI_API_KEY: ''
      STRIPE_SECRET_KEY: ''
      DATABASE_URL: ''
    steps:
      - name: Checkout exact reviewed PR commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Refuse deployment from outdated DEV
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/deepsyq-platform:refs/remotes/origin/deepsyq-platform
          git merge-base --is-ancestor refs/remotes/origin/deepsyq-platform HEAD
          echo "Preview candidate contains current accepted DEV; MAIN is untouched."
      - name: Install existing dependencies only
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify surgical shared composer and Unit tests
        run: |
          set -euo pipefail
          node --check app/src/main/assets/jarvix-composer-design.js
          node --test tests/jarvix-bottom-dock.test.mjs tests/jarvix-universal-hub.test.mjs
      - name: Install Chromium for isolated no-spend browser tests
        run: npx playwright install --with-deps chromium
      - name: Verify Home, JARVIX, Studio unchanged except chat link
        run: |
          node --test tests/jarvix-universal-hub.browser.test.mjs
          node --test --test-name-pattern='Single Universal Hub Studio|Home gear opens previous existing Studio settings' tests/studio-universal-dock.browser.test.mjs
      - name: Preflight Cloudflare project PRODUCTION guard and store canonical deployment ID
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::GitHub Actions Cloudflare secrets unavailable; nothing deployed'
            exit 1
          fi
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/deepsyq" \
            > /tmp/owner-chat-rail-pages-before.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const o=JSON.parse(fs.readFileSync('/tmp/owner-chat-rail-pages-before.json','utf8'));
          if(o.success!==true || o.result?.name!=='deepsyq' || o.result?.production_branch!=='deepsyq-platform' ||
             o.result?.production_branch===process.env.PREVIEW_BRANCH || !o.result?.canonical_deployment?.id) {
             throw Error('Cloudflare production guard failed; refusing publish');
          }
          fs.appendFileSync(process.env.GITHUB_ENV,'MAIN_DEPLOYMENT_BEFORE='+o.result.canonical_deployment.id+'\n');
          console.log('Cloudflare Pages project and distinct production/TEST branches verified.');
          JS
      - name: Publish this exact reviewed commit ONLY as isolated Cloudflare TEST branch preview
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy app/src/main/assets \
            --project-name=deepsyq \
            --branch="$PREVIEW_BRANCH" \
            --commit-hash="${{ github.event.pull_request.head.sha }}" | tee /tmp/owner-chat-rail-pages-deploy.log
          DEPLOY_URL=$(grep -Eo 'https://[a-z0-9-]+\.deepsyq\.pages\.dev' /tmp/owner-chat-rail-pages-deploy.log | head -n1)
          if [[ ! "$DEPLOY_URL" =~ ^https://[a-z0-9-]+\.deepsyq\.pages\.dev$ ]]; then
            echo '::error::Cannot verify isolated Cloudflare Pages Preview URL'
            exit 1
          fi
          echo "CHAT_RAIL_TEST_URL=$DEPLOY_URL" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_PREVIEW_URL=$DEPLOY_URL"
      - name: Verify LIVE preview across desktop/mobile Home Chat Image Video Audio
        run: |
          mkdir -p artifacts/chat-rail-preview
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright';
          const origin=process.env.CHAT_RAIL_TEST_URL;
          assert.match(origin,/^https:\/\/[a-z0-9-]+\.deepsyq\.pages\.dev$/);
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          try{
            const testRoutes=[
              ['home','deepsyq.html','#homeQuickBar .j-mode-rail'],
              ['jarvix','jarvix-chat.html','.j-chat-bottom .j-mode-rail'],
              ['image','generate-studio.html?studio=image','#studioUniversalDock .j-mode-rail'],
              ['video','generate-studio.html?studio=video','#studioUniversalDock .j-mode-rail'],
              ['audio','generate-studio.html?studio=audio','#studioUniversalDock .j-mode-rail']
            ];
            for(const [device,viewport] of [['desktop',{width:1365,height:900}],['mobile',{width:390,height:844}]]){
              const context=await browser.newContext({viewport,isMobile:device==='mobile',hasTouch:device==='mobile'});
              try{
                const page=await context.newPage();
                for(const [name,route,rail] of testRoutes){
                  const res=await page.goto(origin+'/'+route,{waitUntil:'domcontentloaded',timeout:30000});
                  assert.equal(res?.status(),200,device+': '+route);
                  await page.locator(rail).waitFor({state:'attached',timeout:16000});
                  assert.equal(await page.locator(rail+' a[href="index.html"]').count(),0,device+': '+name+' must not have Video Uniquifier chat button');
                  assert.equal(await page.locator(rail+' a').count(),1,device+': '+name+' expected one JARVIX chat rail entry');
                  if(name==='home'||name==='jarvix'||name==='image'){
                    await page.screenshot({path:'artifacts/chat-rail-preview/'+device+'-'+name+'.png',fullPage:false});
                  }
                  console.log('CHAT_RAIL_PREVIEW_PASS',JSON.stringify({device,name,path:new URL(page.url()).pathname,railLinks:1,videoUniquifierLinks:0}));
                }
              }finally{await context.close();}
            }
            const res=await fetch(origin+'/index.html',{signal:AbortSignal.timeout(15000)});
            assert.equal(res.status,200,'Standalone Video Uniquifier must still exist');
            console.log('STANDALONE_VIDEO_UNIQUIFIER_PRESENT',res.status);
          }finally{await browser.close();}
          JS
      - name: Prove canonical MAIN deployment ID and production branch did not change
        if: success()
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/deepsyq" \
            > /tmp/owner-chat-rail-pages-after.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const o=JSON.parse(fs.readFileSync('/tmp/owner-chat-rail-pages-after.json','utf8'));
          if(o.success!==true||o.result?.production_branch!=='deepsyq-platform'||
             o.result?.canonical_deployment?.id!==process.env.MAIN_DEPLOYMENT_BEFORE){
            throw Error('Cloudflare MAIN canonical deployment unexpectedly changed; immediate owner investigation required');
          }
          console.log('MAIN_UNCHANGED_VERIFIED',JSON.stringify({production_branch:o.result.production_branch,canonical_deployment_id_unchanged:true}));
          JS
      - name: Save real Cloudflare TEST screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-rail-cloudflare-preview-desktop-mobile
          path: artifacts/chat-rail-preview/*.png
          if-no-files-found: ignore
          retention-days: 7

name: Owner AI Apps preview module and active-template read-only audit
on:
  push:
    branches: [owner-ai-apps-main-guarded-release-20261110]
    paths: ['.github/workflows/owner-ai-apps-modules-audit-20261110.yml']
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check all dynamic JS module responses without modifying deployments
        run: |
          node --input-type=module <<'JS'
          for(const base of ['https://deepsyq.app','https://owner-aiapps-1110.deepsyq.pages.dev']){
            for(const name of ['ai-apps.html','ai-apps.js','ai-template-product-name.js','home-inspiration.js','api/templates','api/config']){
              const r=await fetch(base+'/'+name+'?v='+Date.now(),{headers:{'cache-control':'no-cache'},signal:AbortSignal.timeout(15000)});
              const text=await r.text();let details={};if(name==='api/templates'){try{const j=JSON.parse(text);details={count:j.items?.length,first:j.items?.[0]?.title,keys:Object.keys(j)}}catch{}}
              console.log('OWNER_AI_APPS_MODULE_AUDIT',JSON.stringify({base,name,status:r.status,type:r.headers.get('content-type'),length:text.length,head:text.slice(0,90),...details}));
            }
          }
          JS

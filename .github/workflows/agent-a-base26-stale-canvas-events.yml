name: Agent A33 BASE26 Canvas session privacy

on:
  pull_request:
    branches: [deepsyq-platform]
    paths:
      - 'app/src/main/assets/canvas-editor.js'
      - 'tests/agent-a-base26-stale-canvas-events.spec.mjs'
      - '.github/workflows/agent-a-base26-stale-canvas-events.yml'
  workflow_dispatch:

permissions: {contents: read}
concurrency:
  group: agent-a33-canvas-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  canvas-private-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      HOME: /root
      DATABASE_URL: ''
      STRIPE_SECRET_KEY: ''
      GOOGLE_API_KEY: ''
      GEMINI_API_KEY: ''
      BYTEPLUS_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --check app/src/main/assets/canvas-editor.js && node --check tests/agent-a-base26-stale-canvas-events.spec.mjs
      - name: Forty A33 stale Canvas account event cases in five real browsers
        run: npx playwright test tests/agent-a-base26-stale-canvas-events.spec.mjs --project=chromium --project=firefox --project=webkit --project=mobile-chromium --project=mobile-webkit --workers=2 --retries=0
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: agent-a33-canvas-privacy-failure
          path: test-results/
          retention-days: 7

name: Deepsyq platform regression
on:
  push:
    branches: [deepsyq-platform]
  pull_request:
    paths: ['app/src/main/assets/deepsyq*', 'tests/deepsyq*', '.github/workflows/deepsyq-platform.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: node --check app/src/main/assets/deepsyq.js && node --check server/server.js
      - run: node --test tests/deepsyq-routes.mjs tests/generation-studio-unit.mjs tests/generation-byteplus-unit.mjs tests/generation-billing-unit.mjs tests/generation-routing-unit.mjs tests/generation-policy-unit.mjs server/tests/telegram-free-mini.test.mjs
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test tests/deepsyq.spec.mjs tests/generation-studio.spec.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepsyq-browser-evidence
          path: test-results/

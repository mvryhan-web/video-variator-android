name: OWNER Canvas exact static-only diff preserving active Pages Worker
on:
  push:
    branches: [owner-canvas-workspace-20261110]
    paths: ['.github/workflows/owner-canvas-direct-worker-release-20261110.yml']
permissions: {contents: read}
concurrency:
  group: deepsyq-surgical-pages-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install verified Pages content hash checker
        run: python3 -m pip install --quiet blake3 --break-system-packages
      - name: Verify exact current production and stage only approved Canvas changes
        run: |
          set -euo pipefail
          node --check scripts/owner-canvas-direct-worker-release-20261110.mjs
          node --check app/src/main/assets/canvas-workspace.js
          node scripts/owner-canvas-direct-worker-release-20261110.mjs prepare
      - name: Upload only three updated Canvas assets and missing approved photos
        run: node scripts/owner-canvas-direct-worker-release-20261110.mjs upload
      - name: Bundle original production Worker from latest production commit
        run: node scripts/owner-canvas-direct-worker-release-20261110.mjs bundle
      - name: Publish isolated TEST with complete exact manifest plus original Worker
        run: node scripts/owner-canvas-direct-worker-release-20261110.mjs test
      - name: Verify TEST Worker, original assets, Canvas UI and API
        run: node scripts/owner-canvas-direct-worker-release-20261110.mjs test-verify
      - name: Promote the same scoped manifest to MAIN
        run: |
          set -euo pipefail
          echo "MAIN_PROMOTION_ATTEMPTED=true" >> "$GITHUB_ENV"
          node scripts/owner-canvas-direct-worker-release-20261110.mjs main
      - name: Verify MAIN complete manifest, Worker settings, billing API and Canvas UI
        run: |
          set -euo pipefail
          node scripts/owner-canvas-direct-worker-release-20261110.mjs main-verify
          echo "MAIN_VERIFIED=true" >> "$GITHUB_ENV"
      - name: Roll back ONLY our own failed MAIN deployment
        if: always() && env.MAIN_PROMOTION_ATTEMPTED == 'true' && env.MAIN_VERIFIED != 'true'
        run: node scripts/owner-canvas-direct-worker-release-20261110.mjs rollback

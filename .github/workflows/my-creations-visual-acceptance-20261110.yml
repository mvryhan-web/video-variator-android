name: My Creations responsive reference acceptance (no spend)
on:
  push:
    branches: [deepsyq-platform]
    paths:
      - 'app/src/main/assets/my-creations.html'
      - 'app/src/main/assets/my-creations-gallery.css'
      - 'app/src/main/assets/my-creations-gallery.js'
      - 'tests/my-creations-reference-browser.test.mjs'
      - '.github/workflows/my-creations-visual-acceptance-20261110.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NODE_ENV: test
      DATABASE_URL: ''
      AI_BILLING_MODE: test
      OPENAI_API_KEY: ''
      GEMINI_API_KEY: ''
      STRIPE_SECRET_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify gallery in desktop and mobile browsers
        run: node --test tests/my-creations-reference-browser.test.mjs
      - name: Save real visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: my-creations-desktop-mobile
          path: artifacts/my-creations/*.png
          retention-days: 7
          if-no-files-found: ignore

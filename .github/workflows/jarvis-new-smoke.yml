name: Jarvis New - isolated zero-cost smoke
on:
  push:
    branches: [jarvis-new]
    paths:
      - 'jarvis_new/**'
      - 'docs/JARVIS_NEW_SETUP.md'
      - 'tests/test_jarvis_new_*.py'
      - '.github/workflows/jarvis-new-smoke.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source and license verification (no install)
        run: |
          test -f vendor/voiceos/main.py
          test -f vendor/voiceos/LICENSE
          test -f vendor/voiceos/llm/transports/openai_compatible.py
      - name: Compile vendored Python baseline (offline, no dependency install)
        run: python -m compileall -q vendor/voiceos
      - name: Install only offline image and video test dependencies
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 imageio-ffmpeg==0.6.0
      - name: Offline Jarvis New adapter tests
        run: |
          python -m compileall -q jarvis_new
          python -m unittest discover -s tests -p 'test_jarvis_new_*.py' -v
          python -m jarvis_new.launch --check
      - name: Run one small photo/image/video/music test with zero provider requests
        run: |
          python -m unittest discover -s tests -p 'test_jarvis_new_coordinator.py' -v
          python -m jarvis_new.coordinator --smoke --workspace "$RUNNER_TEMP/jarvis-new-four"
      - name: Save simulated outputs and real local photo-compression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-new-four-tiny-media-smoke
          path: ${{ runner.temp }}/jarvis-new-four/
          if-no-files-found: ignore
          retention-days: 7
      - name: Check if the existing provider secret is visible in this branch's GitHub Actions (no value printed)
        env:
          HAS_DASHSCOPE_KEY: ${{ secrets.DASHSCOPE_API_KEY != '' }}
        run: |
          echo "DASHSCOPE_API_KEY_AVAILABLE_IN_ACTIONS=$HAS_DASHSCOPE_KEY"
          echo "No provider calls made; this is not proof that the model's free quota remains."

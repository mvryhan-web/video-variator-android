name: Owner Inspiration Cloudflare read-only release recovery
on:
  push:
    branches: [deepsyq-platform]
    paths:
      - '.github/workflows/owner-inspiration-cloudflare-readonly-probe-20261110.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Install digest module only
        run: python -m pip install 'blake3==1.0.8' --quiet
      - name: Read-only check of deployment metadata, worker access, and immutable 404 asset bytes
        shell: bash
        run: |
          python - <<'PY'
          import os, requests, hashlib
          from blake3 import blake3
          account=os.getenv('CLOUDFLARE_ACCOUNT_ID','')
          token=os.getenv('CLOUDFLARE_API_TOKEN','')
          assert account and token, 'Cloudflare credential name not configured'
          S=requests.Session()
          S.headers['Authorization']='Bearer '+token
          base='https://api.cloudflare.com/client/v4/accounts/'+account
          def check(path, label):
            try:
              r=S.get(base+path,timeout=15)
              js=r.json() if 'json' in r.headers.get('content-type','') else {}
              print('CF_READ_ONLY',label,'status',r.status_code,'success',js.get('success'),
                    'errors',[v.get('code') for v in js.get('errors',[])])
              return js.get('result') if r.ok and js.get('success') else None
            except Exception as e:
              print('CF_READ_ONLY',label,'exception',type(e).__name__)
              return None
          p=check('/pages/projects/deepsyq','project')
          assert p and p.get('production_branch')=='deepsyq-platform','Cannot verify correct project'
          script=p.get('production_script_name','')
          print('CF_READ_ONLY script_name_known',script.startswith('pages-worker--'))
          d=p.get('canonical_deployment') or {}
          ident=d.get('id','')
          deployment=check('/pages/projects/deepsyq/deployments/'+ident,'deployment')
          assert deployment and deployment.get('uses_functions')==True, 'Production Worker missing'
          print('CF_READ_ONLY deployment_meta',{'id':ident,'uses_functions':True,'url':deployment.get('url'),'asset_count':len(deployment.get('files') or {})})
          for end,label in [
            ('/workers/scripts/'+script+'/versions','worker_versions'),
            ('/workers/scripts/'+script+'/deployments','worker_deployments'),
            ('/workers/scripts/'+script+'/content/v2','worker_content'),
            ('/workers/scripts/'+script+'/settings','worker_settings'),
          ]:
            res=check(end,label)
            if isinstance(res,list):print('CF_READ_ONLY',label,'count',len(res))
          expected=(deployment.get('files') or {}).get('/404.html') or (deployment.get('files') or {}).get('404.html')
          print('CF_READ_ONLY has_404_in_manifest',bool(expected))
          for host in ['https://deepsyq.app','https://deepsyq.pages.dev',deployment.get('url','')]:
            if not host or not host.startswith('https://'):continue
            try:
              r=requests.get(host.rstrip('/')+'/404.html?deepsyq_asset_probe=1',timeout=15,headers={'Cache-Control':'no-cache'})
              b=r.content
              h=blake3(b+b'html').hexdigest()[:32]
              print('CF_READ_ONLY 404_asset',{'origin':host,'status':r.status_code,'bytes':len(b),'hash_matches_manifest':expected==h,'content_type':r.headers.get('content-type','')})
            except Exception as e:print('CF_READ_ONLY 404_asset_failure',host,type(e).__name__)
          PY

name: Owner Inspiration Cloudflare read-only release recovery
on:
  push:
    branches: [deepsyq-platform]
    paths:
      - '.github/workflows/owner-inspiration-cloudflare-readonly-probe-20261110.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Install digest module only
        run: python -m pip install 'blake3==1.0.8' --quiet
      - name: Read-only check of deployment metadata, worker access, and immutable 404 asset bytes
        shell: bash
        run: |
          python - <<'PY'
          import os, requests, hashlib
          from blake3 import blake3
          account=os.getenv('CLOUDFLARE_ACCOUNT_ID','')
          token=os.getenv('CLOUDFLARE_API_TOKEN','')
          assert account and token, 'Cloudflare credential name not configured'
          S=requests.Session()
          S.headers['Authorization']='Bearer '+token
          base='https://api.cloudflare.com/client/v4/accounts/'+account
          def check(path, label):
            try:
              r=S.get(base+path,timeout=15)
              js=r.json() if 'json' in r.headers.get('content-type','') else {}
              print('CF_READ_ONLY',label,'status',r.status_code,'success',js.get('success'),
                    'errors',[v.get('code') for v in js.get('errors',[])])
              return js.get('result') if r.ok and js.get('success') else None
            except Exception as e:
              print('CF_READ_ONLY',label,'exception',type(e).__name__)
              return None
          p=check('/pages/projects/deepsyq','project')
          assert p and p.get('production_branch')=='deepsyq-platform','Cannot verify correct project'
          script=p.get('production_script_name','')
          print('CF_READ_ONLY script_name_known',script.startswith('pages-worker--'))
          d=p.get('canonical_deployment') or {}
          ident=d.get('id','')
          deployment=check('/pages/projects/deepsyq/deployments/'+ident,'deployment')
          assert deployment and deployment.get('uses_functions')==True, 'Production Worker missing'
          print('CF_READ_ONLY deployment_meta',{'id':ident,'uses_functions':True,'url':deployment.get('url'),'asset_count':len(deployment.get('files') or {})})
          trigger=deployment.get('deployment_trigger') or {}
          print('CF_READ_ONLY source_metadata',{'type':trigger.get('type'),
             'commit_hash':(trigger.get('metadata') or {}).get('commit_hash'),
             'commit_dirty':(trigger.get('metadata') or {}).get('commit_dirty'),
             'environment':deployment.get('environment'),
             'project_source_type':(p.get('source') or {}).get('type')})
          import subprocess
          for file in ['home-inspiration.js','deepsyq.js','ai-apps.js']:
            key='/'+file
            raw=open('app/src/main/assets/'+file,'rb').read()
            print('CF_READ_ONLY task_file',file,{'exists_in_live':key in deployment.get('files',{}),
              'new_hash_matches_live':deployment.get('files',{}).get(key)==blake3(raw+file.rsplit('.',1)[-1].encode()).hexdigest()[:32]})

          for end,label in [
            ('/workers/scripts/'+script+'/versions','worker_versions'),
            ('/workers/scripts/'+script+'/deployments','worker_deployments'),
            ('/workers/scripts/'+script+'/content/v2','worker_content'),
            ('/workers/scripts/'+script+'/settings','worker_settings'),
          ]:
            try:
              response=S.get(base+end,timeout=15)
              obj=response.json()
              result=obj.get('result') or {}
              print('CF_READ_ONLY',label,'http',response.status_code,'success',obj.get('success'),
                    'result_type',type(result).__name__,
                    'result_keys',sorted(result.keys()) if isinstance(result,dict) else [],
                    'errors',[z.get('code') for z in obj.get('errors') or []])
              if label=='worker_deployments' and isinstance(result,dict):
                dep=result.get('deployments') or []
                print('CF_READ_ONLY worker_deployment_count',len(dep))
                if dep:
                  print('CF_READ_ONLY first_deployment',{'id':dep[0].get('id'),'versions':dep[0].get('versions')})
                  for ver in dep[0].get('versions') or []:
                    version=ver.get('version_id','')
                    if not version:continue
                    vcheck=S.get(base+'/workers/scripts/'+script+'/versions/'+version,timeout=15)
                    vd=vcheck.json()
                    vs=vd.get('result') or {}
                    print('CF_READ_ONLY active_version',{'status':vcheck.status_code,'success':vd.get('success'),
                          'etag':(vs.get('resources') or {}).get('script',{}).get('etag'),
                          'errors':[z.get('code') for z in vd.get('errors') or []]})
                    beta=S.get(base+'/workers/workers/'+script+'/versions/'+version,
                      params={'include':'modules'},timeout=20)
                    try:
                      bj=beta.json()
                      br=bj.get('result') or {}
                      mods=br.get('modules') or []
                      print('CF_READ_ONLY worker_beta_modules',{
                        'status':beta.status_code,'success':bj.get('success'),
                        'keys':sorted(br.keys()) if isinstance(br,dict) else [],
                        'module_count':len(mods),'module_types':[str(x.get('type','')) for x in mods if isinstance(x,dict)],
                        'error_codes':[z.get('code') for z in bj.get('errors') or []]})
                    except Exception:
                      print('CF_READ_ONLY worker_beta_content_type',beta.status_code,
                        beta.headers.get('content-type','')[:64])
            except Exception as error:print('CF_READ_ONLY '+label+' exception '+type(error).__name__)
          expected=(deployment.get('files') or {}).get('/404.html') or (deployment.get('files') or {}).get('404.html')
          print('CF_READ_ONLY has_404_in_manifest',bool(expected))
          for host in ['https://deepsyq.app','https://deepsyq.pages.dev',deployment.get('url','')]:
            if not host or not host.startswith('https://'):continue
            try:
              r=requests.get(host.rstrip('/')+'/404.html?deepsyq_asset_probe=1',timeout=15,headers={'Cache-Control':'no-cache'})
              b=r.content
              h=blake3(b+b'html').hexdigest()[:32]
              print('CF_READ_ONLY 404_asset',{'origin':host,'status':r.status_code,'bytes':len(b),'hash_matches_manifest':expected==h,'content_type':r.headers.get('content-type','')})
            except Exception as e:print('CF_READ_ONLY 404_asset_failure',host,type(e).__name__)
          PY

name: F8 three pet contract / no spend
on:
  pull_request:
    paths:
      - 'app/src/main/assets/virtual-pet/**'
      - 'app/src/main/assets/virtual-pet.js'
      - 'app/src/main/assets/virtual-pet-living.js'
      - 'app/src/main/assets/virtual-pet.css'
      - 'app/src/main/assets/virtual-pet.html'
      - 'app/src/main/assets/virtual-pet-page.js'
      - 'app/src/main/assets/jarvix-studio-page.js'
      - 'app/src/main/assets/deepsyq.html'
      - 'app/src/main/assets/index.html'
      - 'app/src/main/assets/generate-studio.html'
      - 'app/src/main/assets/my-creations.html'
      - 'app/src/main/assets/compare-ai.html'
      - 'app/src/main/assets/ai-agents.html'
      - 'tests/virtual-pet*'
      - 'tests/jarvix-language-voice-unit.mjs'
      - 'app/src/main/assets/jarvis-core.js'
      - 'app/src/main/assets/jarvix-studio.html'
      - 'server/jarvix-voice.js'
      - 'scripts/build_f8_pets_3d.py'
      - '.github/workflows/f8-three-pets.yml'
  push:
    branches: [deepsyq-platform]
    paths:
      - 'app/src/main/assets/virtual-pet/**'
      - 'app/src/main/assets/virtual-pet.js'
      - 'app/src/main/assets/virtual-pet-living.js'
      - 'app/src/main/assets/virtual-pet.css'
      - 'app/src/main/assets/virtual-pet.html'
      - 'app/src/main/assets/virtual-pet-page.js'
      - 'app/src/main/assets/jarvix-studio-page.js'
      - 'app/src/main/assets/deepsyq.html'
      - 'app/src/main/assets/index.html'
      - 'app/src/main/assets/generate-studio.html'
      - 'app/src/main/assets/my-creations.html'
      - 'app/src/main/assets/compare-ai.html'
      - 'app/src/main/assets/ai-agents.html'
      - 'tests/virtual-pet*'
      - 'tests/jarvix-language-voice-unit.mjs'
      - 'app/src/main/assets/jarvis-core.js'
      - 'app/src/main/assets/jarvix-studio.html'
      - 'server/jarvix-voice.js'
      - 'scripts/build_f8_pets_3d.py'
      - '.github/workflows/f8-three-pets.yml'
jobs:
  no-spend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate static JS, manifests and safe pet prototype
        run: |
          node --check app/src/main/assets/virtual-pet.js
          node --check app/src/main/assets/virtual-pet-living.js
          python3 -m py_compile scripts/build_f8_pets_3d.py
          node --test tests/virtual-pet.test.mjs tests/virtual-pet-assets-unit.mjs tests/virtual-pet-living-unit.mjs
      - name: Jarvix language and speech regressions (no provider requests)
        run: node --test tests/jarvix-language-voice-unit.mjs tests/jarvis-core.test.mjs tests/jarvix-brain.test.mjs tests/jarvix-site-knowledge.test.mjs tests/jarvix-voice-bargein-pets.test.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - name: Pet settings desktop and mobile browser regressions
        run: npx playwright test tests/virtual-pet-living.spec.mjs tests/jarvix-page-csp.spec.mjs --project=chromium --project=mobile-chromium --project=webkit --project=mobile-webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f8-pet-browser-evidence
          path: test-results/

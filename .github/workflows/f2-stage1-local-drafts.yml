name: F2 Stage1 local draft no-spend
on:
  pull_request:
    paths:
      - server/user-agent-stage1-local-draft.js
      - tests/user-agent-stage1-local-draft-unit.mjs
      - server/user-agent-plan.js
      - .github/workflows/f2-stage1-local-drafts.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  f2-no-spend:
    name: f2-local-drafts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run exact native local-only tests
        run: node --test tests/user-agent-stage1-local-draft-unit.mjs

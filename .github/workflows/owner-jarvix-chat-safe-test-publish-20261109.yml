name: Owner JARVIX Chat only - guarded canonical TEST publication
on:
  pull_request:
    branches: [deepsyq-platform]
    paths:
      - '.github/workflows/owner-jarvix-chat-safe-test-publish-20261109.yml'
permissions:
  contents: read
concurrency:
  group: deepsyq-canonical-test-publication
  cancel-in-progress: false
jobs:
  guarded-jarvix-test:
    if: github.event.pull_request.number == 669 && github.head_ref == 'p/jarvix-chat-sidebar-settings-20261109' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact current DEV and JARVIX-only source preflight
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/deepsyq-platform:refs/remotes/origin/deepsyq-platform
          DEV_SHA=$(git rev-parse refs/remotes/origin/deepsyq-platform)
          git merge-base --is-ancestor "$DEV_SHA" HEAD
          echo "DEV_SHA=$DEV_SHA" >> "$GITHUB_ENV"
          echo "OWNER_APPROVED_PR_CANDIDATE_SHA=$GITHUB_SHA"
          node --check app/src/main/assets/jarvix-chat.js
          node --check app/src/main/assets/home-studio-settings.js
          if ! grep -Fq 'JARVIX Chat only' app/src/main/assets/jarvix-chat.css; then
            echo '::error::Missing scoped JARVIX Chat only menu style'; exit 1
          fi
      - name: Read-only Cloudflare TEST revision safety preflight (fail closed)
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const token=process.env.CLOUDFLARE_API_TOKEN,account=process.env.CLOUDFLARE_ACCOUNT_ID;
          if(!token || !/^[a-f\d]{32}$/i.test(account||''))throw Error('Missing Cloudflare Pages credentials; no deploy');
          const root='https://api.cloudflare.com/client/v4/accounts/'+account+'/pages/projects/deepsyq';
          async function get(url){
            const r=await fetch(url,{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(18000)});
            if(!r.ok)throw Error('Cloudflare read-only preflight failed: HTTP '+r.status);
            const x=await r.json();
            if(x.success!==true)throw Error('Cloudflare API returned failure');
            return x.result;
          }
          const project=await get(root);
          assert.equal(project.name,'deepsyq');
          assert.equal(project.production_branch,'deepsyq-platform','TEST must not be the production branch');
          const main=project.canonical_deployment;
          assert(main?.id,'Missing MAIN deployment metadata');
          const deployments=[];
          for(let page=1;page<=4;page++){
            const batch=await get(root+'/deployments?per_page=20&page='+page);
            assert(Array.isArray(batch));
            deployments.push(...batch);
          }
          const test=deployments.find(d=>(d.aliases||[]).includes('https://test.deepsyq.pages.dev'));
          console.log('CANONICAL_TEST_READONLY',JSON.stringify(test?{
            branch:test.deployment_trigger?.metadata?.branch,
            sha:test.deployment_trigger?.metadata?.commit_hash,
            dirty:test.deployment_trigger?.metadata?.commit_dirty,
            uses_functions:test.uses_functions,
            environment:test.environment,
            deployment_id:test.id
          }:{found:false}));
          if(!test)throw Error('TEST stable alias not identified; refusing deploy');
          if(test.environment!=='preview' || test.deployment_trigger?.metadata?.branch!=='test')
            throw Error('TEST alias is not a verified isolated preview');
          if(test.uses_functions===true)throw Error('TEST contains Functions; static-only upload would strip them. BLOCKED.');
          if(test.deployment_trigger?.metadata?.commit_dirty!==false ||
             test.deployment_trigger?.metadata?.commit_hash!==process.env.DEV_SHA)
            throw Error('TEST includes unmerged or unverifiable source. Refusing to overwrite accepted work.');
          fs.appendFileSync(process.env.GITHUB_ENV,
            'MAIN_DEPLOYMENT_BEFORE='+main.id+'\nTEST_DEPLOYMENT_BEFORE='+test.id+'\n');
          console.log('TEST_SAFE_TO_PUBLISH_ONLY_CURRENT_DEV_PLUS_THIS_PAGE');
          JS
      - name: Publish latest DEV plus surgical JARVIX Chat change ONLY to canonical TEST branch
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy app/src/main/assets \
            --project-name=deepsyq --branch=test \
            --commit-hash="${{ github.event.pull_request.head.sha }}"
          echo 'Deployed ONLY to stable https://test.deepsyq.pages.dev'
      - name: Verify TEST alias reflects same JARVIX Chat and MAIN deployment is unchanged
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/pages/projects/deepsyq';
          const headers={Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN};
          const project=await fetch(base,{headers}).then(r=>r.json());
          assert(project.success===true);
          assert.equal(project.result.canonical_deployment?.id,process.env.MAIN_DEPLOYMENT_BEFORE,
            'Production deployment changed unexpectedly');
          const response=await fetch('https://test.deepsyq.pages.dev/jarvix-chat.html',
            {signal:AbortSignal.timeout(18000),headers:{'Cache-Control':'no-cache'}});
          assert(response.ok,'JARVIX Chat TEST page failed');
          const html=await response.text();
          assert(html.includes('jChatDropdown') && html.includes('jActiveModeLabel'));
          console.log('TEST_JARVIX_PAGE_FOUND_MAIN_UNCHANGED');
          JS

name: Xmas PC production preflight
on:
  push:
    branches: [xmas-pc-responsive-20261120]
    paths: [.github/workflows/xmas-pc-release-preflight.yml]
permissions:
  contents: read
concurrency:
  group: deepsyq-surgical-pages-release
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests==2.32.3 blake3==1.0.8
      - name: Verify the production Worker and exact page scope
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          origin="$(PYTHONPATH=scripts python -c 'from deepsyq_surgical_publish import Cloudflare; print(Cloudflare().read_live()[2])')"
          echo "Production source commit: $origin"
          git worktree add --detach "$RUNNER_TEMP/xmas-live-source" "$origin"
          cp scripts/deepsyq_surgical_publish.py scripts/email_worker_scope.py "$RUNNER_TEMP/xmas-live-source/scripts/"
          cp app/src/main/assets/xmas-pc.html "$RUNNER_TEMP/xmas-live-source/app/src/main/assets/"
          cd "$RUNNER_TEMP/xmas-live-source"
          python - <<'PY'
          from pathlib import Path
          script = Path("scripts/deepsyq_surgical_publish.py")
          source = script.read_text()
          anchor = "HASH_REUSE_RELEASE_SETS = (\n"
          assert source.count(anchor) == 1
          script.write_text(source.replace(anchor, anchor + '    frozenset({"xmas-pc.html"}),\n', 1))
          PY
          python scripts/deepsyq_surgical_publish.py --mode plan --files xmas-pc.html
          PYTHONPATH=scripts python - <<'PY'
          from urllib.parse import quote
          from deepsyq_surgical_publish import API, Cloudflare, MAX_FILE_BYTES, insist
          cf = Cloudflare()
          _, _, _, worker, _ = cf.read_live()
          response = cf.call("GET", f"{API}/accounts/{cf.account}/workers/scripts/{quote(worker, safe='')}/content/v2")
          mime = response.headers.get("Content-Type", "").lower()
          insist(100 <= len(response.content) <= MAX_FILE_BYTES, "Original Worker bytes unavailable")
          insist("javascript" in mime or mime.startswith("multipart/form-data"), "Original Worker format unsupported")
          print("Canonical production Worker payload verified")
          PY

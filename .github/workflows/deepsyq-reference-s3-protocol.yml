name: Deepsyq isolated S3 link security checks
on:
  push:
    branches: [deepsyq-platform]
    paths:
      - 'server/generation-storage.js'
      - 'tests/generation-reference-sigv4-http.mjs'
      - '.github/workflows/deepsyq-reference-s3-protocol.yml'
  pull_request:
    paths:
      - 'server/generation-storage.js'
      - 'tests/generation-reference-sigv4-http.mjs'
      - '.github/workflows/deepsyq-reference-s3-protocol.yml'
  workflow_dispatch:
jobs:
  s3-link-guards:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify S3 URL guard syntax
        run: |
          node --check server/generation-storage.js
          node --check tests/generation-reference-sigv4-http.mjs
      - name: Validate HTTP SigV4, tamper, expiry, revocation on loopback only
        run: node --test tests/generation-reference-sigv4-http.mjs

name: Owner Everyday Tools gallery (no spend)
on:
  pull_request:
    branches: [deepsyq-platform]
    paths:
      - 'app/src/main/assets/free-tools.html'
      - 'app/src/main/assets/everyday-tools-visual.js'
      - 'app/src/main/assets/everyday-tools-visual.css'
      - 'tests/owner-everyday-tools-visual.spec.mjs'
      - '.github/workflows/owner-everyday-tools-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gallery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --check app/src/main/assets/everyday-tools-visual.js
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify owner layout, functional routes, mobile, no paid calls
        run: npx playwright test tests/owner-everyday-tools-visual.spec.mjs --project=chromium --project=webkit --project=mobile-chromium --project=mobile-webkit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: owner-everyday-tools-browser-failures
          path: test-results/
          retention-days: 7

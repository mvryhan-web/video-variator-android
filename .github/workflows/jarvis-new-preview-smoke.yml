name: JARVIX NEW - DEEPSYQ preview read-only smoke
on:
  push:
    branches: [jarvis-new]
    paths:
      - '.github/workflows/jarvis-new-preview-smoke.yml'
permissions:
  contents: read
jobs:
  preview-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check preview homepage without mutating or deploying the site
        shell: bash
        run: |
          python - <<'PY'
          import re
          import urllib.error
          import urllib.request
          from html import unescape

          url = "https://deepsyq.pages.dev/"
          request = urllib.request.Request(
              url, headers={"User-Agent": "JARVIX-preview-readonly-smoke/1.0"}
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  status = response.status
                  final_url = response.geturl()
                  content_type = response.headers.get("Content-Type", "")
                  data = response.read(2_000_000)
          except (urllib.error.URLError, TimeoutError) as exc:
              raise SystemExit(f"FAIL: preview unreachable: {type(exc).__name__}: {exc}")
          html = data.decode("utf-8", errors="replace")
          title_match = re.search(r"<title[^>]*>(.*?)</title>", html, flags=re.I | re.S)
          title = unescape(title_match.group(1).strip()) if title_match else "(no title)"
          print(f"HTTP={status} final_url={final_url} content_type={content_type}")
          print(f"HTML_bytes={len(data)} title={title[:200]}")
          if status != 200:
              raise SystemExit(f"FAIL: preview returned HTTP {status}")
          if "html" not in content_type.lower() or not re.search(r"<html\b", html, flags=re.I):
              raise SystemExit("FAIL: preview did not return HTML")
          if not re.search(r"deepsyq|jarvix", html, flags=re.I):
              raise SystemExit("FAIL: neither DEEPSYQ nor JARVIX appears in homepage source")
          print("PASS: preview page reachable and basic HTML branding present")
          print("NOTE: This is NOT a browser/microphone/desktop-functionality test.")
          PY

name: Owner Pricing LIVE read-only verification
on:
  push:
    branches: [owner-pricing-live-readonly-20261109]
    paths: ['.github/workflows/owner-pricing-live-readonly-20261109.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Inspect real MAIN Pricing and Cloudflare Worker, zero changes
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          async function get(url,headers={}){
            const res=await fetch(url,{headers:{...headers,'cache-control':'no-cache'},signal:AbortSignal.timeout(18000),redirect:'follow'});
            return {res,text:await res.text()};
          }
          const origin='https://deepsyq.app';
          const main=await get(origin+'/pricing.html?ownerCheck='+Date.now());
          console.log('LIVE_PRICING_HTTP',main.res.status,'HTML_BYTES',main.text.length);
          const match=main.text.match(/<script[^>]+src=["']([^"']*pricing-page\.js[^"']*)/i);
          const cssmatch=main.text.match(/<link[^>]+href=["']([^"']*pricing-page\.css[^"']*)/i);
          const ids=['pricePlanPrev','pricePlanNext','pricePlanPosition','planCards','priceBillingMonthly','priceBillingYearly','creditCards'];
          const present=Object.fromEntries(ids.map(id=>[id,main.text.includes('id="'+id+'"')]));
          console.log('LIVE_PRICING_IDS',JSON.stringify(present));
          console.log('LIVE_PRICING_RESOURCES',JSON.stringify({js:match?.[1]||null,css:cssmatch?.[1]||null}));
          let jsOk=false,cssOk=false;
          if(match?.[1]){
            const j=await get(new URL(match[1],origin+'/pricing.html').href);
            jsOk=j.res.status===200&&j.text.includes('function movePlanCarousel')&&j.text.includes('planCarouselIndex');
            console.log('LIVE_CAROUSEL_JS',j.res.status,jsOk,'BYTES',j.text.length);
          }
          if(cssmatch?.[1]){
            const c=await get(new URL(cssmatch[1],origin+'/pricing.html').href);
            cssOk=c.res.status===200&&c.text.includes('scroll-snap-type:x mandatory')&&c.text.includes('price-plan-carousel-controls');
            console.log('LIVE_CAROUSEL_CSS',c.res.status,cssOk,'BYTES',c.text.length);
          }
          const cfg=await get(origin+'/api/config?ownerCheck='+Date.now());
          console.log('LIVE_WORKER_CONFIG',cfg.res.status,'JSON',cfg.res.headers.get('content-type'));
          const live=main.res.status===200&&ids.every(x=>present[x])&&jsOk&&cssOk;
          console.log('PRICING_CAROUSEL_MAIN_LIVE',live);
          const t=process.env.CF_TOKEN,a=process.env.CF_ACCOUNT;
          if(t&&a){
            const base='https://api.cloudflare.com/client/v4';
            const headers={Authorization:'Bearer '+t};
            const p=await get(base+'/accounts/'+a+'/pages/projects/deepsyq',headers);
            console.log('PAGES_READ_HTTP',p.res.status);
            if(p.res.ok){
              const pj=JSON.parse(p.text).result;
              console.log('CURRENT_MAIN_DEPLOYMENT',JSON.stringify({id:pj.canonical_deployment?.id,uses_functions:pj.canonical_deployment?.uses_functions,commit:pj.canonical_deployment?.deployment_trigger?.metadata?.commit_hash,worker:pj.production_script_name}));
              if(pj.production_script_name){
                const w=await fetch(base+'/accounts/'+a+'/workers/scripts/'+encodeURIComponent(pj.production_script_name)+'/content/v2',{headers,signal:AbortSignal.timeout(18000)});
                console.log('CURRENT_WORKER_READ_HTTP',w.status);
              }
            }
          }
          console.log('READ_ONLY_CHECK_COMPLETE');
          JS
      - name: Install no-spend browser dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Real mobile and desktop on LIVE Pricing, no payments
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          try{
            for(const [name,width,height] of [['mobile-390',390,844],['mobile-650',650,850],['desktop',1360,900]]){
              const mobile=name.startsWith('mobile'),ctx=await browser.newContext({viewport:{width,height},isMobile:mobile,hasTouch:mobile});
              const page=await ctx.newPage(),paid=[];
              page.on('request',r=>{if(r.method()==='POST'&&/\/api\/(?:billing|ai-billing|stripe|payments|checkout)/i.test(r.url()))paid.push(r.url())});
              try{
                const response=await page.goto('https://deepsyq.app/pricing.html?qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:35000});
                assert.equal(response.status(),200,name+' response');
                const cards=page.locator('#planCards .price-plan');
                await cards.first().waitFor({state:'visible',timeout:20000});
                assert.equal(await cards.count(),5,name+' five plan cards');
                await page.waitForTimeout(350);
                const display=await page.locator('#planCards').evaluate(e=>getComputedStyle(e).display);
                const track=page.locator('#planCards');
                if(mobile){
                  assert.equal(display,'flex',name+' flex track');
                  assert(await page.locator('#pricePlanNext').isVisible(),name+' next visible');
                  assert.equal((await page.locator('#pricePlanPosition').textContent()).trim(),'1 / 5',name+' first');
                  await page.locator('#pricePlanNext').click();
                  await page.waitForFunction(()=>document.querySelector('#planCards').scrollLeft>100,null,{timeout:9000});
                  await page.waitForFunction(()=>document.querySelector('#pricePlanPosition').textContent.includes('2 / 5'),null,{timeout:9000});
                  await page.locator('#priceBillingYearly').click();
                  await page.waitForFunction(()=>document.querySelector('#pricePlanPosition').textContent.includes('2 / 5'),null,{timeout:9000});
                  await page.locator('#priceBillingMonthly').click();
                  assert.equal(await cards.count(),5,name+' cards retained');
                } else {
                  assert.equal(display,'grid','Desktop grid unchanged');
                  assert.equal(await page.locator('#pricePlanNext').isVisible(),false,'Desktop arrows absent');
                }
                assert.deepEqual(paid,[],name+' no payment request');
                console.log('MAIN_CAROUSEL_BROWSER_PASS',name,JSON.stringify({display,plans:5}));
              } finally {await ctx.close()}
            }
          }finally{await browser.close()}
          JS

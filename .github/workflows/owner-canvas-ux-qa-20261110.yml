name: Owner Canvas UX controls — isolated browser QA 20261110
on:
  push:
    branches: [owner-canvas-ux-controls-20261110]
    paths: ['.github/workflows/owner-canvas-ux-qa-20261110.yml']
permissions: {contents: read}
jobs:
  canvas-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - name: Install existing package dependencies and browser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Syntax-check isolated Canvas scripts
        run: |
          node --check app/src/main/assets/canvas-workspace.js
          node --check tests/owner-canvas-ux-controls.spec.mjs
      - name: Run all twelve mobile/desktop Canvas UX, PNG and Studio handoff browser checks
        env:
          NODE_ENV: test
        run: npx playwright test tests/owner-canvas-ux-controls.spec.mjs --project=chromium --project=mobile-chromium --reporter=list --retries=0

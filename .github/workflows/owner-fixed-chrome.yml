name: Owner GO stage02 - pinned header/sidebar browser acceptance
on:
  pull_request:
    branches: [deepsyq-platform]
    paths:
      - 'app/src/main/assets/deepsyq-mobile-shell.css'
      - 'app/src/main/assets/deepsyq-mobile-shell.js'
      - 'app/src/main/assets/deepsyq-site-shell.js'
      - 'tests/owner-fixed-chrome-20261107.spec.mjs'
      - '.github/workflows/owner-fixed-chrome.yml'
permissions:
  contents: read
concurrency:
  group: owner-fixed-chrome-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  chrome-pinning:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --check tests/owner-fixed-chrome-20261107.spec.mjs
      - run: npx playwright install --with-deps chromium webkit
      - name: Test 9 routes desktop/mobile without paid requests
        run: npx playwright test tests/owner-fixed-chrome-20261107.spec.mjs --project=chromium --project=mobile-webkit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: owner-fixed-chrome-traces
          path: test-results/
          if-no-files-found: ignore

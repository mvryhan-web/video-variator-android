name: F5 Cloudflare Cron isolated TEST gate
on:
  pull_request:
    branches: [deepsyq-platform]
    paths:
      - 'cloudflare/product-watcher/**'
      - 'tests/product-watcher-cloudflare-cron-unit.mjs'
      - '.github/workflows/f5-cloudflare-cron.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install existing pinned dependencies
        run: npm ci --ignore-scripts
      - name: Offline syntax and cron safety tests
        run: |
          node --check cloudflare/product-watcher/cron-core.js
          node --check cloudflare/product-watcher/worker.js
          node --test tests/product-watcher-cloudflare-cron-unit.mjs
      - name: Cloudflare Worker bundle only (NO deploy)
        run: npx --yes wrangler@4 deploy --dry-run --config cloudflare/product-watcher/wrangler.toml

  w56-existing-policy-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact separate W5.6 draft revision (read only, no merge)
        uses: actions/checkout@v4
        with:
          ref: 254882dbe37c8ddcc2e1651b78bb134413ffdbc0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify actual W5.5 integration on existing W5.6 draft SHA
        run: |
          node --check server/product-watcher/lite-delivery-attempt.js
          node --check tests/product-watcher-lite-delivery-attempt-unit.mjs
          node --test tests/product-watcher-lite-delivery-policy-unit.mjs tests/product-watcher-lite-delivery-attempt-unit.mjs

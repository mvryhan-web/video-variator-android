name: BASE 14 Ledger Reference Privacy
on:
  push:
    branches: [base14-private-ledger-refs-20261016]
  pull_request:
    paths:
      - 'server/generation-wallet.js'
      - 'tests/base14-private-ledger-refs.mjs'
permissions:
  contents: read
jobs:
  wallet-history-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Read-only credit ledger and authenticated customer API
        run: |
          node --check server/generation-wallet.js
          node --check tests/base14-private-ledger-refs.mjs
          node --test tests/base14-private-ledger-refs.mjs

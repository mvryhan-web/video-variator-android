name: DEEPSYQ language regression
on:
  push:
    branches: [deepsyq-platform]
    paths:
      - 'app/src/main/assets/*.html'
      - 'app/src/main/assets/deepsyq-i18n.js'
      - 'app/src/main/assets/deepsyq-site-shell.js'
      - 'app/src/main/assets/pricing-page.js'
      - 'tests/deepsyq-i18n-regression.test.mjs'
  pull_request:
    paths:
      - 'app/src/main/assets/*.html'
      - 'app/src/main/assets/deepsyq-i18n.js'
      - 'app/src/main/assets/deepsyq-site-shell.js'
      - 'app/src/main/assets/pricing-page.js'
permissions:
  contents: read
jobs:
  check-locales:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check localization contract
        run: node --test tests/deepsyq-i18n-regression.test.mjs

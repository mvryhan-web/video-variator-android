name: Deepsyq AI Apps discovery

on:
  pull_request:
    paths:
      - 'app/src/main/assets/ai-apps.html'
      - 'app/src/main/assets/ai-apps.css'
      - 'app/src/main/assets/ai-apps.js'
      - 'app/src/main/assets/ai-template-product-name.js'
      - 'tests/ai-template-product-name.mjs'
      - 'tests/deepsyq-ai-apps-discovery.spec.mjs'
      - '.github/workflows/deepsyq-ai-apps-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

# Unique workflow-file key: several existing workflows share the display name "BASE".
# Cancel only superseded runs of THIS workflow on the SAME PR or ref.
# Never cancel another agent's different PR or disable a safety assertion.
concurrency:
  group: agent5-deepsyq-ai-apps-discovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ai-apps-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate isolated AI Apps changes
        run: |
          node --check app/src/main/assets/ai-apps.js
          node --check app/src/main/assets/ai-template-product-name.js
          node --test tests/ai-template-product-name.mjs
          node --check tests/deepsyq-ai-apps-discovery.spec.mjs
      - run: npx playwright install --with-deps chromium webkit
      - name: Check AI Apps in desktop and mobile Chromium and Safari WebKit
        run: npx playwright test tests/deepsyq-ai-apps-discovery.spec.mjs --project=chromium --project=mobile-chromium --project=webkit --project=mobile-webkit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ai-apps-discovery-evidence
          path: test-results/
          retention-days: 7

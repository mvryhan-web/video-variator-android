name: Owner JARVIX history and account exact two-file production release
on:
  push:
    branches: [deepsyq-platform]
    paths:
      - '.github/workflows/owner-jarvix-history-account-only-publish-20261110.yml'
permissions:
  contents: read
concurrency:
  group: deepsyq-surgical-pages-release
  cancel-in-progress: false
jobs:
  publish-only-two-jarvix-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deepsyq-platform
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original Worker and Pages manifest preservation guard
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/deepsyq_surgical_publish.py
          python -m unittest discover -s tests -p 'test_deepsyq_surgical_publish.py' -v
          python - <<'PY'
          from pathlib import Path
          html=Path('app/src/main/assets/jarvix-chat.html').read_text()
          js=Path('app/src/main/assets/jarvix-chat.js').read_text()
          css=Path('app/src/main/assets/jarvix-chat.css').read_text()
          assert html.count('id="jChatDropdown"')==1
          assert html.count('id="jChatForm"')==1
          assert "/api/me" in js and "j-drawer-avatar" in js
          assert "grid-area:history!important" in css and "grid-area:footer!important" in css
          print("EXACT_TWO_JARVIX_ASSETS_WITH_EXISTING_BACKEND")
          PY
      - name: Install only existing surgical publisher dependencies
        run: python -m pip install --disable-pip-version-check 'requests==2.32.3' 'blake3==1.0.8'
      - name: Publish only existing JARVIX JS and CSS if LIVE Worker and all assets can be preserved
        shell: bash
        run: |
          set -euo pipefail
          python scripts/deepsyq_surgical_publish.py --mode publish --files 'jarvix-chat.js,jarvix-chat.css' --commit "$GITHUB_SHA"

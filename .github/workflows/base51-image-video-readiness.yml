name: BASE 51 Image Video Launch Switch Safety
on:
  push:
    branches: [base51-image-video-launch-switches-20261016]
  pull_request:
    paths:
      - 'server/generation-readiness.js'
      - 'tests/generation-readiness-unit.mjs'
      - '.github/workflows/base51-image-video-readiness.yml'
permissions:
  contents: read
jobs:
  image-video-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Validate strict owner readiness and existing provider checks
        run: |
          node --check server/generation-readiness.js
          node --check tests/generation-readiness-unit.mjs
          node --test tests/generation-readiness-unit.mjs tests/generation-entitlements-unit.mjs tests/generation-policy-unit.mjs

name: Cloudflare Pages configured access audit (READ ONLY)
on:
  push:
    branches:
      - audit-cloudflare-pages-access-20261108
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloudflare-access-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TOKEN_2: ${{ secrets.CF_API_TOKEN }}
      TOKEN_3: ${{ secrets.CLOUDFLARE_TOKEN }}
      ACCOUNT_1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ACCOUNT_2: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      ACCOUNT_3: ${{ secrets.CF_ACCOUNT_ID }}
      ACCOUNT_4: ${{ vars.CF_ACCOUNT_ID }}
    steps:
      - name: Verify connected secrets and read-only Pages project metadata (no deployment)
        shell: bash
        run: |
          set -euo pipefail
          token="${TOKEN_1:-${TOKEN_2:-${TOKEN_3:-}}}"
          account="${ACCOUNT_1:-${ACCOUNT_2:-${ACCOUNT_3:-${ACCOUNT_4:-}}}}"
          echo '### Cloudflare credential and TEST project preflight (read only)' >> "$GITHUB_STEP_SUMMARY"
          if [[ -z "$token" ]]; then
            echo 'API_TOKEN_CONFIGURED=false (tested CLOUDFLARE_API_TOKEN, CF_API_TOKEN, CLOUDFLARE_TOKEN)' >> "$GITHUB_STEP_SUMMARY"
            echo 'API_TOKEN_CONFIGURED=false'
            exit 0
          fi
          echo 'API_TOKEN_CONFIGURED=true' >> "$GITHUB_STEP_SUMMARY"
          echo 'API_TOKEN_CONFIGURED=true'
          echo "::add-mask::$token"
          status=$(curl -sS --connect-timeout 5 --max-time 14 -o /tmp/cf-token-check.json -w '%{http_code}' -H "Authorization: Bearer $token" -H 'Accept: application/json' 'https://api.cloudflare.com/client/v4/user/tokens/verify') || status=network_error
          TOKEN_STATUS="$status" python3 - <<'PY'
          import json,os
          try:
            data=json.load(open('/tmp/cf-token-check.json'))
            success=data.get('success') is True and data.get('result',{}).get('status')=='active'
          except Exception:
            success=False
          print('TOKEN_ACTIVE='+str(success).lower())
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write('TOKEN_ACTIVE='+str(success).lower()+', HTTP_STATUS='+os.environ['TOKEN_STATUS']+'\\n')
          PY
          if [[ -z "$account" ]]; then
            echo 'ACCOUNT_ID_CONFIGURED=false (tested CLOUDFLARE_ACCOUNT_ID, CF_ACCOUNT_ID in Secrets/Variables)' >> "$GITHUB_STEP_SUMMARY"
            echo 'ACCOUNT_ID_CONFIGURED=false'
            exit 0
          fi
          echo 'ACCOUNT_ID_CONFIGURED=true' >> "$GITHUB_STEP_SUMMARY"
          echo 'ACCOUNT_ID_CONFIGURED=true'
          if [[ ! "$account" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo 'ACCOUNT_ID_FORMAT_VALID=false' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          status=$(curl -sS --connect-timeout 5 --max-time 14 -o /tmp/cf-project-check.json -w '%{http_code}' -H "Authorization: Bearer $token" -H 'Accept: application/json' "https://api.cloudflare.com/client/v4/accounts/$account/pages/projects/deepsyq") || status=network_error
          PROJECT_STATUS="$status" python3 - <<'PY'
          import json,os
          try:
            data=json.load(open('/tmp/cf-project-check.json'))
            project=data.get('result') if data.get('success') is True else None
          except Exception:
            project=None
          print('PAGES_PROJECT_DEEPSYQ_ACCESSIBLE='+str(bool(project)).lower())
          if project:
            print('PAGES_PRODUCTION_BRANCH='+str(project.get('production_branch')))
            source=project.get('source') or {}
            print('PAGES_GIT_SOURCE_TYPE='+str(source.get('type')))
            latest=project.get('latest_deployment') or {}
            print('LATEST_DEPLOYMENT_BRANCH='+str((latest.get('deployment_trigger') or {}).get('metadata',{}).get('branch')))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write('PAGES_PROJECT_DEEPSYQ_ACCESSIBLE='+str(bool(project)).lower()+', HTTP_STATUS='+os.environ['PROJECT_STATUS']+'\\n')
            if project:
              f.write('PAGES_PRODUCTION_BRANCH='+str(project.get('production_branch'))+'\\n')
          PY

      - name: Inspect existing preview deployment metadata and unauthenticated route status
        shell: bash
        run: |
          set -euo pipefail
          token="${TOKEN_1:-${TOKEN_2:-${TOKEN_3:-}}}"
          account="${ACCOUNT_1:-${ACCOUNT_2:-${ACCOUNT_3:-${ACCOUNT_4:-}}}}"
          if [[ -z "$token" || ! "$account" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo 'SKIPPED: no validated configured API token or account ID'
            exit 0
          fi
          echo "::add-mask::$token"
          status=$(curl -sS --connect-timeout 5 --max-time 15 -o /tmp/cf-deployments.json -w '%{http_code}' -H "Authorization: Bearer $token" -H 'Accept: application/json' "https://api.cloudflare.com/client/v4/accounts/$account/pages/projects/deepsyq/deployments?per_page=5") || status=network_error
          DEPLOYMENTS_HTTP_STATUS="$status" python3 - <<'PY'
          import json,os
          try:
            data=json.load(open('/tmp/cf-deployments.json'))
            records=data.get('result') if data.get('success') else []
          except Exception:
            records=[]
          print('DEPLOYMENTS_LIST_HTTP_STATUS='+os.environ['DEPLOYMENTS_HTTP_STATUS'])
          for d in (records or [])[:5]:
            trigger=d.get('deployment_trigger') or {}
            meta=trigger.get('metadata') or {}
            print('DEPLOYMENT='+json.dumps({'environment':d.get('environment'),'url':d.get('url'),'branch':meta.get('branch'),'commit_hash':meta.get('commit_hash'),'status':(d.get('latest_stage') or {}).get('status'),'created_on':d.get('created_on')},sort_keys=True))
          PY
          for route in 'https://deepsyq.pages.dev/my-creations.html' 'https://deepsyq.pages.dev/api/studio/workspace/cards?section=recent' 'https://deepsyq.app/my-creations.html' 'https://deepsyq.app/api/studio/workspace/cards?section=recent'; do
            status=$(curl -sS -L --connect-timeout 5 --max-time 14 -o /tmp/cf-route-content -w '%{http_code};%{content_type}' "$route") || status=network_error
            echo "UNAUTHENTICATED_ROUTE_STATUS=$route $status"
          done

      - name: Read latest Pages deployment and Worker runtime metadata without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          token="${TOKEN_1:-${TOKEN_2:-${TOKEN_3:-}}}"
          account="${ACCOUNT_1:-${ACCOUNT_2:-${ACCOUNT_3:-${ACCOUNT_4:-}}}}"
          if [[ -z "$token" || ! "$account" =~ ^[a-fA-F0-9]{32}$ ]]; then exit 0; fi
          echo "::add-mask::$token"
          for kind in project deployments; do
            if [[ "$kind" == project ]]; then url="https://api.cloudflare.com/client/v4/accounts/$account/pages/projects/deepsyq"; else url="https://api.cloudflare.com/client/v4/accounts/$account/pages/projects/deepsyq/deployments?per_page=1"; fi
            curl -sS --connect-timeout 5 --max-time 15 -H "Authorization: Bearer $token" "$url" -o "/tmp/cf-meta-$kind.json"
          done
          python3 - <<'PY'
          import json
          project=json.load(open('/tmp/cf-meta-project.json')).get('result') or {}
          deployment=(json.load(open('/tmp/cf-meta-deployments.json')).get('result') or [{}])[0]
          print('PROJECT_PUBLIC_CONFIG='+json.dumps({
            'production_branch':project.get('production_branch'),
            'source_type':(project.get('source') or {}).get('type'),
            'build_config':project.get('build_config'),
            'deployment_config_types':list((project.get('deployment_configs') or {}).keys()),
            'preview_env_keys':list((((project.get('deployment_configs') or {}).get('preview') or {}).get('env_vars') or {}).keys()),
            'production_env_keys':list((((project.get('deployment_configs') or {}).get('production') or {}).get('env_vars') or {}).keys())
          },default=str))
          print('DEPLOYMENT_METADATA='+json.dumps({
            'keys':list(deployment.keys()),
            'id':deployment.get('id'),
            'environment':deployment.get('environment'),
            'branch':((deployment.get('deployment_trigger') or {}).get('metadata') or {}).get('branch'),
            'manifest_key_count':len(deployment.get('manifest') or {}),
            'manifest_worker_present':any('_worker' in k for k in (deployment.get('manifest') or {}).keys()),
            'deployment_url':deployment.get('url'),
            'latest_stage':deployment.get('latest_stage')
          },default=str))
          PY
          id=$(python3 -c "import json;print((json.load(open('/tmp/cf-meta-deployments.json')).get('result') or [{}])[0].get('id') or '')")
          if [[ -n "$id" ]]; then
            code=$(curl -sS --connect-timeout 5 --max-time 15 -o /tmp/cf-deployment-detail.json -w '%{http_code}' -H "Authorization: Bearer $token" "https://api.cloudflare.com/client/v4/accounts/$account/pages/projects/deepsyq/deployments/$id") || code=network_error
            DEPLOYMENT_DETAIL_HTTP="$code" python3 - <<'PY'
          import json,os
          try:
            d=json.load(open('/tmp/cf-deployment-detail.json')).get('result') or {}
          except Exception:d={}
          print('DEPLOYMENT_DETAIL='+json.dumps({
            'http_status':os.environ['DEPLOYMENT_DETAIL_HTTP'],
            'keys':list(d.keys()),
            'manifest_keys':list((d.get('manifest') or {}).keys())[:20],
            'has_worker_keys':any('_worker' in k for k in (d.get('manifest') or {}).keys()),
            'environment':d.get('environment'),
            'url':d.get('url')
          }))
          PY
          fi
          for route in 'https://deepsyq.pages.dev/api/studio/workspace/cards?section=recent' 'https://deepsyq.pages.dev/api/studio/never-exists-check-XYZ' 'https://deepsyq.pages.dev/my-creations.html'; do
            status=$(curl -sS -L --connect-timeout 5 --max-time 10 -o /tmp/cf-http-body -w '%{http_code};%{content_type}' "$route") || status=network_error
            echo "UNAUTH_ROUTE=$route STATUS=$status"
            if [[ "$route" == *my-creations.html ]]; then
              if grep -q 'id="wsLoadMore"' /tmp/cf-http-body; then echo 'LIVE_PAGE_HAS_LOAD_MORE=true'; else echo 'LIVE_PAGE_HAS_LOAD_MORE=false'; fi
            fi
          done

      - name: Identify existing Pages Function runtime and repository-safe deployment path
        shell: bash
        run: |
          set -euo pipefail
          token="${TOKEN_1:-${TOKEN_2:-${TOKEN_3:-}}}"
          account="${ACCOUNT_1:-${ACCOUNT_2:-${ACCOUNT_3:-${ACCOUNT_4:-}}}}"
          if [[ -z "$token" || ! "$account" =~ ^[a-fA-F0-9]{32}$ ]]; then exit 0; fi
          echo "::add-mask::$token"
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/cf-deployment-detail.json')).get('result') or {}
          files=d.get('files') or {}
          paths=files.keys() if isinstance(files,dict) else [str(item.get('name') or item.get('path') or '') for item in files if isinstance(item,dict)]
          paths=list(paths)
          print('LATEST_PAGES_USES_FUNCTIONS='+str(d.get('uses_functions')).lower())
          print('LATEST_DEPLOYMENT_FILE_COUNT='+str(len(paths)))
          print('DEPLOYMENT_FILE_NAMES_SAMPLE='+str([p for p in paths if any(s in p.lower() for s in ['worker','functions','my-creations','wrangler'])][:20]))
          PY
          for name in pages-deepsyq deepsyq; do
            code=$(curl -sS --connect-timeout 5 --max-time 12 -H "Authorization: Bearer $token" -o "/tmp/cf-worker-$name" -w '%{http_code}' "https://api.cloudflare.com/client/v4/accounts/$account/workers/scripts/$name") || code=network_error
            bytes=$(wc -c < "/tmp/cf-worker-$name" 2>/dev/null || echo 0)
            echo "WORKER_SCRIPT_READ=$name HTTP=$code BYTES=$bytes"
          done

      - name: List existing Cloudflare Pages projects and declared TEST targets
        shell: bash
        run: |
          set -euo pipefail
          token="${TOKEN_1:-${TOKEN_2:-${TOKEN_3:-}}}"
          account="${ACCOUNT_1:-${ACCOUNT_2:-${ACCOUNT_3:-${ACCOUNT_4:-}}}}"
          if [[ -z "$token" || ! "$account" =~ ^[a-fA-F0-9]{32}$ ]]; then exit 0; fi
          echo "::add-mask::$token"
          code=$(curl -sS --connect-timeout 5 --max-time 20 -H "Authorization: Bearer $token" -o /tmp/cf-pages-all.json -w '%{http_code}' "https://api.cloudflare.com/client/v4/accounts/$account/pages/projects?per_page=100") || code=network_error
          PROJECTS_HTTP_STATUS="$code" python3 - <<'PY'
          import json,os
          try:
            data=json.load(open('/tmp/cf-pages-all.json'))
            items=data.get('result') or []
          except Exception:
            items=[]
          print('PROJECT_LIST_HTTP='+os.environ['PROJECTS_HTTP_STATUS'])
          print('PROJECT_LIST_COUNT='+str(len(items)))
          for p in items:
            print('PROJECT_SUMMARY='+json.dumps({
              'name':p.get('name'),
              'subdomain':p.get('subdomain'),
              'production_branch':p.get('production_branch'),
              'uses_functions':p.get('uses_functions'),
              'domains':p.get('domains'),
              'source_type':(p.get('source') or {}).get('type'),
              'latest_env':((p.get('latest_deployment') or {}).get('environment'))
            },sort_keys=True))
          PY

name: Jarvix New test-only Cloudflare preview
on:
  push:
    branches: [jarvis-new]
    paths: ['app/src/main/assets/deepsyq-unified-platform-header.js', 'app/src/main/assets/deepsyq-mobile-shell.js', 'app/src/main/assets/jarvix-download.html', 'app/src/main/assets/jarvix-connect.html', 'app/src/main/assets/connect.html', 'app/src/main/assets/jarvix-connect.js', 'app/src/main/assets/jarvix-new.html', 'app/src/main/assets/jarvix-new.js', 'app/src/main/assets/jarvix-new-preview-entry.js', 'app/src/main/assets/jarvix-new-voice.js', 'scripts/jarvix_new_paid_gateway.js', 'app/src/main/assets/jarvix-new-recorded-dialog.js', 'app/src/main/assets/jarvix-new-physical-audio-index.json', 'app/src/main/assets/jarvix-new-download-menu.js', 'scripts/prepare_jarvix_new_test_preview.py', 'scripts/jarvix_new_preview_worker.js', '.github/workflows/jarvis-new-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    if: github.ref == 'refs/heads/jarvis-new'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify syntax and preview credentials
        run: |
          node --check app/src/main/assets/deepsyq-unified-platform-header.js
          node --check app/src/main/assets/deepsyq-mobile-shell.js
          node --check app/src/main/assets/jarvix-connect.js
          node --check app/src/main/assets/jarvix-new.js
          node --check app/src/main/assets/jarvix-new-preview-entry.js
          node --check app/src/main/assets/jarvix-new-voice.js
          node --check app/src/main/assets/jarvix-new-recorded-dialog.js
          python -c "import json; d=json.load(open('app/src/main/assets/jarvix-new-physical-audio-index.json')); assert d['schema']=='jarvix-new-physical-audio-index/v1' and d['count']==len(d['paths'])==552 and len(set(d['paths']))==552"
          node --check app/src/main/assets/jarvix-new-download-menu.js
          node --check scripts/jarvix_new_preview_worker.js
          node --check scripts/jarvix_new_paid_gateway.js
          node --test tests/jarvix_new_paid_gateway.test.mjs
          python -m py_compile scripts/prepare_jarvix_new_test_preview.py
          test -f app/src/main/assets/jarvix-new.html
          test -f app/src/main/assets/jarvix-download.html
          grep -q 'owner-approved-1' app/src/main/assets/connect.html
          grep -q 'approvedConnection' app/src/main/assets/jarvix-connect.js
          grep -q 'jarvix-connect.js' scripts/jarvix_new_preview_worker.js
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/deepsyq" -o /tmp/pages-project.json
          jq -e '.success == true and .result.name == "deepsyq" and .result.production_branch != "jarvis-new"' /tmp/pages-project.json >/dev/null
      - name: Isolate static preview (block all /api and production Worker)
        run: |
          mkdir -p /tmp/jarvix-new-preview
          rsync -a --exclude='_worker.js' app/src/main/assets/ /tmp/jarvix-new-preview/
          # Only the isolated TEST output is changed. The repo and production
          # source HTML continue to use the original JARVIX.
          python scripts/prepare_jarvix_new_test_preview.py /tmp/jarvix-new-preview
          ! grep -q '<script type="module" src="jarvis-core.js"></script>' /tmp/jarvix-new-preview/index.html
          grep -q 'jarvix-new-preview-entry.js' /tmp/jarvix-new-preview/index.html
          test ! -f /tmp/jarvix-new-preview/jarvix-new.html
          grep -q 'jarvix-new-download-menu.js' /tmp/jarvix-new-preview/index.html
          grep -q 'installJarvixNewVoice' /tmp/jarvix-new-preview/jarvix-new-preview-entry.js
          test -s /tmp/jarvix-new-preview/jarvix-new-voice.js
          test -s /tmp/jarvix-new-preview/jarvix-new-recorded-dialog.js
          test -s /tmp/jarvix-new-preview/jarvix-new-physical-audio-index.json
          ! grep -q 'SpeechSynthesisUtterance' /tmp/jarvix-new-preview/jarvix-new-voice.js
          test ! -f /tmp/jarvix-new-preview/jarvix-download.html
          cp scripts/jarvix_new_paid_gateway.js /tmp/jarvix-new-preview/jarvix-new-paid-gateway.js
          cp scripts/jarvix_new_preview_worker.js /tmp/jarvix-new-preview/_worker.js
          test -s /tmp/jarvix-new-preview/jarvix-new-paid-gateway.js
          printf 'User-agent: *\nDisallow: /\n' >/tmp/jarvix-new-preview/robots.txt
      - name: Deploy ONLY to preview branch
        run: npx --yes wrangler@4.48.0 pages deploy /tmp/jarvix-new-preview --project-name deepsyq --branch jarvis-new --commit-hash "$GITHUB_SHA"

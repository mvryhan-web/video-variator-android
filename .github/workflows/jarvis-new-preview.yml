name: Jarvix New test-only Cloudflare preview
on:
  push:
    branches: [jarvis-new]
    paths: ['app/src/main/assets/deepsyq-unified-platform-header.js', 'app/src/main/assets/deepsyq-mobile-shell.js', 'app/src/main/assets/jarvix-download.html', 'app/src/main/assets/jarvix-connect.html', 'app/src/main/assets/connect.html', 'app/src/main/assets/jarvix-connect.js', 'app/src/main/assets/jarvix-new.html', 'app/src/main/assets/jarvix-new.js', 'app/src/main/assets/jarvix-new-preview-entry.js', 'app/src/main/assets/jarvix-new-voice.js', 'scripts/jarvix_new_paid_gateway.js', 'tests/jarvix_new_paid_gateway.test.mjs', 'app/src/main/assets/jarvix-new-recorded-dialog.js', 'app/src/main/assets/jarvix-new-smalltalk.js', 'app/src/main/assets/media/jarvix/conversation/**', 'tests/jarvix_new_smalltalk.test.mjs', 'tests/jarvix_new_mobile_voice.test.mjs', 'app/src/main/assets/jarvix-new-physical-audio-index.json', 'app/src/main/assets/jarvix-new-download-menu.js', 'scripts/prepare_jarvix_new_test_preview.py', 'scripts/jarvix_new_preview_worker.js', '.github/workflows/jarvis-new-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    if: github.ref == 'refs/heads/jarvis-new'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify syntax and preview credentials
        run: |
          node --check app/src/main/assets/deepsyq-unified-platform-header.js
          node --check app/src/main/assets/deepsyq-mobile-shell.js
          node --check app/src/main/assets/jarvix-connect.js
          node --check app/src/main/assets/jarvix-new.js
          node --check app/src/main/assets/jarvix-new-preview-entry.js
          node --check app/src/main/assets/jarvix-new-voice.js
          node --check app/src/main/assets/jarvix-new-recorded-dialog.js
          node --check app/src/main/assets/jarvix-new-smalltalk.js
          node --test tests/jarvix_new_smalltalk.test.mjs
          node --test tests/jarvix_new_mobile_voice.test.mjs
          python -c "import json; d=json.load(open('app/src/main/assets/jarvix-new-physical-audio-index.json')); assert d['schema']=='jarvix-new-physical-audio-index/v1' and d['count']==len(d['paths'])==552 and len(set(d['paths']))==552"
          node --check app/src/main/assets/jarvix-new-download-menu.js
          node --check scripts/jarvix_new_preview_worker.js
          node --check scripts/jarvix_new_paid_gateway.js
          node --test tests/jarvix_new_paid_gateway.test.mjs
          python -m py_compile scripts/prepare_jarvix_new_test_preview.py
          test -f app/src/main/assets/jarvix-new.html
          test -f app/src/main/assets/jarvix-download.html
          grep -q 'owner-approved-1' app/src/main/assets/connect.html
          grep -q 'approvedConnection' app/src/main/assets/jarvix-connect.js
          grep -q 'jarvix-connect.js' scripts/jarvix_new_preview_worker.js
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/deepsyq" -o /tmp/pages-project.json
          jq -e '.success == true and .result.name == "deepsyq" and .result.production_branch != "jarvis-new"' /tmp/pages-project.json >/dev/null
      - name: Isolate static preview (block all /api and production Worker)
        run: |
          mkdir -p /tmp/jarvix-new-preview
          rsync -a --exclude='_worker.js' app/src/main/assets/ /tmp/jarvix-new-preview/
          # Only the isolated TEST output is changed. The repo and production
          # source HTML continue to use the original JARVIX.
          python scripts/prepare_jarvix_new_test_preview.py /tmp/jarvix-new-preview
          ! grep -q '<script type="module" src="jarvis-core.js"></script>' /tmp/jarvix-new-preview/index.html
          grep -q 'jarvix-new-preview-entry.js' /tmp/jarvix-new-preview/index.html
          test ! -f /tmp/jarvix-new-preview/jarvix-new.html
          grep -q 'jarvix-new-download-menu.js' /tmp/jarvix-new-preview/index.html
          grep -q 'installJarvixNewVoice' /tmp/jarvix-new-preview/jarvix-new-preview-entry.js
          test -s /tmp/jarvix-new-preview/jarvix-new-voice.js
          grep -q 'jv-new-mic-chip' /tmp/jarvix-new-preview/jarvix-new-voice.js
          test -s /tmp/jarvix-new-preview/jarvix-new-recorded-dialog.js
          test -s /tmp/jarvix-new-preview/jarvix-new-smalltalk.js
          # Source-derived short greetings must physically exist on TEST
          # before this revised voice frontend can be published.
          python - <<'PY'
          import json,pathlib,hashlib
          d=pathlib.Path('/tmp/jarvix-new-preview/media/jarvix/conversation')
          j=json.loads((d/'manifest.json').read_text(encoding='utf-8'))
          assert j.get('schema')=='jarvix-new-short-voice-v1'
          for lang in ('ru','en','fr','es'):
              for purpose in ('hello','prompt'):
                  name=purpose+'_'+lang+'.mp3'
                  row=next(x for x in j['clips'] if x['filename']==name)
                  file=d/name
                  assert file.stat().st_size>2800
                  assert hashlib.sha256(file.read_bytes()).hexdigest()==row['sha256']
                  assert row['previewOnly'] is True
          print('Eight short owner voice MP3 verified: 4 languages, physical bytes, SHA256.')
          PY
          test -s /tmp/jarvix-new-preview/jarvix-new-physical-audio-index.json
          ! grep -q 'SpeechSynthesisUtterance' /tmp/jarvix-new-preview/jarvix-new-voice.js
          test ! -f /tmp/jarvix-new-preview/jarvix-download.html
          cp scripts/jarvix_new_paid_gateway.js /tmp/jarvix-new-preview/jarvix-new-paid-gateway.js
          cp scripts/jarvix_new_preview_worker.js /tmp/jarvix-new-preview/_worker.js
          test -s /tmp/jarvix-new-preview/jarvix-new-paid-gateway.js
          printf 'User-agent: *\nDisallow: /\n' >/tmp/jarvix-new-preview/robots.txt
      - name: Deploy ONLY to preview branch
        run: npx --yes wrangler@4.48.0 pages deploy /tmp/jarvix-new-preview --project-name deepsyq --branch jarvis-new --commit-hash "$GITHUB_SHA"
      - name: Public TEST smoke — paid gateway is present without touching production
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 3 --retry-connrefused             'https://jarvis-new.deepsyq.pages.dev/api/jarvix-new/paid/status'             -o /tmp/jarvix-paid-status.json
          jq -e '.ok == true and (.enabled | type) == "boolean" and (.mode == "free-prerecorded" or .mode == "paid-owner-voice")'             /tmp/jarvix-paid-status.json >/dev/null
          # Never call /turn; this smoke check has zero billable operations.
          echo 'JARVIX NEW TEST paid configuration API responds without calling AI or billing'
      - name: Public TEST smoke — 8 owner-voice MP3 actually downloadable over HTTPS
        run: |
          set -euo pipefail
          base='https://jarvis-new.deepsyq.pages.dev/media/jarvix/conversation/'
          mkdir -p /tmp/jarvix-live-clips
          curl -fsSL --retry 2 --retry-delay 2 -A 'Mozilla/5.0 (compatible; JarvixTest/1.0)' \
               -H 'Accept: application/json' "$base"manifest.json \
               -o /tmp/jarvix-live-clips/manifest.json
          for lang in ru en fr es; do
            for purpose in hello prompt; do
              file="$purpose"_"$lang".mp3
              curl -fsSL --retry 2 --retry-delay 2 -A 'Mozilla/5.0 (compatible; JarvixTest/1.0)' \
                   -H 'Accept: audio/mpeg' "$base$file" \
                   -o "/tmp/jarvix-live-clips/$file"
            done
          done
          curl -fsSL -A 'Mozilla/5.0 (compatible; JarvixTest/1.0)' \
              'https://jarvis-new.deepsyq.pages.dev/jarvix-new-voice.js' \
              -o /tmp/jarvix-live-clips/jarvix-new-voice.js
          python - <<'PY'
          import hashlib,json,pathlib
          directory=pathlib.Path('/tmp/jarvix-live-clips')
          j=json.loads((directory/'manifest.json').read_text(encoding='utf-8'))
          assert j['schema']=='jarvix-new-short-voice-v1'
          for lang in ('ru','en','fr','es'):
              for purpose in ('hello','prompt'):
                  name=purpose+'_'+lang+'.mp3'
                  row=next(x for x in j['clips'] if x['filename']==name)
                  audio=(directory/name).read_bytes()
                  assert len(audio)>2800,name
                  assert hashlib.sha256(audio).hexdigest()==row['sha256'],name
                  assert audio[:3]==b'ID3' or audio[:2] in (bytes.fromhex('fffb'),bytes.fromhex('fff3'))
                  print('Verified publicly downloaded:',name,len(audio))
          script=(directory/'jarvix-new-voice.js').read_text(encoding='utf-8')
          assert "from './jarvix-new-smalltalk.js'" in script
          assert 'recordingsText()' not in script
          print('Public TEST: 8 original MP3 and cleaned voice JS verified.')
          PY

name: Owner production source provenance read-only
on:
  pull_request:
    paths:
      - '.github/workflows/owner-prod-chat-provenance.yml'
permissions:
  contents: read
jobs:
  identify-current-production:
    if: github.head_ref == 'owner-prod-chat-provenance-20261109' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect canonical Pages deployment provenance without mutations
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/deepsyq" > /tmp/pages-project.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const d=JSON.parse(fs.readFileSync('/tmp/pages-project.json','utf8'));
          if(!d.success||d.result?.production_branch!=='deepsyq-platform')throw Error('Unexpected production');
          const p=d.result.canonical_deployment;
          console.log('PROJECT_PRODUCTION',JSON.stringify({branch:d.result.production_branch,primaryDomain:d.result.domains?.map(x=>x.name||x),canonical:{id:p?.id,url:p?.url,commit:p?.deployment_trigger?.metadata?.commit_hash,branch:p?.deployment_trigger?.metadata?.branch}}));
          if(!p?.id)throw Error('No canonical deployment');
          fs.appendFileSync(process.env.GITHUB_ENV,'DEPLOYMENT_ID='+p.id+'\n');
          JS
          DEPLOYMENT_ID=$(node -e "const p=require('/tmp/pages-project.json');process.stdout.write(p.result.canonical_deployment.id)")
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/deepsyq/deployments/$DEPLOYMENT_ID" > /tmp/pages-deployment.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const d=JSON.parse(fs.readFileSync('/tmp/pages-deployment.json','utf8'));
          if(!d.success)throw Error('Cloudflare deployment not returned');
          const x=d.result;
          console.log('DEPLOYMENT_FIELDS',JSON.stringify({keys:Object.keys(x||{}),deployment_trigger:x?.deployment_trigger,source:x?.source,manifest_kind:typeof x?.manifest,manifest_entry_count:typeof x?.manifest==='object'?Object.keys(x.manifest).length:null,file_kind:Array.isArray(x?.files)?'array':typeof x?.files,file_count:Array.isArray(x?.files)?x.files.length:Object.keys(x?.files||{}).length,files_sample:Array.isArray(x?.files)?x.files.slice(0,5):Object.entries(x?.files||{}).slice(0,5),files_target:x?.files?.['/jarvix-composer-design.js']||x?.files?.['jarvix-composer-design.js']||null,uses_functions:x?.uses_functions,special_files:Object.keys(x?.files||{}).filter(k=>/(worker|_routes|_headers|_redirects|functions)/i.test(k)).slice(0,30),metadataKeys:Object.keys(x?.metadata||{}),build_config_keys:Object.keys(x?.build_config||{})}));
          JS
      - name: Compare live production files vs current DEV using Node fetch (READ ONLY)
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const paths=['jarvix-composer-design.js','jarvix-chat.css','jarvix-chat.js','deepsyq.html','generate-studio.html','generate-studio.js','generate-studio.css','pricing.html','pricing-page.js','pricing-page.css','deepsyq-site-shell.js','deepsyq-mobile-shell.js','deepsyq-mobile-shell.css','jarvis-core.js','studio-composer-popovers.js','studio-composer-popovers.css','jarvix-action-design.css','index.html'];
          const hash=b=>createHash('sha256').update(b).digest('hex').slice(0,12);
          let changed=[],unreadable=[];
          for(const path of paths){
            try{
              const source=await fs.readFile('app/src/main/assets/'+path);
              const response=await fetch('https://deepsyq.app/'+path+'?source_audit='+Date.now(),{signal:AbortSignal.timeout(12000),headers:{'Cache-Control':'no-cache'}});
              const live=Buffer.from(await response.arrayBuffer()),mime=response.headers.get('content-type')||'';
              const valid=response.ok && (path.endsWith('.js')?mime.includes('javascript'):path.endsWith('.css')?mime.includes('css'):mime.includes('html'));
              const same=valid&&hash(source)===hash(live);
              if(!same)changed.push(path);if(!valid)unreadable.push(path);
              console.log('LIVE_FILE',JSON.stringify({path,status:response.status,mime,liveBytes:live.length,gitBytes:source.length,gitSha:hash(source),liveSha:hash(live),same,chatExtra: path==='jarvix-composer-design.js'? (live.toString('utf8').match(/Video Uniquifier/g)||[]).length:null}));
            }catch(e){unreadable.push(path);changed.push(path);console.log('ERROR_READING',path,String(e));}
          }
          console.log('SOURCE_AUDIT_SUMMARY',JSON.stringify({total:paths.length,changed,unreadable,allIdentical:changed.length===0,readOnly:true}));
          JS
      - name: Validate Pages asset hash algorithm on EXISTING production file (READ ONLY)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet blake3 --break-system-packages
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const prod=JSON.parse(fs.readFileSync('/tmp/pages-deployment.json','utf8')).result;
          const url=(prod.url||'https://deepsyq.app')+'/jarvix-composer-design.js';
          const response=await fetch(url,{signal:AbortSignal.timeout(12000)});
          if(!response.ok)throw Error('Could not fetch immutable production asset '+response.status);
          fs.writeFileSync('/tmp/actual-live-composer.js',Buffer.from(await response.arrayBuffer()));
          console.log('EXPECTED_PAGES_ASSET_HASH',prod.files['/jarvix-composer-design.js']);
          JS
          python3 - <<'PY'
          import base64
          from blake3 import blake3
          from pathlib import Path
          import json
          d=Path('/tmp/actual-live-composer.js').read_bytes()
          info=json.loads(Path('/tmp/pages-deployment.json').read_text())['result']
          expected=info['files']['/jarvix-composer-design.js']
          formulas={
            'raw_plus_js':blake3(d+b'js').hexdigest()[:32],
            'base64_plus_js':blake3(base64.b64encode(d)+b'js').hexdigest()[:32],
            'raw':blake3(d).hexdigest()[:32],
            'base64':blake3(base64.b64encode(d)).hexdigest()[:32]
          }
          print('PAGES_HASH_PROVENANCE',json.dumps({'expected':expected,'formulas':formulas,'match':[name for name,h in formulas.items() if h==expected]}))
          if expected not in formulas.values():raise SystemExit('Cannot verify exact Cloudflare Pages hashing; BLOCK safe release')
          PY
      - name: Probe EXISTING production Pages Worker readable source, read-only, never print source
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('/tmp/pages-project.json','utf8')).result;
          console.log('PAGES_WORKER_METADATA',JSON.stringify({production_script_name:p.production_script_name,preview_script_name:p.preview_script_name,uses_functions:p.uses_functions}));
          const name=p.production_script_name;
          if(!name)throw Error('No production Worker script name from Pages project');
          const base='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/'+encodeURIComponent(name);
          const headers={Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN};
          for(const suffix of ['/content/v2','']){
            try{
              const r=await fetch(base+suffix,{headers,signal:AbortSignal.timeout(15000)});
              const b=Buffer.from(await r.arrayBuffer());
              console.log('PRODUCTION_WORKER_READ_PROBE',JSON.stringify({suffix,status:r.status,mime:r.headers.get('content-type'),size:b.length,readable:r.ok}));
              if(r.ok){
                fs.writeFileSync('/tmp/production-pages-worker-'+(suffix? 'v2':'raw')+'.bin',b,{mode:0o600});
              }
            }catch(e){console.log('PRODUCTION_WORKER_READ_PROBE',JSON.stringify({suffix,error:String(e)}));}
          }
          JS

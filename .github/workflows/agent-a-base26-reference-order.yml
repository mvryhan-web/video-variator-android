name: Agent A39 BASE26 real Canvas reference order to Studio

on:
  pull_request:
    branches: [deepsyq-platform]
    paths:
      - 'app/src/main/assets/canvas-editor.js'
      - 'app/src/main/assets/canvas-page.css'
      - 'tests/agent-a-base26-reference-order.spec.mjs'
      - '.github/workflows/agent-a-base26-reference-order.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a39-canvas-order-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-reference-order-and-local-studio-handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      HOME: /root
      DATABASE_URL: ''
      STRIPE_SECRET_KEY: ''
      GOOGLE_API_KEY: ''
      GEMINI_API_KEY: ''
      BYTEPLUS_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate actual Canvas source and no-spend browser test syntax
        run: node --check app/src/main/assets/canvas-editor.js && node --check tests/agent-a-base26-reference-order.spec.mjs
      - name: Real accessible image reorder and exact media handoff in five native engines
        run: npx playwright test tests/agent-a-base26-reference-order.spec.mjs --project=chromium --project=firefox --project=webkit --project=mobile-chromium --project=mobile-webkit --workers=2 --retries=0
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: a39-canvas-order-failure
          path: test-results/
          retention-days: 7

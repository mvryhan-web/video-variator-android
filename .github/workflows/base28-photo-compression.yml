name: BASE 28 local photo compression

on:
  pull_request:
    paths:
      - 'app/src/main/assets/mobile-utility.js'
      - 'app/src/main/assets/mobile-utility-links.js'
      - 'tests/base28-photo-compression.spec.mjs'
      - 'tests/base28-unique-utility-tiles.spec.mjs'
      - '.github/workflows/base28-photo-compression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  photo-compress-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --check app/src/main/assets/mobile-utility.js && node --check app/src/main/assets/mobile-utility-links.js && node --check tests/base28-photo-compression.spec.mjs && node --check tests/base28-unique-utility-tiles.spec.mjs
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test tests/base28-photo-compression.spec.mjs tests/base28-unique-utility-tiles.spec.mjs --project=chromium --project=webkit --project=mobile-chromium --project=mobile-webkit

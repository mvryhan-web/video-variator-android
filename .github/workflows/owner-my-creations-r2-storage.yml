name: Owner My Creations eight originals to permanent R2
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deepsyq-r2-my-creations-eight-originals
  cancel-in-progress: false
jobs:
  upload-exact-eight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_JURISDICTION: ${{ vars.CLOUDFLARE_R2_JURISDICTION || 'default' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deepsyq-platform
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Cloudflare R2 S3 client
        run: python -m pip install --disable-pip-version-check "boto3==1.35.99"
      - name: Check uploader syntax before any network access
        run: python -m py_compile scripts/upload_my_creations_r2.py
      - name: Upload and read-back verify exactly eight images (never overwrite)
        run: python scripts/upload_my_creations_r2.py

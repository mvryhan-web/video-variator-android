name: Owner Account + Video Uniquifier MAIN provenance preflight
on:
  push:
    branches: [owner-account-main-preflight-20261110]
    paths: ['.github/workflows/owner-account-main-preflight-20261110.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Inspect verified Pages MAIN, asset consistency and Worker
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import fs from 'node:fs';
          const token=process.env.CF_TOKEN,account=process.env.CF_ACCOUNT;
          assert(token&&/^[0-9a-f]{32}$/.test(account||''),'Missing Cloudflare credentials');
          const api='https://api.cloudflare.com/client/v4/accounts/'+account;
          const headers={Authorization:'Bearer '+token};
          const pRes=await fetch(api+'/pages/projects/deepsyq',{headers,signal:AbortSignal.timeout(20000)});
          assert.equal(pRes.status,200);
          const p=(await pRes.json()).result,d=p.canonical_deployment;
          assert(p.name==='deepsyq'&&p.production_branch==='deepsyq-platform'&&d?.uses_functions===true);
          const sha=d.deployment_trigger?.metadata?.commit_hash;
          console.log('PROD_STATE',JSON.stringify({id:d.id,sha,dirty:d.deployment_trigger?.metadata?.commit_dirty,worker:p.production_script_name,functions:d.uses_functions,trigger:d.deployment_trigger?.type}));
          assert(/^[0-9a-f]{40}$/.test(sha||''),'No actual production source SHA');
          execFileSync('git',['cat-file','-e',sha+'^{commit}']);
          const paths=['deepsyq-site-shell.js','deepsyq-mobile-shell.js','deepsyq-unified-platform-header.js','deepsyq.js','video-uniquifier.html'];
          const sha256=x=>createHash('sha256').update(x).digest('hex');
          for(const name of paths){
            const file='app/src/main/assets/'+name;
            const source=execFileSync('git',['show',sha+':'+file]);
            const res=await fetch('https://deepsyq.app/'+name+'?navSourceAudit='+Date.now(),{headers:{'cache-control':'no-cache'},signal:AbortSignal.timeout(20000)});
            const live=Buffer.from(await res.arrayBuffer());
            console.log('PROD_FILE',JSON.stringify({name,http:res.status,liveMatchesCommit:sha256(live)===sha256(source),gitSha:sha256(source),liveSha:sha256(live),bytes:live.length}));
          }
          const cfg=await fetch('https://deepsyq.app/api/config',{signal:AbortSignal.timeout(20000)});
          console.log('PROD_API',cfg.status,cfg.headers.get('content-type'));
          const productionConfig=p.deployment_configs?.production||{};
          console.log('PROD_BINDING_NAMES',JSON.stringify({env:Object.keys(productionConfig.env_vars||{}),r2:Object.keys(productionConfig.r2_buckets||{})}));
          const w=await fetch(api+'/workers/scripts/'+encodeURIComponent(p.production_script_name)+'/settings',{headers,signal:AbortSignal.timeout(20000)});
          console.log('PROD_WORKER_SETTINGS_HTTP',w.status);
          const currentWorker=execFileSync('git',['rev-parse',sha+':app/src/main/assets/_worker.js'],{encoding:'utf8'}).trim();
          const dev=execFileSync('git',['rev-parse','origin/deepsyq-platform'],{encoding:'utf8'}).trim();
          const devWorker=execFileSync('git',['rev-parse',dev+':app/src/main/assets/_worker.js'],{encoding:'utf8'}).trim();
          console.log('WORKER_COMPARISON',JSON.stringify({prod:currentWorker,dev:devWorker,unchanged:currentWorker===devWorker,dev}));
          JS
      - name: Check exact live Account route and Video Uniquifier sidebar against DEV
        shell: bash
        run: |
          git fetch --no-tags origin deepsyq-platform
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          const hash=s=>createHash('sha256').update(s).digest('hex');
          const files=['deepsyq-site-shell.js','deepsyq-mobile-shell.js','deepsyq-unified-platform-header.js','deepsyq.js'];
          for(const name of files){
            const gitPath='app/src/main/assets/'+name;
            const latest=execFileSync('git',['show','FETCH_HEAD:'+gitPath]);
            const liveResp=await fetch('https://deepsyq.app/'+name+'?accountCheck='+Date.now(),{headers:{'cache-control':'no-cache'}});
            const live=await liveResp.text();
            const matches=live.split(/\r?\n/).filter(s=>
              s.includes('index.html?view=profile') ||
              s.includes('video-uniquifier.html?view=profile') ||
              s.includes("url:'index.html'") ||
              s.includes("url:'video-uniquifier.html'") ||
              (s.includes('topLogin')&&s.includes('addEventListener')) ||
              (s.includes('topLogin')&&s.includes('onclick'))
            ).slice(0,10);
            console.log('ASSET_PARITY',JSON.stringify({name,remoteStatus:liveResp.status,gitMatchesLive:hash(latest)===hash(live),gitHash:hash(latest),liveHash:hash(live),sourceBytes:latest.length,liveBytes:Buffer.byteLength(live),matches}));
          }
          JS
      - name: Find verified Git provenance of current dirty live JS without writes
        shell: bash
        run: |
          git fetch --no-tags origin 'refs/heads/*:refs/remotes/origin/*'
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          const sha256=b=>createHash('sha256').update(b).digest('hex');
          const names=['deepsyq-site-shell.js','deepsyq-mobile-shell.js','deepsyq-unified-platform-header.js','deepsyq.js','video-uniquifier.html'];
          for(const name of names){
            const path='app/src/main/assets/'+name;
            const r=await fetch('https://deepsyq.app/'+name+'?srcMatch='+Date.now(),{headers:{'cache-control':'no-cache'},signal:AbortSignal.timeout(20000)});
            if(!r.ok){console.log('HISTORIC_BLOB_MATCH',JSON.stringify({name,http:r.status}));continue;}
            const hash=sha256(Buffer.from(await r.arrayBuffer()));
            const commits=execFileSync('git',['log','--all','--format=%H','--',path],{encoding:'utf8',maxBuffer:1024*1024*6}).trim().split(/\n/).filter(Boolean);
            const seen=new Set(),found=[];
            for(const c of commits.slice(0,500)){
              let blob;try{blob=execFileSync('git',['rev-parse',c+':'+path],{encoding:'utf8'}).trim()}catch{continue}
              if(seen.has(blob))continue;seen.add(blob);
              let bytes;try{bytes=execFileSync('git',['cat-file','blob',blob],{maxBuffer:1024*1024*10})}catch{continue}
              if(sha256(bytes)===hash)found.push({blob,commit:c});
              if(found.length>=3)break;
            }
            console.log('HISTORIC_BLOB_MATCH',JSON.stringify({name,liveSha:hash,searched:seen.size,matched:found}));
          }
          JS
      - name: Compare preview and MAIN HTML without writes
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {createHash} from 'node:crypto';
          const digest=s=>createHash('sha256').update(s).digest('hex');
          for(const name of ['pricing.html','deepsyq.html','index.html','jarvix-chat.html','free-tools.html','video-uniquifier.html','pricing-page.css']){
            const query='?verifyOwner='+Date.now();
            const [a,b]=await Promise.all(['https://deepsyq.app/','https://owner-account-navsafe-202611.deepsyq.pages.dev/'].map(async base=>{
              const r=await fetch(base+name+query,{headers:{'cache-control':'no-cache'},signal:AbortSignal.timeout(17000)});
              return {status:r.status,url:r.url,body:await r.text(),type:r.headers.get('content-type')};
            }));
            let i=0;while(i<a.body.length&&i<b.body.length&&a.body[i]===b.body[i])i++;
            const same=a.body===b.body;
            console.log('LIVE_PREVIEW_DIFF',JSON.stringify({name,prodStatus:a.status,previewStatus:b.status,prodBytes:a.body.length,previewBytes:b.body.length,match:same,firstDiff:i,prodHash:digest(a.body),previewHash:digest(b.body),prodAround:same?'':a.body.slice(Math.max(0,i-80),i+120),previewAround:same?'':b.body.slice(Math.max(0,i-80),i+120)}));
          }
          JS

name: Owner My Creations R2 permanent storage capability (read only)
on:
  push:
    branches: [deepsyq-platform]
    paths:
      - '.github/workflows/owner-r2-creations-bucket-probe-20261110.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      CF_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CF_R2_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
      R2_TOKEN: ${{ secrets.R2_API_TOKEN }}
      R2_BUCKET: ${{ vars.R2_BUCKET || secrets.R2_BUCKET }}
    steps:
      - name: Inspect R2 bucket, public domains, and object permissions without writing anything
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const token=process.env.CF_API_TOKEN,acct=process.env.CF_ACCOUNT_ID;
          if(!token || !acct)throw Error('GitHub Cloudflare credentials not configured');
          const base='https://api.cloudflare.com/client/v4/accounts/'+encodeURIComponent(acct)+'/r2/buckets';
          async function check(label,u){
            try{
              const r=await fetch(u,{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(13000)});
              const data=await r.json().catch(()=>({}));
              const result=data.result;
              const summary={label,status:r.status,success:data.success===true,errorCodes:(data.errors||[]).map(x=>x.code)};
              if(label==='buckets'&&summary.success)summary.names=Array.isArray(result?.buckets)?result.buckets.map(x=>x.name):Array.isArray(result)?result.map(x=>x.name):[];
              if(label==='bucket'&&summary.success)summary.bucket={name:result?.name,jurisdiction:result?.jurisdiction,publicDevUrlEnabled:result?.publicDevUrlEnabled};
              if(label==='domains'&&summary.success)summary.domains=(result?.domains||[]).map(x=>({domain:x.domain,enabled:x.enabled,ssl:x.status?.ssl,ownership:x.status?.ownership}));
              if(label==='objects'&&summary.success)summary.keys=(result?.objects||result?.result||[]).slice(0,15).map(x=>x.key);
              console.log('R2_CREATIONS_STORAGE_PROBE',JSON.stringify(summary));
            }catch(e){console.log('R2_CREATIONS_STORAGE_PROBE',JSON.stringify({label,error:String(e).slice(0,130)}))}
          }
          await check('buckets',base);
          await check('bucket',base+'/deepsyq-media');
          await check('domains',base+'/deepsyq-media/domains/custom');
          await check('objects',base+'/deepsyq-media/objects?prefix=my-creations/showcase/');
          const names=['R2_ACCESS_KEY_ID','R2_SECRET_ACCESS_KEY','CF_R2_ACCESS_KEY_ID','CF_R2_SECRET_ACCESS_KEY','CF_R2_TOKEN','R2_TOKEN','R2_BUCKET'];
          console.log('R2_CREATIONS_CREDENTIAL_PRESENCE',JSON.stringify(Object.fromEntries(names.map(n=>[n,Boolean(process.env[n])]))));
          try{
            const u='https://api.cloudflare.com/client/v4/accounts/'+encodeURIComponent(acct)+'/pages/projects/deepsyq';
            const response=await fetch(u,{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(13000)});
            const body=await response.json().catch(()=>({}));
            const prod=body.result?.deployment_configs?.production||{};
            const bindings=prod.r2_buckets||{};
            console.log('R2_CREATIONS_PAGES_BINDINGS',JSON.stringify({http:response.status,configured:Object.keys(bindings),mapped:Object.entries(bindings).map(([key,value])=>({key,bucket_name:value?.name||value?.bucket_name||null}))}));
          }catch(err){console.log('R2_CREATIONS_PAGES_BINDINGS',JSON.stringify({error:String(err).slice(0,150)}))}
          for(const [label,secret] of [['CLOUDFLARE_R2_API_TOKEN',process.env.CF_R2_TOKEN],['R2_API_TOKEN',process.env.R2_TOKEN]]){
            if(!secret)continue;
            try{
              const r=await fetch(base,{headers:{Authorization:'Bearer '+secret},signal:AbortSignal.timeout(13000)});
              const body=await r.json().catch(()=>({}));
              console.log('R2_CREATIONS_ALT_TOKEN_CHECK',JSON.stringify({label,status:r.status,success:body.success===true,errors:(body.errors||[]).map(e=>e.code),buckets:(body.result?.buckets||[]).map(x=>x.name)}));
            }catch(err){console.log('R2_CREATIONS_ALT_TOKEN_CHECK',JSON.stringify({label,error:String(err).slice(0,160)}))}
          }
          console.log('READ_ONLY_NO_CHANGES',true);
          JS

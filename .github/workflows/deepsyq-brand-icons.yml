name: Deepsyq official brand icon QA
on:
  pull_request:
    paths:
      - 'app/src/main/assets/deepsyq.html'
      - 'app/src/main/assets/deepsyq.css'
      - 'app/src/main/assets/deepsyq*png'
      - 'app/src/main/assets/deepsyq.webmanifest'
      - 'app/src/main/assets/favicon.ico'
      - 'app/src/main/res/drawable/deepsyq_adaptive_foreground.png'
      - 'app/src/main/res/mipmap-anydpi-v26/ic_launcher*.xml'
      - 'tests/deepsyq-brand-identity.spec.mjs'
      - '.github/workflows/deepsyq-brand-icons.yml'
  workflow_dispatch:
jobs:
  verify-exact-master:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm exact owner logo and separate install identity
        run: node --test tests/deepsyq-brand-identity.spec.mjs
  android-resource-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android compile SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build Android debug APK with brand icon
        run: bash ./gradlew :app:assembleDebug --no-daemon

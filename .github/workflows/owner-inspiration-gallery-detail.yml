name: Owner Home Inspiration inline tabs and video detail (no spend)
on:
  pull_request:
    branches: [deepsyq-platform]
    paths:
      - 'app/src/main/assets/deepsyq.html'
      - 'app/src/main/assets/deepsyq.js'
      - 'app/src/main/assets/home-inspiration-inline.css'
      - 'app/src/main/assets/inspiration.html'
      - 'app/src/main/assets/deepsyq-site-shell.js'
      - 'tests/owner-inspiration-gallery-detail.spec.mjs'
      - '.github/workflows/owner-inspiration-gallery-detail.yml'
  push:
    branches: [deepsyq-platform]
    paths:
      - 'app/src/main/assets/deepsyq.html'
      - 'app/src/main/assets/deepsyq.js'
      - 'app/src/main/assets/home-inspiration-inline.css'
      - 'app/src/main/assets/inspiration.html'
      - 'app/src/main/assets/deepsyq-site-shell.js'
      - 'tests/owner-inspiration-gallery-detail.spec.mjs'
      - '.github/workflows/owner-inspiration-gallery-detail.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspiration-gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ''
      STRIPE_SECRET_KEY: ''
      GOOGLE_API_KEY: ''
      BYTEPLUS_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --check app/src/main/assets/deepsyq.js
      - run: node --check tests/owner-inspiration-gallery-detail.spec.mjs
      - run: npx playwright install --with-deps chromium webkit
      - name: Test Home media tabs, original prompt, overlay, legacy route, mobile and no fee
        run: npx playwright test tests/owner-inspiration-gallery-detail.spec.mjs --project=chromium --project=mobile-webkit --workers=2
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: owner-inspiration-gallery-detail-failure
          path: test-results/
          if-no-files-found: ignore

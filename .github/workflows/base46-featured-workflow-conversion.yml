name: BASE 46 featured workflow conversion

on:
  pull_request:
    paths:
      - 'app/src/main/assets/deepsyq.js'
      - 'tests/agent-a-base46-featured-template-link.spec.mjs'
      - '.github/workflows/base46-featured-workflow-conversion.yml'
  push:
    branches: [deepsyq-platform]
    paths:
      - 'app/src/main/assets/deepsyq.js'
      - 'tests/agent-a-base46-featured-template-link.spec.mjs'
      - '.github/workflows/base46-featured-workflow-conversion.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: base46-conversion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-deep-link:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: |
          node --check app/src/main/assets/deepsyq.js
          node --check tests/agent-a-base46-featured-template-link.spec.mjs
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test tests/agent-a-base46-featured-template-link.spec.mjs --project=chromium --project=webkit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: base46-featured-deeplink-browser-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

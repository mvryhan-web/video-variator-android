name: Owner read-only exact MAIN versus selective preview HTML comparison
on:
  push:
    branches: [owner-ui-selective-main-release-20261110]
    paths: ['.github/workflows/owner-ui-selective-preview-diff-20261110.yml']
permissions: {contents: read}
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Compare live and preview without writes or credentials
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {createHash} from 'node:crypto';
          const sha=b=>createHash('sha256').update(b).digest('hex');
          const bases=['https://deepsyq.app','https://owner-tools-scoped-20261110.deepsyq.pages.dev'];
          for(const name of ['index.html','free-tools.html','jarvix-chat.html','canvas.html','my-creations.html','audio-studio.html','ai-apps.html','deepsyq.html','pricing.html','video-uniquifier.html']){
            const results=await Promise.all(bases.map(async base=>{
              const r=await fetch(base+'/'+name+'?audit='+Date.now(),{headers:{'cache-control':'no-cache'},signal:AbortSignal.timeout(20000)});
              return {status:r.status,body:await r.text(),type:r.headers.get('content-type')};
            }));
            const [a,b]=results;
            let i=0;while(i<a.body.length&&i<b.body.length&&a.body[i]===b.body[i])i++;
            console.log('OWNER_SELECTIVE_PREVIEW_DIFF',JSON.stringify({name,prodStatus:a.status,previewStatus:b.status,prodLen:a.body.length,previewLen:b.body.length,identical:a.body===b.body,prodHash:sha(a.body),previewHash:sha(b.body),firstMismatch:i,mainContext:a.body.slice(Math.max(0,i-110),i+200),previewContext:b.body.slice(Math.max(0,i-110),i+200)}));
          }
          JS

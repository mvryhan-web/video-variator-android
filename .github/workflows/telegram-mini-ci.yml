name: Telegram Mini App checks
on:
  pull_request:
    paths:
      - 'server/telegram*.js'
      - 'server/tests/telegram*.mjs'
      - 'app/src/main/assets/telegram-mini.*'
      - 'tests/telegram-mini-browser.spec.mjs'
      - 'tests/telegram-mini-real-video.spec.mjs'
      - '.github/workflows/telegram-mini-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telegram-mini:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Syntax check
        run: |
          node --check server/telegram.js
          node --check server/telegram-mini.js
          node --check server/telegram-stars.js
          node --check server/telegram-account.js
          node --check server/telegram-support.js
          node --check server/db.js
          node --check app/src/main/assets/telegram-mini.js
          node --check app/src/main/assets/telegram-account-link.js
          node --check app/src/main/assets/telegram-support-admin.js
      - name: Telegram identity, subscriptions, and account unit tests
        run: node --test server/tests/telegram-mini.test.mjs server/tests/telegram-stars.test.mjs server/tests/telegram-account.test.mjs
      - name: Install mobile browser engines and tiny video test fixture
        run: |
          npx playwright install --with-deps chromium webkit
          sudo apt-get install -y ffmpeg
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=160x120:rate=15 -t 1 -c:v libx264 -pix_fmt yuv420p -an /tmp/telegram-mini-smoke.mp4
      - name: Simulated Android and iOS Telegram video/purchase flow
        run: npx playwright test tests/telegram-mini-browser.spec.mjs --project=mobile-chromium --project=mobile-webkit
      - name: Verify real FFmpeg MP4 video output in mobile Chromium
        run: npx playwright test tests/telegram-mini-real-video.spec.mjs --project=mobile-chromium



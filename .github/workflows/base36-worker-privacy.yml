name: BASE 36 worker crash log privacy

on:
  pull_request:
    paths:
      - 'server/generation-worker.js'
      - 'tests/base36-worker-crash-privacy.mjs'
      - '.github/workflows/base36-worker-privacy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify worker crash logs redact arbitrary secrets
        run: |
          node --check server/generation-worker.js
          node --test tests/base36-worker-crash-privacy.mjs

name: Agent C C8-C10 routes and Everyday Audio validation (no spend)
on:
  pull_request:
    branches: [deepsyq-platform]
    paths:
      - 'app/src/main/assets/audio-studio.js'
      - 'tests/agent-c-base1-c8-c10-audio.spec.mjs'
      - '.github/workflows/agent-c-base1-c8-c10-audio.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c8-c10-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Restore dependencies
        run: npm ci --no-audit --no-fund
      - name: Install 5 desktop/mobile engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: C8/C9/C10 real browser behavior on four viewport sizes, zero paid POST
        run: npx playwright test tests/agent-c-base1-c8-c10-audio.spec.mjs --project=chromium --project=firefox --project=webkit --project=mobile-webkit --project=mobile-chromium
      - name: Preserve failing traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agent-c-c8-c10-audio-test-errors
          path: test-results/
          if-no-files-found: ignore

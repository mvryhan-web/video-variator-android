name: BASE 1 coordinator no-spend journeys
on:
  pull_request:
    paths:
      - 'tests/base1-coordinator-journeys.spec.mjs'
      - '.github/workflows/base1-coordinator-journeys.yml'
      - 'app/src/main/assets/deepsyq.html'
      - 'app/src/main/assets/home-experience.js'
      - 'app/src/main/assets/generate-studio.js'
      - 'app/src/main/assets/studio-handoff.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-visitor-handoffs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --check tests/base1-coordinator-journeys.spec.mjs
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify Image, Video, Audio, Agent and History without provider calls
        run: npx playwright test tests/base1-coordinator-journeys.spec.mjs --project=chromium --project=firefox --project=webkit --project=mobile-chromium --project=mobile-webkit --workers=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: base1-coordinator-browser-evidence
          path: test-results/
          retention-days: 7

name: BASE 32 safe Studio errors browser checks

on:
  push:
    branches: [deepsyq-platform]
    paths:
      - 'app/src/main/assets/generate-studio.js'
      - 'tests/agent-a-base32-safe-errors.spec.mjs'
      - 'tests/agent-b-base32-truthful-errors.spec.mjs'
      - '.github/workflows/base32-safe-errors.yml'
  pull_request:
    paths:
      - 'app/src/main/assets/generate-studio.js'
      - 'tests/agent-a-base32-safe-errors.spec.mjs'
      - 'tests/agent-b-base32-truthful-errors.spec.mjs'
      - '.github/workflows/base32-safe-errors.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: base32-safe-errors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safe-error-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: |
          node --check app/src/main/assets/generate-studio.js
          node --check tests/agent-a-base32-safe-errors.spec.mjs
          node --check tests/agent-b-base32-truthful-errors.spec.mjs
          node --test tests/generation-errors-unit.mjs
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test tests/agent-a-base32-safe-errors.spec.mjs tests/agent-b-base32-truthful-errors.spec.mjs --project=chromium --project=webkit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: base32-safe-errors-browser-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

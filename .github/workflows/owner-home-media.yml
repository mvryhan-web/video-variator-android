name: Owner supplied Home media technical checks
on:
  pull_request:
    branches: [deepsyq-platform]
    paths:
      - 'app/src/main/assets/media/home/owner-20261018/**'
      - 'server/deepsyq-preview.js'
      - 'tests/deepsyq-preview.mjs'
      - 'scripts/publish-owner-home-media.mjs'
      - 'tests/owner-home-media*'
      - '.github/workflows/owner-home-media.yml'
  push:
    branches: [agent-b-home-v01-v13-original-frames-20261018]
    paths:
      - 'app/src/main/assets/media/home/owner-20261018/**'
      - 'server/deepsyq-preview.js'
      - 'tests/deepsyq-preview.mjs'
      - 'scripts/publish-owner-home-media.mjs'
      - 'tests/owner-home-media*'
      - '.github/workflows/owner-home-media.yml'
permissions:
  contents: read
jobs:
  owner-media:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: ''
      STRIPE_SECRET_KEY: ''
      GEMINI_API_KEY: ''
      BYTEPLUS_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: node --test tests/owner-home-media-unit.mjs tests/deepsyq-preview.mjs
      - run: npx playwright install --with-deps chromium webkit
      - name: Real supplied MP4 playback, ended transitions and mobile bounds
        run: npx playwright test tests/owner-home-media.spec.mjs --project=chromium --project=webkit --project=mobile-chromium --project=mobile-webkit --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-home-media-browser-evidence
          path: test-results/
          retention-days: 7

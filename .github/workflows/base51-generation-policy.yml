name: BASE 51 fail-closed AI job policy
on:
  push:
    branches: [base51-policy-clean-20261016]
    paths:
      - 'server/generation-policy.js'
      - 'server/generation-readiness.js'
      - 'tests/generation-policy-unit.mjs'
      - 'tests/generation-readiness-unit.mjs'
      - '.github/workflows/base51-generation-policy.yml'
  pull_request:
    branches: [deepsyq-platform]
    paths:
      - 'server/generation-policy.js'
      - 'server/generation-readiness.js'
      - 'tests/generation-policy-unit.mjs'
      - 'tests/generation-readiness-unit.mjs'
      - '.github/workflows/base51-generation-policy.yml'
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Syntax
        run: |
          node --check server/generation-policy.js
          node --check server/generation-readiness.js
          node --check tests/generation-policy-unit.mjs
      - name: Bounded rate guards, entitlements and existing Studio regression
        run: node --test tests/generation-policy-unit.mjs tests/generation-entitlements-unit.mjs tests/generation-studio-unit.mjs tests/generation-readiness-unit.mjs

name: DEEPSYQ SEO audit batch 7 - Audio and Avatar metadata only
on:
  push:
    branches: [deepsyq-platform]
    paths:
      - '.github/workflows/deepsyq-seo-audit-batch7.yml'
      - 'app/src/main/assets/audio-studio.html'
      - 'app/src/main/assets/avatar-studio.html'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deepsyq-surgical-pages-release
  cancel-in-progress: false
jobs:
  metadata-only:
    if: >-
      github.ref == 'refs/heads/deepsyq-platform' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.head_commit.message == 'release(DEEPSYQ SEO): publish batch 7 only audio avatar metadata')
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify missing metadata completed without interfering with pages
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/deepsyq_surgical_publish.py
          python -m unittest discover -s tests -p 'test_deepsyq_surgical_publish.py' -v
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from importlib.util import spec_from_file_location,module_from_spec
          spec=spec_from_file_location('surgical','scripts/deepsyq_surgical_publish.py')
          mod=module_from_spec(spec);spec.loader.exec_module(mod)
          files=['audio-studio.html','avatar-studio.html']
          assert mod.allowed_hash_reuse(files)
          assert not mod.allowed_hash_reuse(['audio-studio.html'])
          class Head(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.meta={};self.canonical=[];self.h1=0
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag=='meta':
                      key=d.get('property') or d.get('name')
                      if key:self.meta.setdefault(key,[]).append(d.get('content',''))
                  if tag=='link' and d.get('rel')=='canonical':self.canonical.append(d.get('href'))
                  if tag=='h1':self.h1+=1
          for name in files:
              src=(Path('app/src/main/assets')/name).read_text(encoding='utf-8')
              m=Head();m.feed(src)
              assert m.canonical==['https://deepsyq.app/'+name],(name,m.canonical)
              assert m.h1==1,(name,m.h1)
              for key in ('description','og:title','og:description','og:type','og:url'):
                  assert len(m.meta.get(key,[]))==1,(name,key,m.meta.get(key))
                  assert m.meta[key][0].strip(),(name,key)
              assert m.meta['og:type'][0]=='website'
              assert m.meta['og:url'][0]==m.canonical[0]
              assert 'summary_large_image' in m.meta.get('twitter:card',[]),name
          print('SEO_AUDIT_BATCH_7_METADATA_PASS')
          PY
      - name: Install exact uploader dependencies
        run: python -m pip install --disable-pip-version-check "requests==2.32.3" "blake3==1.0.8"
      - name: Publish only Audio and Avatar HTML keeping all previous assets
        run: |
          python scripts/deepsyq_surgical_publish.py \
            --mode publish \
            --files audio-studio.html,avatar-studio.html \
            --commit "$GITHUB_SHA"

name: DEEPSYQ SEO audit batch 6 - design gallery and Telegram preview only
on:
  push:
    branches: [deepsyq-platform]
    paths:
      - '.github/workflows/deepsyq-seo-audit-batch6.yml'
      - 'app/src/main/assets/design-gallery.html'
      - 'app/src/main/assets/telegram-free-mini.html'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deepsyq-surgical-pages-release
  cancel-in-progress: false
jobs:
  metadata-only:
    if: >-
      github.ref == 'refs/heads/deepsyq-platform' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.head_commit.message == 'release(DEEPSYQ SEO): publish batch 6 two unfinished page heads')
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify existing uploader and exact metadata-only changes
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/deepsyq_surgical_publish.py
          python -m unittest discover -s tests -p 'test_deepsyq_surgical_publish.py' -v
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from importlib.util import spec_from_file_location,module_from_spec
          spec=spec_from_file_location('surgical','scripts/deepsyq_surgical_publish.py')
          mod=module_from_spec(spec);spec.loader.exec_module(mod)
          files=['design-gallery.html','telegram-free-mini.html']
          assert mod.allowed_hash_reuse(files)
          assert not mod.allowed_hash_reuse(files[:1])
          class PageMeta(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.meta={}
                  self.canonical=[]
                  self.h1=0
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag=='meta':
                      k=d.get('property') or d.get('name')
                      if k:self.meta.setdefault(k,[]).append(d.get('content',''))
                  if tag=='link' and d.get('rel')=='canonical':self.canonical.append(d.get('href'))
                  if tag=='h1':self.h1+=1
          for f in files:
              s=(Path('app/src/main/assets')/f).read_text(encoding='utf8')
              c=PageMeta();c.feed(s)
              assert c.h1==1,(f,c.h1)
              assert c.canonical==['https://deepsyq.app/'+f],(f,c.canonical)
              for key in ('description','og:title','og:description','og:type','og:url','twitter:card'):
                  assert len(c.meta.get(key,[]))==1,(f,key,c.meta.get(key))
                  assert len(c.meta[key][0].strip())>0,(f,key)
              assert c.meta['og:url'][0]==c.canonical[0]
              assert c.meta['og:type'][0]=='website'
              assert c.meta['twitter:card'][0]=='summary'
          print('SEO_AUDIT_BATCH_6_METADATA_PASS')
          PY
      - name: Install uploader dependencies
        run: python -m pip install --disable-pip-version-check "requests==2.32.3" "blake3==1.0.8"
      - name: Publish exactly two HTML pages and verify unchanged Worker and bindings
        run: |
          python scripts/deepsyq_surgical_publish.py \
            --mode publish \
            --files design-gallery.html,telegram-free-mini.html \
            --commit "$GITHUB_SHA"

name: Agent D D18 Stripe net receipt verifier (no spend)
on:
  pull_request:
    branches: [deepsyq-platform]
    paths:
      - 'server/generation-stripe-net-revenue.js'
      - 'tests/generation-stripe-net-revenue-unit.mjs'
      - '.github/workflows/agent-d-d18-stripe-net-verifier.yml'
permissions:
  contents: read
jobs:
  offline-stripe-net-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      DATABASE_URL: ''
      STRIPE_SECRET_KEY: ''
      STRIPE_WEBHOOK_SECRET: ''
      OPENAI_API_KEY: ''
      GEMINI_API_KEY: ''
      BYTEPLUS_API_KEY: ''
      AI_BILLING_ENABLED: 'false'
      AI_PUBLIC_GENERATION_ENABLED: 'false'
      AI_PURCHASED_ONLY_DISPATCH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Parse isolated verifier
        run: |
          node --check server/generation-stripe-net-revenue.js
          node --check tests/generation-stripe-net-revenue-unit.mjs
      - name: Exercise synthetic Stripe receipts, refunds, taxes, mode and identity
        run: node --test tests/generation-stripe-net-revenue-unit.mjs

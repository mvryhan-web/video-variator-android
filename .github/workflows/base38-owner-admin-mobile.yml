name: BASE 38 owner Admin mobile layout

concurrency:
  group: ci-base38-owner-admin-mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - 'app/src/main/assets/deepsyq-admin.css'
      - 'tests/base38-owner-admin-mobile.spec.mjs'
      - '.github/workflows/base38-owner-admin-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-admin-responsive:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Prefer official Ubuntu archive for browser dependencies
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify dedicated Admin browser test syntax
        run: node --check tests/base38-owner-admin-mobile.spec.mjs
      - run: npx playwright install --with-deps chromium webkit
      - name: Check owner Admin responsive 320/390/1440 without paid calls
        run: npx playwright test tests/base38-owner-admin-mobile.spec.mjs --project=chromium --project=mobile-chromium --project=webkit --project=mobile-webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: base38-admin-mobile-evidence
          path: test-results/
          retention-days: 7

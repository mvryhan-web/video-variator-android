name: BASE 5 Veo MP4 Result Verification
on:
  pull_request:
    paths:
      - 'server/generation-provider.js'
      - 'tests/base5-google-video-media-unit.mjs'
      - 'server/generation-video-cancel.js'
      - 'tests/base5-provider-video-cancellation-unit.mjs'
      - 'server/generation-video-submit-uncertainty.js'
      - 'server/generation-studio.js'
      - 'tests/base5-video-submit-uncertainty-unit.mjs'
      - '.github/workflows/base5-veo-media.yml'
permissions:
  contents: read
jobs:
  google-video-media:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax safety
        run: |
          node --check server/generation-provider.js
          node --check tests/base5-google-video-media-unit.mjs
          node --check server/generation-video-cancel.js
          node --check tests/base5-provider-video-cancellation-unit.mjs
          node --check server/generation-video-submit-uncertainty.js
          node --check server/generation-studio.js
          node --check tests/base5-video-submit-uncertainty-unit.mjs
      - name: Non-paid Veo result security regressions
        run: node --test tests/base5-google-video-media-unit.mjs tests/base5-provider-video-cancellation-unit.mjs tests/base5-video-submit-uncertainty-unit.mjs

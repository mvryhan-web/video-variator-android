name: Deepsyq execution checklist integrity
on:
  push:
    branches: [main]
    paths: ['docs/execution/**']
  pull_request:
    paths: ['docs/execution/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all seven canonical blocks
        run: node docs/execution/validate-checklists.mjs

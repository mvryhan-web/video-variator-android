name: Owner mobile Home JARVIX spotlight left alignment (CSS only)
on:
  push:
    branches: [deepsyq-platform]
    paths:
      - '.github/workflows/owner-home-jarvix-left-only-release-20261110.yml'
permissions:
  contents: read
concurrency:
  group: deepsyq-surgical-pages-release
  cancel-in-progress: false
jobs:
  publish-single-css:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deepsyq-platform
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify syntax and exact single CSS change
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/owner_home_jarvix_one_css_release_20261110.py
          python - <<'PY'
          from pathlib import Path
          from subprocess import check_output
          cur=Path('app/src/main/assets/deepsyq.css').read_bytes()
          old=check_output(['git','show','06bb977014d52cbf093db41975023b834aaacbda^:app/src/main/assets/deepsyq.css'])
          a=b'display:flex;flex-direction:row;align-items:center;gap:10px;'
          b=b'display:flex;flex-direction:row;align-items:center;justify-content:flex-start!important;gap:10px;'
          assert old.count(a)==1 and cur==old.replace(a,b,1), 'Unrelated CSS changes; no deploy'
          print('OWNER_APPROVED_ONE_CSS_DECLARATION')
          PY
      - name: Install existing authenticated Cloudflare uploader dependencies
        run: python -m pip install --disable-pip-version-check 'requests==2.32.3' 'blake3==1.0.8'
      - name: Deploy exact LIVE asset manifest plus only one changed CSS hash
        shell: bash
        run: |
          set -euo pipefail
          python scripts/owner_home_jarvix_one_css_release_20261110.py

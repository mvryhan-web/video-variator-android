name: Canvas responsive — live production read-only audit
on:
  push:
    branches: [owner-canvas-responsive-window-20261110]
    paths: ['.github/workflows/owner-canvas-responsive-live-audit-20261110.yml']
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Confirm canonical release, responsive CSS, demo photos and Worker unchanged
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const a=process.env.CLOUDFLARE_ACCOUNT_ID,t=process.env.CLOUDFLARE_API_TOKEN;
          const p=await fetch('https://api.cloudflare.com/client/v4/accounts/'+a+'/pages/projects/deepsyq',{headers:{Authorization:'Bearer '+t}});
          if(!p.ok)throw Error('Cloudflare project unavailable');
          const v=await p.json();if(!v.success)throw Error('Cloudflare error');const project=v.result;
          const base='https://deepsyq.app/';
          const [h,c,j,photo]=await Promise.all(['canvas.html','canvas-workspace.css','canvas-workspace.js','media/canvas-demos/20261110/canvas-demo-13.webp'].map(async n=>{
            const response=await fetch(base+n+'?responsiveAudit='+Date.now(),{headers:{'cache-control':'no-cache'}});return {status:response.status,text:n.endsWith('.webp')?'':await response.text()};
          }));
          const status={canonical:project.canonical_deployment?.id,worker:project.canonical_deployment?.uses_functions,
            html:h.status,css:c.status,js:j.status,demo:photo.status,
            responsiveLoader:h.text.includes('canvas-workspace.css?v=20261110-ux4'),
            responsiveStyles:c.text.includes('container-name:canvas-editor-area')&&c.text.includes('@container canvas-editor-area (max-width:765px)'),
            preserveJS:h.text.includes('canvas-workspace.js?v=20261110-ux3'),gallery:h.text.includes('id="cwGallery"')};
          console.log('OWNER_CANVAS_RESPONSIVE_LIVE',JSON.stringify(status));
          if(!status.worker||status.html!==200||status.css!==200||status.js!==200||status.demo!==200||!status.responsiveLoader||!status.responsiveStyles||!status.preserveJS||!status.gallery)throw Error('Responsive Canvas missing or overwritten on MAIN');
          JS

name: Agent C C15 Audio paid cloud copy and local STT (no spend)
on:
  pull_request:
    branches: [deepsyq-platform]
    paths:
      - 'app/src/main/assets/audio-studio.js'
      - 'server/speech.js'
      - 'tests/speech-unit.mjs'
      - 'tests/agent-c-c15-audio-voice-copy.spec.mjs'
      - '.github/workflows/agent-c-c15-audio-voice-copy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c15-real-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ''
      STRIPE_SECRET_KEY: ''
      GOOGLE_API_KEY: ''
      BYTEPLUS_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --check app/src/main/assets/audio-studio.js
      - run: node --check tests/agent-c-c15-audio-voice-copy.spec.mjs
      - name: Server TTS consent, paid-tier and provider adapter tests
        run: node --test tests/speech-unit.mjs
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Four locales, real browsers, disabled and enabled synthetic config, no paid calls
        run: npx playwright test tests/agent-c-c15-audio-voice-copy.spec.mjs --project=chromium --project=firefox --project=webkit --project=mobile-chromium --project=mobile-webkit --workers=2
      - name: Existing C14 route guard
        run: npx playwright test tests/agent-c-c14-tools-voice-truth.spec.mjs --project=chromium --workers=1
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agent-c-c15-browser-evidence
          path: test-results/
          if-no-files-found: ignore

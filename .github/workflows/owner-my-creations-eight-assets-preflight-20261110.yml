name: Owner My Creations 8 assets production preflight (READ ONLY)
on:
  push:
    branches: [deepsyq-platform]
    paths: ['.github/workflows/owner-my-creations-eight-assets-preflight-20261110.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Read-only baseline of existing production Worker and image paths
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const account=process.env.CF_ACCOUNT,token=process.env.CF_TOKEN;
          assert(account && token,'Cloudflare token/account unavailable');
          const base='https://api.cloudflare.com/client/v4/accounts/'+account+'/pages/projects/deepsyq';
          const hdr={Authorization:'Bearer '+token};
          async function cf(path){
            const r=await fetch(path,{headers:hdr,signal:AbortSignal.timeout(14000)});
            const j=await r.json().catch(()=>({}));
            if(!r.ok||!j.success){console.log('READ_ONLY_FAILURE',JSON.stringify({status:r.status,path:new URL(path).pathname,errors:j.errors?.map(x=>x.code)}));throw Error('read-only Cloudflare API blocked')}
            return j.result;
          }
          const p=await cf(base),id=p.canonical_deployment?.id;
          assert(id,'Current production deployment missing');
          const d=await cf(base+'/deployments/'+id);
          const names=['crystal-bloom','eclipse-portal','velvet-rain','bioluminescent-tide','skyward-citadel','porcelain-grace','neon-rider','sculpted-sound'].map(x=>'/media/my-creations/showcase/'+x+'.webp');
          const available=names.filter(x=>Object.prototype.hasOwnProperty.call(d.files||{},x));
          const deployedSha=d.deployment_trigger?.metadata?.commit_hash||p.canonical_deployment?.deployment_trigger?.metadata?.commit_hash||'';
          const worker=p.production_script_name||'';
          console.log('MY_CREATIONS_ASSET_PRODUCTION_PREFLIGHT',JSON.stringify({canonicalId:id,branch:p.production_branch,hasWorker:d.uses_functions===true,workerNamed:worker.startsWith('pages-worker--'),manifestCount:Object.keys(d.files||{}).length,assetKeysAlreadyPresent:available.length,missingAssetKeys:names.filter(x=>!available.includes(x)),deploymentCommit:deployedSha,sourceCommitInCurrentGitHubBranch:deployedSha===process.env.GITHUB_SHA}));
          if(worker){
            for(const suffix of ['/content/v2','/settings']){
              const u='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/'+encodeURIComponent(worker)+suffix;
              const r=await fetch(u,{headers:hdr,signal:AbortSignal.timeout(14000)});
              console.log('MY_CREATIONS_WORKER_READ',JSON.stringify({kind:suffix,status:r.status,contentType:r.headers.get('content-type')?.split(';')[0]}));
              await r.arrayBuffer();
            }
          }
          const old=await cf(base+'/deployments/b927d0f6-1871-4ff8-a781-4ebb2687d3c7');
          const oldFiles=old.files||{},nowFiles=d.files||{};
          const added=Object.keys(nowFiles).filter(x=>!Object.prototype.hasOwnProperty.call(oldFiles,x));
          const removed=Object.keys(oldFiles).filter(x=>!Object.prototype.hasOwnProperty.call(nowFiles,x));
          const overwritten=Object.keys(oldFiles).filter(x=>Object.prototype.hasOwnProperty.call(nowFiles,x)&&oldFiles[x]!==nowFiles[x]);
          const allowed=new Set(names);
          const exactDiff=added.length===8 && added.every(x=>allowed.has(x)) && removed.length===0 && overwritten.length===0;
          console.log('MY_CREATIONS_EXACT_MANIFEST_DIFF',JSON.stringify({oldId:old.id,newId:d.id,added:added.length,removed:removed.length,overwritten:overwritten.length,onlyEightApproved:exactDiff,workerBefore:old.uses_functions,workerAfter:d.uses_functions}));
          const {createHash}=await import('node:crypto');
          const expected={
            'crystal-bloom':'3b5ccc6d24e19f4aeca58c8a6271df7b6b843fef6f2e16fd0217a9891c6ee223',
            'eclipse-portal':'0e022345832dd617e106524425d4c3d95aafba39aff321cfbf39d7f966f10ffa',
            'velvet-rain':'b47568ca40a2ce91d14224285cd5618cc4282bb3df47df5e1c70faee0cee6576',
            'bioluminescent-tide':'c17728af71e85d06cad1d67e7f2474c03ccc4e9f2cc1cc374864cbac74054ee2',
            'skyward-citadel':'417e43f68bcf4f97d2dedb1ab3ad5ca2fa5b13fe49a06adbb2d12126140c2abc',
            'porcelain-grace':'c1c0d06e50be96c351cb694ab4d494f8247ad6f1ba07b3a4c83f7e019c61ba5c',
            'neon-rider':'7a41c80a0fe7c10f6a6fc164c57d03d9179fa61e797d98d94072ea7051e0beeb',
            'sculpted-sound':'8b52a4652e6df8ba160423166b5ac50f56e058d20f3e77e12bf075e1c74f51e2'
          };
          let allMatch=true;
          for(const [n,sha] of Object.entries(expected)){
            const u='https://deepsyq.app/media/my-creations/showcase/'+n+'.webp?check='+Date.now();
            try{
              const r=await fetch(u,{signal:AbortSignal.timeout(17000),headers:{'Cache-Control':'no-cache'}});
              const buf=Buffer.from(await r.arrayBuffer());
              const hash=createHash('sha256').update(buf).digest('hex');
              const match=r.status===200&&r.headers.get('content-type')?.includes('image/webp')&&hash===sha;
              console.log('MY_CREATIONS_ORIGINAL_LIVE_BYTE_CHECK',JSON.stringify({file:n,status:r.status,bytes:buf.length,exactOriginal:match}));
              if(!match)allMatch=false;
            }catch(error){allMatch=false;console.log('MY_CREATIONS_ORIGINAL_LIVE_BYTE_CHECK',JSON.stringify({file:n,error:String(error).slice(0,120),exactOriginal:false}));}
          }
          console.log('MY_CREATIONS_FINAL_STATUS',JSON.stringify({eightOriginalsMatch:allMatch,exactEightAssetManifestDiff:exactDiff,workerStillLive:d.uses_functions===true}));
          if(!allMatch||d.uses_functions!==true)process.exitCode=2;
          console.log('READ_ONLY_NO_PUBLICATION',true);
          JS
